              settings: state.settings,
              text:
                `✅ *MEU CONTROLE MAX – MENSAGEM RECEBIDA!*\n\n` +
                `💬 *Você escreveu:* "${parsed.raw}"\n` +
                `ℹ️ No momento não há nenhuma atividade cadastrada na agenda para vincular esta resposta.\n\n` +
                `💡 _Para criar uma atividade direto por aqui, envie:_\n` +
                `*"Agendar [nome da tarefa] às [horário]"*`,
            }).catch(() => {});
            return true;
          }

          // 2. Identifica a tarefa alvo de forma inteligente:
          // Primeiro verifica se o texto do usuário menciona alguma palavra do título de uma tarefa específica:
          const lowerRaw = parsed.raw.toLowerCase();
          const matchedByKeyword = state.tasks.find(t => {
            if (!t.title) return false;
            const words = t.title
              .toLowerCase()
              .split(/\s+/)
              .filter(w => w.length >= 4 && !['para', 'como', 'pelo', 'pela', 'fazer'].includes(w));
            return words.some(w => lowerRaw.includes(w));
          });

          const lastAlertedTask = lastAlertedTaskIdRef.current
            ? state.tasks.find(t => t.id === lastAlertedTaskIdRef.current)
            : null;

          const targetTask =
            matchedByKeyword ||
            activeTelegramPopup?.task ||
            (lastAlertedTask && lastAlertedTask.status !== 'completed' ? lastAlertedTask : null) ||
            state.tasks.find(t => t.date === todayISO && t.status === 'notified') ||
            state.tasks.find(t => t.date === todayISO && ['pending', 'overdue', 'in_progress'].includes(t.status)) ||
            state.tasks.find(t => t.date === todayISO && t.status === 'confirmed') ||
            state.tasks.find(t => t.status !== 'completed' && t.status !== 'cancelled') ||
            state.tasks.find(t => t.date === todayISO) ||
            state.tasks[0];

          if (!targetTask) return false;

          if (parsed.action === 'not_completed_rollover') {
            setLastWhatsAppMonitorEvent({
              text: parsed.raw,
              actionLabel: '📌 Não concluída ➔ Movida p/ TOPO de Amanhã',
              taskTitle: targetTask.title,
              time: nowStr,
            });
            handleRolloverToTomorrow(targetTask.id, parsed.note || '', parsed.raw);
          } else if (parsed.action === 'complete') {
            setLastWhatsAppMonitorEvent({
              text: parsed.raw,
              actionLabel: '🏆 Atividade marcada como CONCLUÍDA',
              taskTitle: targetTask.title,
              time: nowStr,
            });
            handleCompleteTaskFromWhatsApp(targetTask.id, 'whatsapp', parsed.note || '', parsed.raw);
          } else if (parsed.action === 'snooze') {
            setLastWhatsAppMonitorEvent({
              text: parsed.raw,
              actionLabel: `⏰ Adiada em +${parsed.minutes || 10} min`,
              taskTitle: targetTask.title,
              time: nowStr,
            });
            handleSnoozeTask(targetTask.id, parsed.minutes || 10);
          } else if (parsed.action === 'cancel') {
            setLastWhatsAppMonitorEvent({
              text: parsed.raw,
              actionLabel: '❌ Alerta cancelado via WhatsApp',
              taskTitle: targetTask.title,
              time: nowStr,
            });
            handleCancelAlert(targetTask.id);
          } else if (parsed.action === 'confirm') {
            setLastWhatsAppMonitorEvent({
              text: parsed.raw,
              actionLabel: '✅ Recebimento Confirmado via WhatsApp',
              taskTitle: targetTask.title,
              time: nowStr,
            });
            handleConfirmTaskReceipt(targetTask.id, 'whatsapp', 0, '', parsed.raw);
          } else if (parsed.action === 'confirm_and_note') {
            if ((targetTask.status === 'confirmed' || targetTask.status === 'completed') && parsed.note) {
              setLastWhatsAppMonitorEvent({
                text: parsed.raw,
                actionLabel: `📝 Observação adicionada: "${parsed.note}"`,
                taskTitle: targetTask.title,
                time: nowStr,
              });
              handleAddObservationFromWhatsApp(targetTask.id, parsed.note, parsed.raw);
            } else {
              setLastWhatsAppMonitorEvent({
                text: parsed.raw,
                actionLabel: `✅ Confirmado + 📝 Anotado: "${parsed.note}"`,
                taskTitle: targetTask.title,
                time: nowStr,
              });
              handleConfirmTaskReceipt(targetTask.id, 'whatsapp', 0, parsed.note, parsed.raw);
            }
          }
          return true;
        },
        [
          state.tasks,
          state.settings,
          activeTelegramPopup,
          handleConfirmTaskReceipt,
          handleCompleteTaskFromWhatsApp,
          handleRolloverToTomorrow,
          handleAddObservationFromWhatsApp,
          handleSendDailySummaryWhatsApp,
          handleCreateTaskFromWhatsApp,
          handleSnoozeTask,
          handleCancelAlert,
          showToast,
        ]
      );

      // Força a leitura imediata da última mensagem que o usuário escreveu no WhatsApp (botão manual ou diagnóstico)
      const handleForceReadWhatsAppNow = useCallback(async () => {
        try {
          const idInst = (state.settings?.greenApiIdInstance || '710722790234').trim();
          const tokInst = (state.settings?.greenApiToken || 'bc3f8075a090411296a983a516a499d80a6ec55c88f648c2bf').trim();
          const prefix = idInst.slice(0, 4);
          const baseHost = (state.settings?.greenApiUrl || `https://${prefix}.api.greenapi.com`).trim().replace(/\/$/, '');
          const targetPhone = state.settings?.whatsappNumber || state.settings?.phone || '+5589981026502';
          const chatIds = getBrazilWhatsAppChatIds(targetPhone);

          let latestUserMsg = null;
          for (const chatId of chatIds) {
            const res = await fetch(`${baseHost}/waInstance${idInst}/getChatHistory/${tokInst}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chatId, count: 10 }),
            });
            if (res.ok) {
              const history = await res.json();
              if (Array.isArray(history)) {
                for (const msg of history) {
                  const text = extractGreenApiMessageText(msg);
                  if (text && !isAutomatedBotMessage(text, msg.idMessage)) {
                    if (!latestUserMsg || (msg.timestamp || 0) > (latestUserMsg.timestamp || 0)) {
                      latestUserMsg = { idMessage: msg.idMessage, text, timestamp: msg.timestamp || 0 };
                    }
                    break;
                  }
                }
              }
            }
          }

          if (latestUserMsg && latestUserMsg.text) {
            processedWhatsAppMsgIdsRef.current.add(latestUserMsg.idMessage);
            savePersistedProcessedWaIds(processedWhatsAppMsgIdsRef.current);
            processIncomingWhatsAppReplyText(latestUserMsg.text);
          } else {
            showToast('📡 Conectado ao WhatsApp! Nenhuma mensagem sua encontrada após os alertas recentes.', 'info');
          }
        } catch (e) {
          showToast('⚠️ Erro ao consultar histórico do WhatsApp. Verifique sua conexão.', 'warning');
        }
      }, [state.settings, processIncomingWhatsAppReplyText, showToast]);

      // Polling em tempo real (a cada 2 segundos) das respostas do usuário no WhatsApp via Green-API
      useEffect(() => {
        let isMounted = true;
        const runPoll = async () => {
          try {
            const replies = await pollGreenApiUserReplies({
              settings: state.settings,
              processedIdsSet: processedWhatsAppMsgIdsRef.current,
            });
            if (!isMounted || !replies || replies.length === 0) return;
            for (const reply of replies) {
              processIncomingWhatsAppReplyText(reply.text);
            }
          } catch (e) {}
        };

        runPoll();
        const interval = setInterval(runPoll, 2000);
        return () => {
          isMounted = false;
          clearInterval(interval);
        };
      }, [state.settings, processIncomingWhatsAppReplyText]);

      const handleHangupUnanswered = useCallback(
        (task) => {
          const nowStr = new Date().toLocaleTimeString('pt-BR');
          setState(prev => ({
            ...prev,
            callLogs: [
              {
                id: 'call-miss-' + Date.now(),
                taskId: task.id,
                taskTitle: task.title,
                toNumber: prev.settings.phone,
                attempt: 1,
                status: 'no_answer',
                dtmfDigit: '-',
                durationSeconds: 0,
                timestamp: `Hoje, ${nowStr}`,
                script: task.customVoiceMessage || prev.settings.defaultVoiceTemplate,
              },
              ...prev.callLogs,
            ],
          }));
          setActivePhoneCall(null);
          showToast(
            `📵 Ligação não atendida. Nova tentativa agendada em ${state.settings.callRetryIntervalMinutes} min (respeitando limite de ${state.settings.maxCallAttempts}x).`,
            'warning'
          );
        },
        [state.settings, showToast]
      );

      // =======================================================================
      // SIMULAÇÃO AO VIVO DO FLUXO COMPLETO (TELEGRAM -> SEM RESPOSTA -> LIGAÇÃO)
      // =======================================================================
      const handleRunLiveFlowSimulation = useCallback(
        (taskToUse) => {
          const target = taskToUse || state.tasks[0];
          if (!target) return;
          if (escalationTimerRef.current) clearTimeout(escalationTimerRef.current);

          handleTriggerTelegramAlert(
            target,
            '1º Alerta no Horário — Se não confirmar em 6s, escala para Ligação 📞'
          );
          showToast(
            '🚀 Fluxo iniciado! 1º Alerta enviado no Telegram. Se você não clicar em Confirmar em 6 segundos, o Meu Controle Max vai te ligar!',
            'info'
          );

          escalationTimerRef.current = setTimeout(() => {
            showToast('⚠️ Telegram ignorado! Escalonando cobrança para Ligação Telefônica Automática...', 'warning');
            handleTriggerVoiceCall(target, 1);
          }, 6500);
        },
        [state.tasks, handleTriggerTelegramAlert, handleTriggerVoiceCall, showToast]
      );

      // Polling real de cliques nos botões inline do Telegram + Auto-Detecção de Chat ID sem precisar clicar
      useEffect(() => {
        const token = state.settings.telegramBotToken?.trim();
        if (!token) return;
        const interval = setInterval(async () => {
          try {
            const offset = lastTelegramUpdateIdRef.current
              ? `?offset=${lastTelegramUpdateIdRef.current + 1}`
              : '';
            const res = await fetch(`https://api.telegram.org/bot${token}/getUpdates${offset}`);
            const data = await res.json();
            if (!data.ok || !Array.isArray(data.result)) return;
            for (const upd of data.result) {
              lastTelegramUpdateIdRef.current = upd.update_id;

              // Se ainda não tinha Chat ID salvo e chegou mensagem no Bot, salva sozinho e envia confirmação!
              const msg = upd.message;
              if (msg && msg.chat && msg.chat.id && !state.settings.telegramChatId) {
                const detectedId = String(msg.chat.id);
                setSettings(prev => ({
                  ...prev,
                  telegramChatId: detectedId,
                  telegramBotUsername: msg.chat.username || msg.chat.first_name || 'Conectado',
                }));
                showToast(`✈️ Telegram pareado automaticamente (Chat ID: ${detectedId})! Enviando alerta de confirmação...`, 'success');
                sendRealTelegramReminder({
                  botToken: token,
                  chatId: detectedId,
                  task: state.tasks[0] || {
                    id: 'welcome',
                    title: 'Automação Meu Controle Max Conectada!',
                    date: getTodayISO(),
                    startTime: '14:00',
                    priority: 'urgent',
                  },
                  stageLabel: 'Pareamento Automático Concluído ✅',
                }).catch(() => {});
              }

              const cb = upd.callback_query;
              if (cb && cb.data) {
                const [act, taskId] = String(cb.data).split(':');
                if (act === 'CONFIRM') handleConfirmTaskReceipt(taskId, 'telegram');
                if (act === 'SNOOZE_10') handleSnoozeTask(taskId, 10);
                if (act === 'SNOOZE_30') handleSnoozeTask(taskId, 30);
                if (act === 'CANCEL') handleCancelAlert(taskId);
              }
            }
          } catch (e) {}
        }, 3000);
        return () => clearInterval(interval);
      }, [state.settings.telegramBotToken, state.settings.telegramChatId, state.tasks, handleConfirmTaskReceipt, handleSnoozeTask, handleCancelAlert, showToast]);

      // Operações CRUD de Tarefas (com Geração Automática de Repetições na Agenda e Edição Total)
      const handleSaveTask = (taskData) => {
        const isRecurring = taskData.recurrence && taskData.recurrence !== 'none';
        const recDates = isRecurring
          ? generateRecurringTaskDates(
              taskData.date,
              taskData.recurrence,
              taskData.recurrenceCount || 7,
              taskData.customWeekdays
            )
          : [taskData.date];

        setState(prev => {
          const exists = prev.tasks.some(t => t.id === taskData.id);
          const seriesId = isRecurring ? (taskData.seriesId || 'series-' + Date.now()) : '';

          if (!exists) {
            // Cria a tarefa em TODAS as datas da recorrência escolhida!
            const createdInstances = recDates.map((dISO, idx) => ({
              ...taskData,
              id: idx === 0 ? taskData.id : `${taskData.id}-rec-${idx}`,
              date: dISO,
              seriesId,
              status: idx === 0 ? (taskData.status || 'pending') : 'pending',
            }));
            return { ...prev, tasks: [...createdInstances, ...prev.tasks] };
          }

          // Se já existe: atualiza a tarefa atual e, se marcou recorrência, garante que as demais datas existam (ou atualiza a série)
          let updatedTasks = prev.tasks.map(t => {
            if (t.id === taskData.id) {
              return { ...taskData, seriesId };
            }
            if (taskData.applyToSeries && seriesId && t.seriesId === seriesId) {
              return {
                ...t,
                title: taskData.title,
                description: taskData.description,
                startTime: taskData.startTime,
                endTime: taskData.endTime,
                category: taskData.category,
                priority: taskData.priority,
                location: taskData.location,
                recurrence: taskData.recurrence,
                recurrenceCount: taskData.recurrenceCount,
                customWeekdays: taskData.customWeekdays,
              };
            }
            return t;
          });

          // Se o usuário ativou repetição agora ao editar uma tarefa, cria as datas futuras que ainda não existiam na série
          if (isRecurring && recDates.length > 1) {
            const extraInstances = [];
            recDates.forEach((dISO, idx) => {
              if (dISO === taskData.date) return;
              const alreadyHasOnDate = updatedTasks.some(
                t => t.date === dISO && (t.seriesId === seriesId || t.title === taskData.title)
              );
              if (!alreadyHasOnDate) {
                extraInstances.push({
                  ...taskData,
                  id: `${taskData.id}-rec-${Date.now()}-${idx}`,
                  date: dISO,
                  seriesId,
                  status: 'pending',
                  observations: [],
                  lastWhatsAppReply: '',
                });
              }
            });
            if (extraInstances.length > 0) {
              updatedTasks = [...extraInstances, ...updatedTasks];
            }
          }

          return { ...prev, tasks: updatedTasks };
        });

        setTaskModalOpen(false);
        setEditingTask(null);

        sendGreenApiWhatsAppMessage({
          settings: state.settings,
          text:
            `📅 *MEU CONTROLE MAX – COMPROMISSO SALVO NA AGENDA!*\n\n` +
            `📌 *Atividade:* ${taskData.title}\n` +
            `📆 *Data:* ${formatDateBR(taskData.date)}\n` +
            `⏰ *Horário:* ${taskData.startTime} - ${taskData.endTime}\n` +
            (recDates.length > 1
              ? `🔁 *Repetição Automática:* Criadas ${recDates.length} datas na sua Agenda!\n`
              : '') +
            `🔔 *Automação:* Você receberá os alertas aqui no WhatsApp faltando 5m, 3m, 2m, 1m e pós-início!`,
        })
          .then(() => {
            showToast(
              recDates.length > 1
                ? `🔁 ${recDates.length} ocorrências de "${taskData.title}" criadas na Agenda e confirmadas no WhatsApp!`
                : `💾 Compromisso salvo e confirmação enviada para o seu WhatsApp (${state.settings.whatsappNumber || '+55 89 98102-6502'})!`,
              'success'
            );
          })
          .catch(() => {
            showToast(
              recDates.length > 1
                ? `🔁 ${recDates.length} ocorrências criadas automaticamente na Agenda!`
                : '💾 Compromisso salvo e fila de alertas sincronizada!',
              'success'
            );
          });
      };

      const handleQuickUpdateTask = useCallback(
        (taskId, partialFields) => {
          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t => (t.id === taskId ? { ...t, ...partialFields } : t)),
          }));
          showToast('✏️ Alteração salva automaticamente!', 'info');
        },
        [showToast]
      );

      const handleDeleteTask = (taskId) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.filter(t => t.id !== taskId),
        }));
        setTaskModalOpen(false);
        setEditingTask(null);
        showToast('🗑️ Tarefa removida da agenda.', 'info');
      };

      const handleToggleComplete = (taskId) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.map(t =>
            t.id === taskId
              ? { ...t, status: t.status === 'completed' ? 'pending' : 'completed' }
              : t
          ),
        }));
      };

      const handleSmartReschedule = (taskId) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.map(t =>
            t.id === taskId
              ? {
                  ...t,
                  startTime: addMinutesToTime(t.startTime, 60),
                  endTime: addMinutesToTime(t.endTime, 60),
                  rescheduledCount: (t.rescheduledCount || 0) + 1,
                }
              : t
          ),
        }));
        showToast('🔄 Reagendamento inteligente aplicado (+1 hora)!', 'info');
      };

      const handleMoveTaskSlot = (taskId, newDate, newHour) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const nextStart = newHour || t.startTime;
            const nextEnd = newHour ? addMinutesToTime(newHour, 60) : t.endTime;
            return {
              ...t,
              date: newDate || t.date,
              startTime: nextStart,
              endTime: nextEnd,
              rescheduledCount: (t.rescheduledCount || 0) + 1,
            };
          }),
        }));
        showToast('📅 Compromisso reagendado no calendário!', 'success');
      };

      const renderStrokeIcon = (name, className = 'w-5 h-5') => {

        switch (name) {

            return (

          case 'settings':

              <svg {...common}>
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />

      const navItems = [
        { id: 'dashboard', label: 'Check-list',     icon: 'check' },
        { id: 'calendar',  label: 'Agenda',         icon: 'calendar' },
        { id: 'alerts',    label: 'Alertas',        icon: 'bell', badge: state.notificationLogs.length },
        { id: 'assistant', label: 'Assistente IA',  icon: 'message' },
        { id: 'reports',   label: 'Produtividade',  icon: 'chart' },
        { id: 'settings',  label: 'Configurações',  icon: 'settings' },
      ];

      return (
        <div className="min-h-screen flex flex-col bg-[#FAFAFA] text-[#18181B]">
          {/* CABEÇALHO CLEAN DO SISTEMA PESSOAL */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#E4E4E7]">
            <div className="max-w-6xl mx-auto px-4 sm:px-6">
              <div className="h-16 flex items-center justify-between gap-3">
                <button
                  type="button"
                  onClick={() => setActiveTab('dashboard')}
                  className="flex items-center gap-2.5 text-[#18181B] font-bold tracking-tight text-sm sm:text-base shrink-0"
                >
                  <span className="w-8 h-8 rounded-lg bg-[#C2410C] text-white flex items-center justify-center font-bold text-sm">

                  <span>MEU CONTROLE MAX</span>

                {/* Navegação Desktop */}
                <nav aria-label="Navegação principal" className="hidden lg:flex items-center gap-1.5">
                  {navItems.map(item => {
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => setActiveTab(item.id)}
                        className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold inline-flex items-center gap-2 transition ${
                          isActive
                            ? 'bg-[#C2410C] text-white'
                            : 'text-[#52525B] hover:text-[#18181B] hover:bg-[#FAFAFA]'
                        }`}
                      >
                        {renderStrokeIcon(item.icon, 'w-4 h-4')}
                        <span>{item.label}</span>
                      </button>
                    );
                  })}
                </nav>

                <div className="flex items-center gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => {
                      setEditingTask(null);
                      setTaskModalOpen(true);
                    }}
                    className="btn-primary px-3.5 sm:px-4 py-2 text-xs sm:text-sm inline-flex items-center gap-1.5"
                  >
                    {renderStrokeIcon('plus', 'w-4 h-4')}
                    <span>Novo Compromisso</span>
                  </button>
                </div>
              </div>

              {/* Barra de Navegação Mobile / Tablet */}
              <nav aria-label="Abas do sistema" className="lg:hidden flex items-center gap-1.5 overflow-x-auto pb-2.5 pt-0.5">
                {navItems.map(item => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => setActiveTab(item.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold inline-flex items-center gap-1.5 shrink-0 transition ${
                        isActive
                          ? 'bg-[#C2410C] text-white'
                          : 'bg-[#FAFAFA] text-[#52525B] border border-[#E4E4E7]'
                      }`}
                    >
                      {renderStrokeIcon(item.icon, 'w-3.5 h-3.5')}
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>
          </header>

          {/* Toast de Feedback em Tempo Real */}
          {toast && (
            <div
              role="status"
              aria-live="polite"
              className="fixed top-20 right-4 z-50 max-w-sm clean-card px-4 py-3 text-xs sm:text-sm font-semibold text-[#18181B] flex items-center gap-3 border-l-4 border-l-[#C2410C]"
            >
              <span className="flex-1">{toast.message}</span>
              <button onClick={() => setToast(null)} aria-label="Fechar aviso" className="text-[#52525B] hover:text-[#18181B] p-1">✕</button>
            </div>
          )}

          {/* ÁREA PRINCIPAL DIRETA DO SISTEMA (Sem landing de vendas ou autoexplicação) */}
          <main id="top" className="flex-1 py-6 sm:py-8 px-4 sm:px-6">
            <div className="max-w-6xl mx-auto">
              {activeTab === 'dashboard' && (
                <DashboardView
                  tasks={state.tasks}
                  categories={state.categories}
                  nowTime={nowTime}
                  settings={state.settings}
                  setSettings={setSettings}
                  focusModeOnly={focusModeOnly}
                  setFocusModeOnly={setFocusModeOnly}
                  onOpenNewTask={() => {
                    setEditingTask(null);
                    setTaskModalOpen(true);
                  }}
                  onEditTask={task => {
                    setEditingTask(task);
                    setTaskModalOpen(true);
                  }}
                  onQuickUpdateTask={handleQuickUpdateTask}
                  onRolloverToTomorrow={handleRolloverToTomorrow}
                  onSendDailySummaryWhatsApp={handleSendDailySummaryWhatsApp}
                  onToggleComplete={handleToggleComplete}
                  onSmartReschedule={handleSmartReschedule}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                  onRunLiveFlowSimulation={handleRunLiveFlowSimulation}
                  onScheduleAutoFiveMinDemo={handleScheduleAutoFiveMinDemo}
                  lastWhatsAppMonitorEvent={lastWhatsAppMonitorEvent}
                  onForceReadWhatsAppNow={handleForceReadWhatsAppNow}
                  onSimulateWhatsAppReply={processIncomingWhatsAppReplyText}
                  onSelectDateInCalendar={dt => {
                    setSelectedCalendarDate(dt);
                    setActiveTab('calendar');
                  }}
                />
              )}

              {activeTab === 'calendar' && (
                <SmartCalendarView
                  tasks={state.tasks}
                  categories={state.categories}
                  selectedDate={selectedCalendarDate}
                  setSelectedDate={setSelectedCalendarDate}
                  onCreateAtSlot={(dateISO, hourStr) => {
                    setEditingTask({
                      date: dateISO,
                      startTime: hourStr,
                      endTime: addMinutesToTime(hourStr, 60),
                    });
                    setTaskModalOpen(true);
                  }}
                  onEditTask={task => {
                    setEditingTask(task);
                    setTaskModalOpen(true);
                  }}
                  onMoveTaskSlot={handleMoveTaskSlot}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                />
              )}

              {activeTab === 'alerts' && (
                <AlertsEscalationView
                  tasks={state.tasks}
                  notificationLogs={state.notificationLogs}
                  callLogs={state.callLogs}
                  settings={state.settings}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                  onRunLiveFlowSimulation={handleRunLiveFlowSimulation}
                  onNavigateToSettings={() => setActiveTab('settings')}
                />
              )}

              {activeTab === 'assistant' && (
                <SmartAssistantView
                  categories={state.categories}
                  onConfirmAssistantTask={suggestion => {
                    handleSaveTask({
                      ...suggestion,
                      id: 'tf-task-' + Date.now(),
                      status: 'pending',
                      attachments: [],
                      isFavorite: true,
                      estimatedMinutes: 60,
                    });
                  }}
                />
              )}

              {activeTab === 'reports' && (
                <ReportsProductivityView
                  tasks={state.tasks}
                  callLogs={state.callLogs}
                  settings={state.settings}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsView
                  settings={state.settings}
                  setSettings={setSettings}
                  categories={state.categories}
                  setCategories={setCategories}
                  onShowToast={showToast}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                  sampleTask={state.tasks[0]}
                />
              )}
            </div>
          </main>

          {/* RODAPÉ MINIMALISTA */}
          <footer className="bg-white border-t border-[#E4E4E7] py-4 px-4 sm:px-6">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-[#52525B]">
              <div className="flex flex-wrap items-center gap-2">
                <strong className="text-[#18181B]">MEU CONTROLE MAX</strong>
                <span>•</span>
                <span>WhatsApp conectado: {state.settings.whatsappNumber || '+55 89 98102-6502'}</span>
              </div>
              <button
                type="button"
                onClick={() => setActiveTab('settings')}
                className="hover:text-[#18181B] transition"
              >
                Configurações
              </button>
            </div>
          </footer>

          {/* MODAL DE CADASTRO / EDIÇÃO DE TAREFAS */}
          <TaskFormModal
            isOpen={taskModalOpen}
            initialTask={editingTask}
            categories={state.categories}
            onClose={() => {
              setTaskModalOpen(false);
              setEditingTask(null);
            }}
            onSave={handleSaveTask}
            onDelete={handleDeleteTask}
            onTestEscalation={task => {
              setTaskModalOpen(false);
              handleRunLiveFlowSimulation(task);
            }}
          />

          {/* POPUP INTERATIVO MULTI-CANAL (WHATSAPP + TELEGRAM + SMS FALTANDO 5 MIN) */}
          <TelegramAlertPopup
            alertData={activeTelegramPopup}
            userPhone={state.settings.whatsappNumber || state.settings.phone}
            onConfirm={handleConfirmTaskReceipt}
            onComplete={handleCompleteTaskFromWhatsApp}
            onRolloverToTomorrow={handleRolloverToTomorrow}
            onSnooze={handleSnoozeTask}
            onCancelAlert={handleCancelAlert}
            onClose={() => setActiveTelegramPopup(null)}
            onEscalateToCallNow={task => handleTriggerVoiceCall(task, 1)}
          />

          {/* MODAL DE LIGAÇÃO AUTOMÁTICA INTELIGENTE COM VOZ PT-BR E RECONHECIMENTO DTMF (TECLA 1) */}
          <AutomaticPhoneCallModal
            callSession={activePhoneCall}
            onConfirmDTMF={(taskId, duration) =>
              handleConfirmTaskReceipt(taskId, 'voice_dtmf', duration)
            }
            onSnoozeDTMF={handleSnoozeTask}
            onHangupUnanswered={handleHangupUnanswered}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MeuControleMaxApp />);
  </script>
</body>
</html>
