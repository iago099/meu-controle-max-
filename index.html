    const RECURRENCE_OPTIONS = [
      { id: 'none',     label: 'Não se repete',                      defaultCount: 1 },

    const WEEKDAY_SHORT = [

      { day: 2, short: 'Ter', full: 'Terça' },

    // =========================================================================
    // 2. UTILITÁRIOS DE DATA, HORÁRIO, RECORRÊNCIA E RELATÓRIOS
    // =========================================================================
    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysISO(baseISO, days) {
      const [y, m, d] = baseISO.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '';
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function addMinutesToTime(timeStr, minutesToAdd) {
      const [h, m] = (timeStr || '09:00').split(':').map(Number);
      const total = (h * 60 + m + minutesToAdd + 1440) % 1440;
      const nh = String(Math.floor(total / 60)).padStart(2, '0');
      const nm = String(total % 60).padStart(2, '0');
      return `${nh}:${nm}`;
    }

    // Gera todas as datas (ISO) de uma tarefa que se repete
    function generateRecurringTaskDates(startDateISO, recurrence, recurrenceCount = 7, customWeekdays = []) {
      const baseISO = startDateISO || getTodayISO();
      const count = Math.max(1, Math.min(60, Number(recurrenceCount) || 1));
      if (!recurrence || recurrence === 'none' || count <= 1) {
        return [baseISO];
      }

      const dates = [];
      const [y, m, d] = baseISO.split('-').map(Number);

      if (recurrence === 'daily') {
        for (let i = 0; i < count; i++) {
          dates.push(addDaysISO(baseISO, i));
        }
      } else if (recurrence === 'weekdays') {
        let offset = 0;
        while (dates.length < count && offset < 180) {
          const candidate = addDaysISO(baseISO, offset);
          const [cy, cm, cd] = candidate.split('-').map(Number);
          const dow = new Date(cy, cm - 1, cd).getDay();
          if (dow >= 1 && dow <= 5) {
            dates.push(candidate);
          }
          offset++;
        }
      } else if (recurrence === 'weekly') {
        for (let i = 0; i < count; i++) {
          dates.push(addDaysISO(baseISO, i * 7));
        }
      } else if (recurrence === 'monthly') {
        for (let i = 0; i < count; i++) {
          const dt = new Date(y, m - 1 + i, d);
          const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
          dates.push(iso);
        }
      } else if (recurrence === 'custom') {
        const allowedDays = Array.isArray(customWeekdays) && customWeekdays.length > 0
          ? customWeekdays.map(Number)
          : [1, 2, 3, 4, 5];
        let offset = 0;
        while (dates.length < count && offset < 180) {
          const candidate = addDaysISO(baseISO, offset);
          const [cy, cm, cd] = candidate.split('-').map(Number);
          const dow = new Date(cy, cm - 1, cd).getDay();
          if (allowedDays.includes(dow)) {
            dates.push(candidate);
          }
          offset++;
        }
      }

      return dates.length > 0 ? dates : [baseISO];
    }

    // Monta o texto do Resumo / Relatório Diário para WhatsApp e Compartilhamento
    function buildDailySummaryReportText(tasks, dateISO = getTodayISO()) {
      const dayTasks = (tasks || [])
        .filter(t => t.date === dateISO)
        .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));

      const completed = dayTasks.filter(t => t.status === 'completed');
      const confirmed = dayTasks.filter(t => t.status === 'confirmed');
      const pending = dayTasks.filter(t => !['completed', 'confirmed', 'cancelled'].includes(t.status));

      let text =
        `📋 *MEU CONTROLE MAX – RESUMO E RELATÓRIO DO DIA*\n` +
        `📅 *Data:* ${formatDateBR(dateISO)}\n` +
        `📊 *Total:* ${dayTasks.length} atividade(s) | 🏆 *Concluídas:* ${completed.length} | ✅ *Confirmadas:* ${confirmed.length} | ⏳ *Pendentes:* ${pending.length}\n` +
        `━━━━━━━━━━━━━━━━━━━━\n\n`;

      if (dayTasks.length === 0) {
        text += `✨ _Nenhuma atividade agendada para esta data._\n`;
      } else {
        dayTasks.forEach((t, i) => {
          const statusIcon =
            t.status === 'completed'
              ? '🏆 CONCLUÍDA'
              : t.status === 'confirmed'
              ? '✅ CONFIRMADA'
              : t.status === 'overdue'
              ? '🚨 ATRASADA'
              : '⏳ PENDENTE';
          text += `*${i + 1}. [${t.startTime}] ${t.title}*\n`;
          text += `   • Status: ${statusIcon}\n`;
          if (t.location) text += `   • Local: ${t.location}\n`;
          if (Array.isArray(t.observations) && t.observations.length > 0) {
            text += `   • 📝 Obs: ${t.observations.join(' | ')}\n`;
          } else if (t.lastWhatsAppReply) {
            text += `   • 💬 WhatsApp: "${t.lastWhatsAppReply}"\n`;
          }
          text += `\n`;
        });
      }

      text += `🟠 _Gerado automaticamente por Meu Controle Max_`;
      return text;
    }

    // Abre janela limpa de Relatório em PDF / Impressão (Laranja & Branco)
    function openPrintableDailyReport(tasks, dateISO = getTodayISO(), ownerName = 'Meu Controle Max') {
      const dayTasks = (tasks || [])
        .filter(t => t.date === dateISO)
        .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));

      const confirmed = dayTasks.filter(t => t.status === 'confirmed').length;
      const pending = dayTasks.filter(t => !['completed', 'confirmed', 'cancelled'].includes(t.status)).length;

      const rowsHtml = dayTasks.length
        ? dayTasks
            .map(t => {

                  ? '🏆 Concluída'
                  : t.status === 'confirmed'
                  ? '✅ Confirmada'
                  : t.status === 'overdue'
                  ? '🚨 Atrasada'
                  : '⏳ Pendente';
              const notesHtml =
                Array.isArray(t.observations) && t.observations.length > 0
                  ? t.observations.map(o => `<div>📝 ${o}</div>`).join('')

                  <td>${notesHtml}</td>

              `;
            })
            .join('')
        : `<tr><td colspan="4" style="text-align:center;padding:24px;color:#6B7280;">Nenhuma atividade registrada nesta data.</td></tr>`;

      const win = window.open('', '_blank');
      if (!win) return;
      win.document.write(`

            .kpi span { font-size: 12px; color: #52525B; font-weight: 600; }
            table { width: 100%; border-collapse: collapse; font-size: 13px; }
            th { background: #FF6B00; color: #FFFFFF; text-align: left; padding: 10px 12px; font-weight: 800; }
            td { border-bottom: 1px solid #FED7AA; padding: 10px 12px; vertical-align: top; }
            tr:nth-child(even) td { background: #FFFBEB; }
            .print-btn { background: #FF6B00; color: #FFF; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
            @media print { .no-print { display: none !important; } body { margin: 12px; } }
          </style>
        </head>
        <body>
          <div class="header">
            <div>
              <h1 class="title">🟠 MEU CONTROLE MAX — RELATÓRIO DE ATIVIDADES</h1>
              <div class="sub">📅 Data: <strong>${formatDateBR(dateISO)}</strong> • Responsável: <strong>${ownerName}</strong></div>
            </div>
            <button class="print-btn no-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
          </div>

            <div class="kpi"><b>${dayTasks.length}</b><span>Total do Dia</span></div>

    // =========================================================================
    // 3. SINTETIZADOR DE ÁUDIO TELEFÔNICO, DTMF E VOZ EM PORTUGUÊS
    // =========================================================================
    class PhoneAudioEngine {
      constructor() {
        this.ctx = null;
        this.ringInterval = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playRingBurst() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc1.frequency.value = 440;
          osc2.frequency.value = 480;
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.85);
          osc2.stop(now + 0.85);
        } catch (e) {}
      }
      startRinging() {
        this.stopRinging();
        this.playRingBurst();
        this.ringInterval = setInterval(() => this.playRingBurst(), 1800);
      }
      stopRinging() {
        if (this.ringInterval) {
          clearInterval(this.ringInterval);
          this.ringInterval = null;
        }
      }
      playDTMF(digit) {
        try {
          this.init();
          if (!this.ctx) return;
          const dtmfFreqs = {
            '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            '*': [941, 1209], '0': [941, 1336], '#': [941, 1477],
          };
          const pair = dtmfFreqs[String(digit)] || [697, 1209];
          const now = this.ctx.currentTime;
          const o1 = this.ctx.createOscillator();
          const o2 = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o1.frequency.value = pair[0];
          o2.frequency.value = pair[1];
          g.gain.setValueAtTime(0.12, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          o1.connect(g);
          o2.connect(g);
          g.connect(this.ctx.destination);
          o1.start(now);
          o2.start(now);
          o1.stop(now + 0.22);
          o2.stop(now + 0.22);
        } catch (e) {}
      }
      speakPortuguese(text, onEndCallback) {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'pt-BR';
            utter.rate = 1.02;
            utter.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('pt-br')) ||
                            voices.find(v => v.lang && v.lang.toLowerCase().includes('pt'));
            if (ptVoice) utter.voice = ptVoice;
            if (onEndCallback) utter.onend = onEndCallback;
            window.speechSynthesis.speak(utter);
          } else if (onEndCallback) {
            setTimeout(onEndCallback, 3000);
          }
        } catch (e) {
          if (onEndCallback) onEndCallback();
        }
      }
      stopSpeech() {
        try {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } catch (e) {}
      }
      playNotificationChime() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [587.33, 880]; // D5 -> A5 (som moderno de WhatsApp/Telegram)
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.13);
            gain.gain.setValueAtTime(0.14, now + idx * 0.13);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.13);
            osc.stop(now + idx * 0.13 + 0.28);
          });
        } catch (e) {}
      }
    }

    // Resolve os possíveis chatIds do WhatsApp no Brasil (com e sem o 9º dígito após o DDD)
    function getBrazilWhatsAppChatIds(rawPhone) {
      let digits = (rawPhone || '+5589981026502').replace(/\D/g, '');
      if (digits.length === 10 || digits.length === 11) {
        digits = '55' + digits;
      }
      const chatIds = new Set();
      chatIds.add(`${digits}@c.us`);

      // No Brasil (DDD 31 a 99, como DDD 89 e 86), o WhatsApp registra contas antigas SEM o 9º dígito (12 dígitos no total: 55 + DDD + 8 dígitos)
      if (digits.startsWith('55') && digits.length === 13 && digits[4] === '9') {
        const withoutNinth = digits.slice(0, 4) + digits.slice(5);
        chatIds.add(`${withoutNinth}@c.us`);
      }
      // E se o usuário digitou sem o 9 (12 dígitos), adiciona também a versão com o 9 (13 dígitos)
      if (digits.startsWith('55') && digits.length === 12) {
        const withNinth = digits.slice(0, 4) + '9' + digits.slice(4);
        chatIds.add(`${withNinth}@c.us`);
      }
      return Array.from(chatIds);
    }

    // Interpreta qualquer resposta enviada pelo usuário em linguagem natural no WhatsApp
    function parseUserWhatsAppReply(rawText) {
      const cleaned = String(rawText || '').trim();
      if (!cleaned) return null;

      // 0A. Pedido de Resumo / Agenda do Dia (ex: "resumo", "agenda", "relatorio", "tarefas", "o que tenho hoje", "checklist")
      if (
        /^(resumo|agenda|relat[oó]rio|tarefas|compromissos|lista|hoje|check-?list|o\s+que\s+tenho\s+hoje|quais\s+as\s+tarefas|minha\s+agenda)[\s.!?]*$/i.test(
          cleaned
        )
      ) {
        return {
          action: 'daily_summary',
          raw: cleaned,
        };
      }

      // 0B. Criar nova tarefa direto pelo WhatsApp (ex: "Agendar vistoria às 14:30", "Criar reunião amanhã 10:00", "Lembrar de ligar 11:00")
      const createMatch = cleaned.match(
        /^(agendar|agende|criar|crie|nova\s+tarefa|novo\s+compromisso|nova\s+atividade|nova|novo|cadastrar|cadastre|marcar|marque|me\s+lembre|lembrar)\b[\s,.:;-]+(.+)$/i
      );
      if (createMatch && createMatch[2] && createMatch[2].trim().length >= 3) {
        return {
          action: 'create_task',
          commandText: createMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 1. Adiamento (ex: "adiar", "adiar 15", "depois", "daqui 10 min", "mais 15 min", "espera 10")
      const snoozeMatch =
        cleaned.match(/^(adiar|adia|depois|atrasar|espera|aguarda)\b(?:\s*(\d+))?(?:[\s,.:;-]*(.*))?$/i) ||
        cleaned.match(/^(?:daqui\s+a?\s*|mais\s+)(\d+)\s*(?:min|minutos?|m)\b(?:[\s,.:;-]*(.*))?$/i);
      if (snoozeMatch) {
        const mins = Number(snoozeMatch[2] || snoozeMatch[1]) || 10;
        const extra = (snoozeMatch[3] || snoozeMatch[2] || '').replace(/^\d+\s*(?:min|minutos?|m)?\s*/i, '').trim();
        return {
          action: 'snooze',
          minutes: mins > 0 && mins <= 240 ? mins : 10,
          note: extra,
          raw: cleaned,
        };
      }

      // 2. Cancelamento (ex: "cancelar", "desmarcar", "cancelado")
      const cancelMatch = cleaned.match(/^(cancelar|cancela|desmarcar|cancelad[oa])\b(?:[\s,.:;-]*(.*))?$/i);
      if (cancelMatch) {
        return {
          action: 'cancel',
          note: (cancelMatch[2] || '').trim(),
          raw: cleaned,
        };
      }

      // 2.5. NÃO CONCLUÍDA -> Jogar automaticamente para o TOPO do dia seguinte (Check-list)
      // Exemplos: "não", "nao", "n", "3", "não concluído", "nao fiz", "ainda não", "pendente", "amanhã", "não deu tempo", "deixa pra amanhã", "❌"
      const notCompletedMatch = cleaned.match(
        /^(n[aã]o\s+foi\s+conclu[ií]d[oa]|n[aã]o\s+conclu[ií]d[oa]|n[aã]o\s+conclu[ií]|n[aã]o\s+foi\s+feit[oa]|n[aã]o\s+fiz|ainda\s+n[aã]o|n[aã]o\s+deu(?:\s+tempo)?|sem\s+tempo|ficou\s+pendente|pendente|deixar?\s+p(?:ara|ra)\s+amanh[aã]|fica\s+p(?:ara|ra)\s+amanh[aã]|jogar?\s+p(?:ara|ra)\s+amanh[aã]|passar?\s+p(?:ara|ra)\s+amanh[aã]|amanh[aã]|hoje\s+n[aã]o\s+d[aá]|n[aã]o|nao|nn|n|3|❌+|❎+)\b(?:[\s,.:;-]*(.*))?$/i
      );
      if (notCompletedMatch) {
        return {
          action: 'not_completed_rollover',
          note: (notCompletedMatch[2] || '').trim(),
          raw: cleaned,
        };
      }
      if (
        /\b(n[aã]o\s+foi\s+conclu[ií]d[oa]|n[aã]o\s+conclu[ií]d[oa]|n[aã]o\s+consegui|n[aã]o\s+deu\s+tempo|n[aã]o\s+fiz|ficou\s+pendente|deixar?\s+p(?:ara|ra)\s+amanh[aã]|fica\s+p(?:ara|ra)\s+amanh[aã])\b/i.test(
          cleaned
        )
      ) {
        return {
          action: 'not_completed_rollover',
          note: cleaned,
          raw: cleaned,
        };
      }

      // 3. Conclusão pura da Atividade (ex: "concluido", "concluído", "feito", "já fiz", "fiz", "finalizado", "pronto", "terminei", "resolvido", "2", "🏆")
      const pureCompleteMatch = cleaned.match(
        /^(conclu[ií]d[oa]s?|concluir|conclu[ií]|finalizad[oa]s?|finalizar|finalizei|feit[oa]s?|j[aá]\s+fiz|fiz|j[aá]\s+foi\s+feit[oa]|pront[oa]s?|t[aá]\s+pront[oa]|j[aá]\s+t[aá]\s+pront[oa]|terminei|j[aá]\s+terminei|terminad[oa]s?|resolvid[oa]s?|resolvi|encerrad[oa]s?|executad[oa]s?|executei|realizad[oa]s?|realizei|entregue|entreguei|cumprid[oa]s?|j[aá]\s+olhei|j[aá]\s+verifiquei|verificad[oa]|2|🏆+|✔️+|☑️+)[\s.!?]*$/i
      );
      if (pureCompleteMatch) {
        return {
          action: 'complete',
          note: '',
          raw: cleaned,
        };
      }

      // 4. Conclusão + Observação (ex: "concluido, marmitas entregues", "feito - equipe alimentada", "já fiz tudo certo")
      const completeWithNoteMatch = cleaned.match(
        /^(conclu[ií]d[oa]s?|concluir|conclu[ií]|finalizad[oa]s?|finalizar|finalizei|feit[oa]s?|j[aá]\s+fiz|fiz|j[aá]\s+foi\s+feit[oa]|pront[oa]s?|terminei|j[aá]\s+terminei|terminad[oa]s?|resolvid[oa]s?|resolvi|encerrad[oa]s?|executad[oa]s?|executei|realizad[oa]s?|realizei|entregue|entreguei)\b[\s,.:;-]+(.+)$/i
      );
      if (completeWithNoteMatch) {
        return {
          action: 'complete',
          note: completeWithNoteMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 5. Frase natural contendo expressão de conclusão (ex: "já foi concluido", "atividade concluída", "tudo feito por aqui")
      if (
        /\b(conclu[ií]d[oa]s?|finalizad[oa]s?|j[aá]\s+conclu[ií]|j[aá]\s+fiz|j[aá]\s+terminei|j[aá]\s+foi\s+feit[oa]|tudo\s+feit[oa]|atividade\s+conclu[ií]da|tarefa\s+conclu[ií]da|j[aá]\s+resolvi)\b/i.test(
          cleaned
        )
      ) {
        const extraNote = cleaned
          .replace(/^(já|ja|tudo|atividade|tarefa|servi[cç]o|foi|está|esta|\s)+/i, '')
          .replace(/^(conclu[ií]d[oa]s?|finalizad[oa]s?|feit[oa]s?|terminei|fiz)[\s,.:;-]*/i, '')
          .trim();
        return {
          action: 'complete',
          note: extraNote,
          raw: cleaned,
        };
      }

      // 6. Confirmação pura de recebimento (ex: "OK", "Sim", "Confirmado", "1", "Ciente", "Certo", "Tá bom", "Tô indo", "Já vi", "👍", "✅")
      const pureConfirmMatch = cleaned.match(
        /^(ok+|okay|okey|k+|sim|s+|confirmo|confirmad[oa]|confirmar|ciente|certo|certinho|t[aá]|t[aá]\s+bom|t[aá]\s+certo|beleza|blz|recebid[oa]|recebi|visto|vi|j[aá]\s+vi|entendi|entendido|combinado|fechado|positivo|pode\s+deixar|t[oô]\s+indo|estou\s+indo|indo|em\s+andamento|fazendo|t[oô]\s+fazendo|j[aá]\s+estou\s+fazendo|valeu|vlw|obrigad[oa]|obg|show|top|perfeito|1|👍+|✅+|👌+|🤝+|🫡+|🙌+)[\s.!?]*$/i
      );
      if (pureConfirmMatch) {
        return {
          action: 'confirm',
          note: '',
          raw: cleaned,
        };
      }

      // 7. Confirmação seguida de observação (ex: "OK, verificar marmitas do turno B", "Tá bom já estou indo", "Sim, pedir água")
      const confirmWithNoteMatch = cleaned.match(
        /^(ok+|okay|okey|sim|confirmo|confirmad[oa]|confirmar|ciente|certo|certinho|t[aá]\s+bom|t[aá]\s+certo|beleza|blz|recebid[oa]|recebi|j[aá]\s+vi|entendi|t[oô]\s+indo|estou\s+indo|1)\b[\s,.:;-]+(.+)$/i
      );
      if (confirmWithNoteMatch) {
        return {
          action: 'confirm_and_note',
          note: confirmWithNoteMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 8. Prefixo explícito de observação (ex: "Obs: comprar frutas", "Nota: ligar para fornecedor")
      const obsMatch = cleaned.match(/^(obs|observa[cç][aã]o|nota|anota|anotar|lembrete|adicionar|add)\b[\s,.:;-]*(.+)$/i);
      if (obsMatch) {
        return {
          action: 'confirm_and_note',
          note: obsMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 9. Qualquer outra mensagem ou frase livre enviada pelo usuário no WhatsApp:
      // Confirma o recebimento (para parar o alarme) e salva o que ele escreveu como observação na atividade!
      return {
        action: 'confirm_and_note',
        note: cleaned,
        raw: cleaned,
      };
    }

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chatId, count: 12 }),
          });
          if (res.ok) {
            const history = await res.json();
            if (Array.isArray(history)) {
              // Na 1ª execução (inicialização), se a mensagem mais recente (history[0]) for uma resposta do usuário logo após um alerta nosso e ainda não tiver sido processada, permite processá-la!
              history.forEach((msg, idx) => {
                if (!msg || !msg.idMessage) return;
                const text = extractGreenApiMessageText(msg);
                candidateMessages.push({
                  idMessage: msg.idMessage,
                  text,
                  timestamp: Number(msg.timestamp) || 0,
                  chatId: msg.chatId || chatId,
                  isVeryLatestInChat: idx === 0,
                  followedBotAlert: idx === 0 && history[1] && isAutomatedBotMessage(extractGreenApiMessageText(history[1]), history[1]?.idMessage),
                });
              });
            }
          }
        } catch (e) {}
      }

      // 2. Consulta lastOutgoingMessages e lastIncomingMessages (captura mensagens digitadas no próprio aparelho conectado à Green-API)
      try {
        const [outRes, inRes] = await Promise.all([
          fetch(`${baseHost}/waInstance${idInst}/lastOutgoingMessages/${tokInst}?minutes=30`).catch(() => null),
          fetch(`${baseHost}/waInstance${idInst}/lastIncomingMessages/${tokInst}?minutes=30`).catch(() => null),
        ]);
        for (const r of [outRes, inRes]) {
          if (r && r.ok) {
            const list = await r.json();
            if (Array.isArray(list)) {
              for (const msg of list) {
                if (!msg || !msg.idMessage) continue;
                if (msg.chatId && !chatIdsSet.has(msg.chatId)) continue;
                const text = extractGreenApiMessageText(msg);
                candidateMessages.push({
                  idMessage: msg.idMessage,
                  text,
                  timestamp: Number(msg.timestamp) || 0,
                  chatId: msg.chatId || chatIds[0],
                  isVeryLatestInChat: false,
                  followedBotAlert: false,
                });
              }
            }
          }
        }
      } catch (e) {}

      // 3. Drena até 5 eventos da fila receiveNotification (para não travar atrás de notificações de status)
      for (let i = 0; i < 5; i++) {
        try {
          const notifRes = await fetch(`${baseHost}/waInstance${idInst}/receiveNotification/${tokInst}`);
          if (!notifRes.ok) break;
          const notif = await notifRes.json();
          if (!notif || !notif.receiptId) break;

          const body = notif.body || {};
          const idMsg = body.idMessage;
          const senderChatId = body.senderData?.chatId || body.chatId || '';
          const text = extractGreenApiMessageText(body);

          if (idMsg && text && (!senderChatId || chatIdsSet.has(senderChatId))) {
            candidateMessages.push({
              idMessage: idMsg,
              text,
              timestamp: Number(body.timestamp) || 0,
              chatId: senderChatId || chatIds[0],
              isVeryLatestInChat: true,
              followedBotAlert: true,
            });
          }

          await fetch(
            `${baseHost}/waInstance${idInst}/deleteNotification/${tokInst}/${notif.receiptId}`,
            { method: 'DELETE' }
          ).catch(() => {});
        } catch (e) {
          break;
        }
      }

      // Na primeira leitura após abrir a página, sincroniza o baseline usando o relógio do PRÓPRIO servidor da Green-API (nunca Date.now() local!)
      if (!WA_READER_STATE.initialized && !forceCheckLatest) {
        WA_READER_STATE.initialized = true;
        let maxTs = 0;
        for (const item of candidateMessages) {
          if (item.timestamp > maxTs) maxTs = item.timestamp;
          // Se a mensagem mais recente da conversa foi enviada pelo usuário logo depois de um alerta do Bot e ainda não estava salva no localStorage, deixa ela passar para ser lida!
          if (item.isVeryLatestInChat && item.followedBotAlert && !processedIdsSet.has(item.idMessage) && !isAutomatedBotMessage(item.text, item.idMessage)) {
            continue;
          }
          processedIdsSet.add(item.idMessage);
        }
        WA_READER_STATE.baselineServerTimestamp = maxTs;
        savePersistedProcessedWaIds(processedIdsSet);
      }

      const detectedReplies = [];
      const seenInThisBatch = new Set();

      // Ordena do mais antigo para o mais recente para processar na ordem certa
      candidateMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      for (const item of candidateMessages) {
        if (!item.idMessage || seenInThisBatch.has(item.idMessage)) continue;
        seenInThisBatch.add(item.idMessage);

        if (processedIdsSet.has(item.idMessage)) continue;

        if (!item.text || isAutomatedBotMessage(item.text, item.idMessage)) {
          processedIdsSet.add(item.idMessage);
          continue;
        }

        // Se não for busca forçada, verifica apenas se o timestamp do servidor é >= ao baseline inicial do próprio servidor
        if (
          !forceCheckLatest &&
          WA_READER_STATE.baselineServerTimestamp > 0 &&
          item.timestamp > 0 &&
          item.timestamp < WA_READER_STATE.baselineServerTimestamp - 10 &&
          !item.followedBotAlert
        ) {
          processedIdsSet.add(item.idMessage);
          continue;
        }

        if (item.timestamp > WA_READER_STATE.baselineServerTimestamp) {
          WA_READER_STATE.baselineServerTimestamp = item.timestamp;
        }

        processedIdsSet.add(item.idMessage);
        detectedReplies.push({
          idMessage: item.idMessage,
          text: item.text,
          timestamp: item.timestamp,
          chatId: item.chatId,
        });
      }

      if (detectedReplies.length > 0) {
        savePersistedProcessedWaIds(processedIdsSet);
      }

      return detectedReplies;
    }

    async function detectTelegramChatId(botToken) {
      const res = await fetch(`https://api.telegram.org/bot${botToken.trim()}/getUpdates?limit=15`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.description || 'Token do Bot inválido');
      const updates = data.result || [];
      for (let i = updates.length - 1; i >= 0; i--) {
        const msg = updates[i].message || updates[i].callback_query?.message;
        if (msg && msg.chat && msg.chat.id) {
          return {
            chatId: String(msg.chat.id),
            username: msg.chat.username || msg.chat.first_name || 'Usuário Telegram',
          };
        }
      }
      throw new Error('Nenhuma mensagem encontrada. Envie um "/start" ou "Oi" para o seu Bot no Telegram e clique novamente!');
    }

    // =========================================================================
    // 5. INTERPRETADOR DE LINGUAGEM NATURAL ("🤖 MEU ASSISTENTE")
    // =========================================================================
    function parseNaturalLanguageTask(rawInput) {
      const text = (rawInput || '').trim();
      if (!text) return null;

      const lower = text.toLowerCase();
      const todayISO = getTodayISO();
      let targetDate = todayISO;
      let recurrence = 'none';
      let dateExplanation = 'Hoje';

      // Detecção de recorrência e dias da semana
      const weekdaysMap = [
        { keys: ['domingo', 'domingos'], day: 0, label: 'Domingo' },
        { keys: ['segunda-feira', 'segundas-feiras', 'segunda', 'segundas'], day: 1, label: 'Segunda-feira' },
        { keys: ['terça-feira', 'terças-feiras', 'terca-feira', 'terça', 'terca', 'terças'], day: 2, label: 'Terça-feira' },
        { keys: ['quarta-feira', 'quartas-feiras', 'quarta', 'quartas'], day: 3, label: 'Quarta-feira' },
        { keys: ['quinta-feira', 'quintas-feiras', 'quinta', 'quintas'], day: 4, label: 'Quinta-feira' },
        { keys: ['sexta-feira', 'sextas-feiras', 'sexta', 'sextas'], day: 5, label: 'Sexta-feira' },
        { keys: ['sábado', 'sabado', 'sábados', 'sabados'], day: 6, label: 'Sábado' },
      ];

      if (lower.includes('todos os dias') || lower.includes('todo dia') || lower.includes('diariamente')) {
        recurrence = 'daily';
        dateExplanation = 'Recorrência Diária';
      } else if (lower.includes('toda semana') || lower.includes('todas as ') || lower.includes('toda ') || lower.includes('semanalmente')) {
        recurrence = 'weekly';
      } else if (lower.includes('todo mês') || lower.includes('mensalmente')) {
        recurrence = 'monthly';
      }

      if (lower.includes('depois de amanhã') || lower.includes('depois de amanha')) {
        targetDate = addDaysISO(todayISO, 2);
        dateExplanation = 'Depois de amanhã';
      } else if (lower.includes('amanhã') || lower.includes('amanha')) {
        targetDate = addDaysISO(todayISO, 1);
        dateExplanation = 'Amanhã';
      } else {
        for (const wd of weekdaysMap) {
          if (wd.keys.some(k => lower.includes(k))) {
            const now = new Date();
            const currentDay = now.getDay();
            let diff = (wd.day - currentDay + 7) % 7;
            if (diff === 0) diff = 7;
            targetDate = addDaysISO(todayISO, diff);
            dateExplanation = recurrence === 'weekly' ? `Toda ${wd.label}` : `Próxima ${wd.label}`;
            break;
          }
        }
      }

      // Detecção de horário (ex: "às 8h", "às 14:30", "16h", "07:00")
      let startTime = '09:00';
      const timeRegex = /(?:às|as|a|para as|de)?\s*(\d{1,2})\s*(?:h|:|horas?)?\s*(\d{2})?(?:\s*h|\s*horas?)?/i;
      const explicitTimeMatch = text.match(/(?:às|as)\s*(\d{1,2})(?:[:h](\d{2}))?\s*(?:h|horas)?/i) ||
                                text.match(/\b(\d{1,2})[:h](\d{2})?\b/i);

      if (explicitTimeMatch) {
        let hour = parseInt(explicitTimeMatch[1], 10);
        let minute = explicitTimeMatch[2] ? parseInt(explicitTimeMatch[2], 10) : 0;
        if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
          if (lower.includes('da tarde') && hour < 12) hour += 12;
          if (lower.includes('da noite') && hour < 12) hour += 12;
          startTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        }
      }

      const endTime = addMinutesToTime(startTime, 60);

      // Detecção de categoria e prioridade
      let category = 'work';
      let priority = 'high';

      if (lower.includes('reunião') || lower.includes('reuniao') || lower.includes('call') || lower.includes('alinhamento') || lower.includes('comitê')) {
        category = 'meetings';
        priority = 'high';
      } else if (lower.includes('estud') || lower.includes('curso') || lower.includes('aula') || lower.includes('prova') || lower.includes('leitura')) {
        category = 'studies';
        priority = 'medium';
      } else if (lower.includes('médico') || lower.includes('medico') || lower.includes('academia') || lower.includes('família') || lower.includes('pessoal') || lower.includes('comprar')) {
        category = 'personal';
        priority = 'medium';
      } else if (lower.includes('urgente') || lower.includes('segurança') || lower.includes('emergência') || lower.includes('crítico') || lower.includes('prazo')) {
        category = 'urgent';
        priority = 'urgent';
      }

      if (lower.includes('urgente') || lower.includes('importantíssimo') || lower.includes('prioridade máxima')) {
        priority = 'urgent';
      } else if (lower.includes('baixa prioridade') || lower.includes('quando puder')) {
        priority = 'low';
      }

      // Limpeza do título da tarefa
      let cleanTitle = text
        .replace(/^(me\s+lembre|lembrar(?:-me)?|agende|crie\s+uma\s+tarefa|adicione\s+na\s+agenda)\s*/i, '')
        .replace(/\b(hoje|amanhã|amanha|depois de amanhã|todas as\s+[\w-]+|toda\s+[\w-]+|na\s+[\w-]+|no\s+domingo|no\s+sábado)\b/gi, '')
        .replace(/(?:às|as)\s*\d{1,2}(?:[:h]\d{2})?\s*(?:h|horas?)?/gi, '')
        .replace(/^\s*(de|para|que|em|,|-)\s+/i, '')
        .replace(/\s{2,}/g, ' ')
        .trim();

      if (!cleanTitle || cleanTitle.length < 3) {
        cleanTitle = text;
      } else {
        cleanTitle = cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1);
        cleanTitle = cleanTitle.replace(/\.$/, '');
      }

      return {
        title: cleanTitle,
        description: `Criado via Assistente Inteligente a partir do comando: "${text}"`,
        date: targetDate,
        dateExplanation,
        startTime,
        endTime,
        category,
        priority,
        recurrence,
        notifyTelegram: true,
        notifyVoiceCall: true,
        requireConfirmation: true,
        leadTimeMinutes: 30,
      };
    }

    // 8. MODAL DE LIGAÇÃO AUTOMÁTICA INTELIGENTE + RECONHECIMENTO DTMF (TECLA 1)
    // =========================================================================
    function AutomaticPhoneCallModal({ callSession, onConfirmDTMF, onSnoozeDTMF, onHangupUnanswered }) {
      const [callState, setCallState] = useState('ringing'); // 'ringing' | 'connected' | 'confirmed'
      const [secondsElapsed, setSecondsElapsed] = useState(0);
      const [pressedDigits, setPressedDigits] = useState('');
      const [voiceSpeaking, setVoiceSpeaking] = useState(false);

      useEffect(() => {
        if (!callSession) return;
        setCallState('ringing');
        setSecondsElapsed(0);
        setPressedDigits('');
        phoneAudio.startRinging();
        return () => {
          phoneAudio.stopRinging();
          phoneAudio.stopSpeech();
        };
      }, [callSession]);

      useEffect(() => {
        if (callState !== 'connected') return;
        const timer = setInterval(() => setSecondsElapsed(s => s + 1), 1000);
        return () => clearInterval(timer);
      }, [callState]);

      if (!callSession) return null;
      const { task, attempt, maxAttempts, spokenScript, toNumber, twilioCallSid } = callSession;

      const handleAnswerCall = () => {
        phoneAudio.stopRinging();
        setCallState('connected');
        setVoiceSpeaking(true);
        phoneAudio.speakPortuguese(spokenScript, () => {
          setVoiceSpeaking(false);
        });
      };

      const handlePressDigit = (digit) => {
        phoneAudio.playDTMF(digit);
        setPressedDigits(prev => prev + digit);

        if (String(digit) === '1') {
          phoneAudio.stopSpeech();
          setCallState('confirmed');
          phoneAudio.speakPortuguese(
            'Recebimento confirmado com sucesso! Todos os alertas adicionais foram encerrados. Bom trabalho!',
            () => {
              setTimeout(() => {
                onConfirmDTMF(task.id, secondsElapsed + 4);
              }, 600);
            }
          );
        } else if (String(digit) === '2') {
          phoneAudio.stopSpeech();
          phoneAudio.speakPortuguese('Compromisso adiado em 10 minutos. Até logo!', () => {
            onSnoozeDTMF(task.id, 10);
          });
        }
      };

      const formatCallTime = (secs) => {
        const m = String(Math.floor(secs / 60)).padStart(2, '0');
        const s = String(secs % 60).padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
          <div className="relative w-full max-w-sm rounded-[36px] border-2 border-[#FF9F43]/60 bg-gradient-to-b from-[#19231D] via-[#101713] to-[#0B100D] p-6 text-white shadow-[0_0_70px_rgba(255,159,67,0.28)]">
            {/* Topo estilo smartphone em chamada */}
            <div className="mx-auto mb-4 h-1.5 w-20 rounded-full bg-white/15" />

            <div className="text-center space-y-2">
              <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FF9F43]/20 border border-[#FF9F43]/40 text-[#FFD09B] text-xs font-bold">
                <span>🔥 ESCALONAMENTO NÍVEL 3 • TENTATIVA {attempt}/{maxAttempts}</span>
              </div>

              <div className="relative mx-auto my-4 flex h-24 w-24 items-center justify-center">
                {callState === 'ringing' && (
                  <>
                    <div className="absolute inset-0 rounded-full bg-[#FF9F43]/30 animate-pulse-ring" />
                    <div className="absolute inset-2 rounded-full bg-[#FF6B00]/25 animate-pulse-ring" style={{ animationDelay: '0.5s' }} />
                  </>
                )}
                <div className="relative z-10 flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-[#FF6B00] to-[#FF9F43] text-3xl shadow-xl">
                  📞
                </div>
              </div>

              <h3 className="text-xl font-extrabold tracking-tight text-[#F4F8F3]">
                Assistente Meu Controle Max
              </h3>
              <p className="text-xs font-mono text-[#AAB8AA]">
                {toNumber || '+55 (11) 99876-5432'} {twilioCallSid ? `• SID: ${twilioCallSid.slice(0, 10)}...` : ''}
              </p>

              <div className="py-1">
                {callState === 'ringing' && (
                  <span className="inline-block text-sm font-bold text-[#FF9F43] animate-pulse">
                    📲 Chamando... (Telegram sem resposta)
                  </span>
                )}
                {callState === 'connected' && (
                  <span className="inline-block text-sm font-mono font-bold text-[#FF6B00]">
                    🟠 Em chamada • {formatCallTime(secondsElapsed)}
                  </span>
                )}
                {callState === 'confirmed' && (
                  <span className="inline-block text-sm font-bold text-[#FF6B00]">
                    ✅ Confirmado via Tecla 1 (DTMF)! Encerrando...
                  </span>
                )}
              </div>
            </div>

            {/* Card da Tarefa e Transcrição de Voz em Tempo Real */}
            <div className="my-4 rounded-2xl bg-black/40 border border-white/10 p-3.5 text-left space-y-2">
              <div className="flex items-center justify-between text-xs">
                <span className="font-bold text-[#FFD09B]">📌 {task.title}</span>
                <span className="font-mono text-[#FF6B00]">{task.startTime}</span>
              </div>
              <p className="text-xs text-[#AAB8AA] italic leading-relaxed">
                "{spokenScript}"
              </p>
              {voiceSpeaking && (
                <div className="flex items-center gap-2 text-[11px] text-[#FF6B00] font-semibold pt-1">
                  <span className="inline-block w-2 h-2 rounded-full bg-[#FF6B00] animate-ping" />
                  Reproduzindo mensagem de voz sintetizada (pt-BR)...
                </div>
              )}
            </div>

            {/* Botões de Atender / Teclado DTMF */}
            {callState === 'ringing' ? (
              <div className="grid grid-cols-2 gap-3 pt-2">
                <button
                  onClick={() => onHangupUnanswered(task)}
                  className="py-3.5 px-4 rounded-2xl bg-red-600/90 hover:bg-red-600 text-white font-bold text-sm transition shadow-lg flex items-center justify-center gap-2"
                >
                  📵 Recusar / Ignorar
                </button>
                <button
                  onClick={handleAnswerCall}
                  className="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-[#FF8533] to-[#FF6B00] text-[#101713] font-extrabold text-sm transition shadow-lg flex items-center justify-center gap-2 hover:brightness-105"
                >
                  📞 Atender Agora
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                <div className="flex items-center justify-between px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs">
                  <span className="text-[#AAB8AA]">Teclado DTMF:</span>
                  <span className="font-mono font-bold text-[#FF6B00] tracking-widest">
                    {pressedDigits || 'Pressione 1 para confirmar'}
                  </span>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  {['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'].map((digit) => {
                    const isPrimary = digit === '1';
                    const isSnooze = digit === '2';
                    return (
                      <button
                        key={digit}
                        onClick={() => handlePressDigit(digit)}
                        className={`py-2.5 rounded-xl font-bold transition flex flex-col items-center justify-center border ${
                          isPrimary
                            ? 'bg-[#FF6B00] text-[#101713] border-[#FF6B00] shadow-[0_0_20px_rgba(184,242,139,0.5)] scale-[1.03]'
                            : isSnooze
                            ? 'bg-[#FF9F43]/25 text-[#FFD09B] border-[#FF9F43]/50 hover:bg-[#FF9F43]/40'
                            : 'bg-white/5 hover:bg-white/15 text-white border-white/10'
                        }`}
                      >
                        <span className="text-base leading-none">{digit}</span>
                        <span className="text-[9px] uppercase tracking-tighter opacity-85 mt-0.5">
                          {digit === '1' ? 'CONFIRMAR ✅' : digit === '2' ? 'ADIAR 10M' : '\u00A0'}
                        </span>
                      </button>
                    );
                  })}
                </div>

                <div className="flex items-center justify-between gap-2 pt-1">
                  <button
                    onClick={() => phoneAudio.speakPortuguese(spokenScript)}
                    className="flex-1 py-2 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold text-[#F4F8F3] transition"
                  >
                    🔊 Ouvir Voz Novamente
                  </button>
                  <button
                    onClick={() => onHangupUnanswered(task)}
                    className="py-2 px-4 rounded-xl bg-red-600/80 hover:bg-red-600 text-xs font-bold text-white transition"
                  >
                    Desligar
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
