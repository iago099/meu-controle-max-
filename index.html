    // =========================================================================
    // 10. SEÇÃO 2: 🏠 DASHBOARD PRINCIPAL
    // =========================================================================
    function DashboardView({
      tasks,
      categories,
      nowTime,
      settings,
      setSettings,
      focusModeOnly,
      setFocusModeOnly,
      onOpenNewTask,
      onEditTask,
      onQuickUpdateTask,
      onRolloverToTomorrow,
      onSendDailySummaryWhatsApp,
      onToggleComplete,
      onSmartReschedule,
      onTriggerTelegramAlert,
      onTriggerVoiceCall,
      onRunLiveFlowSimulation,
      onScheduleAutoFiveMinDemo,
      onSelectDateInCalendar,
      lastWhatsAppMonitorEvent,
      onForceReadWhatsAppNow,
      onSimulateWhatsAppReply,
    }) {
      const [simReplyInput, setSimReplyInput] = useState('');
      const todayISO = getTodayISO();
      const todayTasks = useMemo(
        () =>
          tasks
            .filter(t => t.date === todayISO)
            .sort((a, b) => {
              // 1º Tarefas já concluídas ficam no final do Check-list para destacar o que falta fazer no topo
              const aDone = a.status === 'completed' ? 1 : 0;
              const bDone = b.status === 'completed' ? 1 : 0;
              if (aDone !== bDone) return aDone - bDone;

              // 2º Tarefas não concluídas vindas do dia anterior (pinnedToTop) ficam no TOPO ABSOLUTO!
              const aPinned = a.pinnedToTop ? 1 : 0;
              const bPinned = b.pinnedToTop ? 1 : 0;
              if (aPinned !== bPinned) return bPinned - aPinned;

              // 3º Ordem de horário
              return (a.startTime || '').localeCompare(b.startTime || '');
            }),
        [tasks, todayISO]
      );

      const totalToday = todayTasks.length;
      const completedToday = todayTasks.filter(t => t.status === 'completed' || t.status === 'confirmed').length;
      const pendingToday = todayTasks.filter(t => ['pending', 'notified', 'in_progress'].includes(t.status)).length;
      const overdueToday = todayTasks.filter(t => t.status === 'overdue').length;
      const productivityPct = totalToday > 0 ? Math.round((completedToday / totalToday) * 100) : 0;

      // Próximo compromisso
      const currentHM = `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}`;
      const nextAppointment = useMemo(() => {
        const upcomingToday = todayTasks.find(
          t => t.status !== 'completed' && t.status !== 'cancelled' && t.startTime >= currentHM
        );
        if (upcomingToday) return upcomingToday;
        return todayTasks.find(t => t.status !== 'completed' && t.status !== 'cancelled') || tasks[0];
      }, [todayTasks, tasks, currentHM]);

      // Tarefas do FOCO DE HOJE
      const focusTasks = useMemo(() => {
        if (focusModeOnly) {
          return todayTasks.filter(t => t.priority === 'urgent' || t.priority === 'high' || t.isFavorite);
        }
        return todayTasks;
      }, [todayTasks, focusModeOnly]);

      const hour = nowTime.getHours();
      const greetingPrefix =
        hour < 12 ? 'Bom dia! ☀️' : hour < 18 ? 'Boa tarde! 🌤️' : 'Boa noite! 🌙';

      const formattedClock = nowTime.toLocaleTimeString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
      const formattedLongDate = nowTime.toLocaleDateString('pt-BR', {
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric',
      });

      const getCategoryObj = (catId) =>
        categories.find(c => c.id === catId) || DEFAULT_CATEGORIES[0];

      return (
        <div className="space-y-6">
          {/* Painel Rápido do Dia */}
          <div className="clean-card p-5 sm:p-6">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div className="space-y-1">
                <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-[#FFF7ED] border border-orange-200 text-[#C2410C] text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-[#EA580C]" />
                  <span>WhatsApp ativo ({settings.whatsappNumber || '+55 89 98102-6502'})</span>
                </div>
                <h2 className="text-xl sm:text-2xl font-bold tracking-tight text-tf-text">
                  {greetingPrefix.replace(/[^\w\s!áéíóúãõâêôçÁÉÍÓÚÃÕÂÊÔÇ]/g, '').trim()} Sua agenda de hoje
                </h2>
                <p className="text-xs sm:text-sm text-tf-muted capitalize">
                  {formattedLongDate} • <span className="font-semibold text-[#C2410C]">{formattedClock}</span>
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => onOpenNewTask()}
                  className="btn-primary px-4 py-2.5 text-xs sm:text-sm flex items-center gap-1.5"
                >
                  <span>+ Novo Compromisso</span>
                </button>
                {onSendDailySummaryWhatsApp && (
                  <button
                    onClick={() => onSendDailySummaryWhatsApp(todayISO)}
                    className="btn-secondary px-3.5 py-2.5 text-xs flex items-center gap-1.5"
                    title="Envia a lista completa de hoje para o seu WhatsApp"
                  >
                    <span>Resumo no WhatsApp</span>
                  </button>
                )}
                <button
                  onClick={() => {
                    const txt = buildDailySummaryReportText(tasks, todayISO);
                    navigator.clipboard?.writeText(txt);
                    alert('Relatório do dia copiado para a área de transferência.');
                  }}
                  className="btn-secondary px-3.5 py-2.5 text-xs flex items-center gap-1.5"
                >
                  <span>Copiar Resumo</span>
                </button>
                <button
                  onClick={() => openPrintableDailyReport(tasks, todayISO, settings.fullName)}
                  className="btn-secondary px-3.5 py-2.5 text-xs flex items-center gap-1.5"
                >
                  <span>Exportar PDF</span>
                </button>
              </div>
            </div>

            <div className="mt-4 pt-4 border-t border-tf-border flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
              <div className="text-xs text-tf-muted">
                <strong className="text-tf-text">Leitura WhatsApp (2s):</strong>{' '}
                {lastWhatsAppMonitorEvent ? (
                  <span className="text-[#C2410C] font-medium">
                    Às {lastWhatsAppMonitorEvent.time}: "{lastWhatsAppMonitorEvent.text}" ({lastWhatsAppMonitorEvent.actionLabel})
                  </span>
                ) : (
                  <span>Responda OK, CONCLUIDO ou NAO no seu WhatsApp.</span>
                )}
              </div>

              <div className="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                {onForceReadWhatsAppNow && (
                  <button
                    onClick={onForceReadWhatsAppNow}
                    className="btn-secondary px-3 py-1.5 text-xs"
                  >
                    Sincronizar WhatsApp
                  </button>
                )}
                {onSimulateWhatsAppReply && (
                  <form
                    onSubmit={e => {
                      e.preventDefault();
                      if (!simReplyInput.trim()) return;
                      onSimulateWhatsAppReply(simReplyInput.trim());
                      setSimReplyInput('');
                    }}
                    className="flex items-center gap-1.5 flex-1 sm:flex-initial min-w-0"
                  >
                    <input
                      type="text"
                      value={simReplyInput}
                      onChange={e => setSimReplyInput(e.target.value)}
                      placeholder="Simular resposta (ex: concluido)"
                      className="rounded-xl bg-white border border-tf-border px-3 py-1.5 text-xs text-tf-text flex-1 sm:w-48 min-w-0"
                    />
                    <button
                      type="submit"
                      className="btn-primary px-3 py-1.5 text-xs shrink-0"
                    >
                      Testar
                    </button>
                  </form>
                )}
              </div>
            </div>
          </div>

          {/* Indicadores do Dia (Clean) */}
          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3.5">
            <div className="clean-card p-4">
              <div className="text-xs font-medium text-tf-muted">Total Hoje</div>
              <div className="mt-1.5 text-2xl font-bold text-tf-text">{totalToday}</div>
              <div className="mt-0.5 text-[11px] text-tf-muted">Compromissos</div>
            </div>

            <div className="clean-card p-4">
              <div className="text-xs font-medium text-tf-muted">Concluídas / Confirm.</div>
              <div className="mt-1.5 text-2xl font-bold text-[#C2410C]">{completedToday}</div>
              <div className="mt-0.5 text-[11px] text-tf-muted">No prazo</div>
            </div>

            <div className="clean-card p-4">
              <div className="text-xs font-medium text-tf-muted">Pendentes</div>
              <div className="mt-1.5 text-2xl font-bold text-tf-text">{pendingToday}</div>
              <div className="mt-0.5 text-[11px] text-tf-muted">Aguardando</div>
            </div>

            <div className="clean-card p-4">
              <div className="text-xs font-medium text-tf-muted">Atrasadas</div>
              <div className="mt-1.5 text-2xl font-bold text-[#C2410C]">{overdueToday}</div>
              <div className="mt-0.5 text-[11px] text-tf-muted">Prioritárias</div>
            </div>

            <div className="clean-card p-4">
              <div className="text-xs font-medium text-tf-muted">Produtividade</div>
              <div className="mt-1.5 text-2xl font-bold text-[#C2410C]">{productivityPct}%</div>
              <div className="mt-2 h-1.5 w-full rounded-full bg-zinc-200 overflow-hidden">
                <div
                  className="h-full rounded-full bg-[#C2410C] transition-all duration-500"
                  style={{ width: `${productivityPct}%` }}
                />
              </div>
            </div>

            <div className="clean-card p-4">
              <div className="text-xs font-medium text-tf-muted">Próximo Compromisso</div>
              {nextAppointment ? (
                <>
                  <div className="mt-1.5 text-sm font-bold text-tf-text truncate" title={nextAppointment.title}>
                    {nextAppointment.title}
                  </div>
                  <div className="mt-1 flex items-center justify-between text-[11px]">
                    <span className="font-semibold text-[#C2410C]">{nextAppointment.startTime}</span>
                    <button
                      onClick={() => onTriggerVoiceCall(nextAppointment)}
                      className="underline text-[#C2410C] hover:text-[#9A3412] font-semibold"
                    >
                      Ligar agora
                    </button>
                  </div>
                </>
              ) : (
                <div className="mt-2 text-xs text-tf-muted">Livre por hoje</div>
              )}
            </div>
          </div>

          {/* Grid Principal: Check-list de Hoje (Esquerda 2 cols) + Próximas Atividades (Direita 1 col) */}
          <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
            {/* CHECK-LIST DE HOJE */}
            <div className="xl:col-span-2 clean-card p-5 sm:p-6 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h2 className="text-base sm:text-lg font-bold tracking-tight text-tf-text">
                    Check-list de Hoje
                  </h2>
                  <p className="text-xs text-tf-muted">
                    Atividades não concluídas voltam automaticamente para o topo de amanhã.
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setFocusModeOnly(!focusModeOnly)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition ${
                      focusModeOnly
                        ? 'bg-[#C2410C] text-white border-[#C2410C]'
                        : 'bg-white text-tf-muted border-tf-border hover:text-tf-text'
                    }`}
                  >
                    <span>{focusModeOnly ? 'Modo Foco Ativo' : 'Filtrar Prioridades'}</span>
                  </button>
                </div>
              </div>

              {/* Barra de Progresso do Check-list Diário */}
              {totalToday > 0 && (
                <div className="rounded-2xl bg-[#FFF7ED] border border-[#FDBA74] px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
                  <div className="text-xs font-extrabold text-[#EA580C]">
                    ☑️ Progresso do Check-list: {todayTasks.filter(t => t.status === 'completed').length} de {totalToday} concluída(s)
                  </div>
                  <div className="flex-1 max-w-xs h-2.5 rounded-full bg-orange-100 overflow-hidden border border-orange-200">
                    <div
                      className="h-full bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] transition-all duration-500"
                      style={{
                        width: `${Math.round((todayTasks.filter(t => t.status === 'completed').length / totalToday) * 100)}%`,
                      }}
                    />
                  </div>
                </div>
              )}

              {focusTasks.length === 0 ? (
                <div className="rounded-2xl border border-dashed border-tf-border p-8 text-center space-y-2">
                  <div className="text-3xl">🌟</div>
                  <p className="text-sm font-bold text-tf-text">Nenhuma tarefa pendente neste filtro para hoje!</p>
                  <p className="text-xs text-tf-muted">Adicione um novo compromisso ou desative o filtro de Modo Foco.</p>
                </div>
              ) : (
                <div className="space-y-3">
                  {focusTasks.map((task, taskIdx) => {
                    const cat = getCategoryObj(task.category);
                    const prio = PRIORITIES[task.priority] || PRIORITIES.high;
                    const stat = STATUS_MAP[task.status] || STATUS_MAP.pending;
                    const isDone = task.status === 'completed';

                    return (
                      <div
                        key={task.id}
                        className={`rounded-2xl border p-4 transition-all ${
                          isDone
                            ? 'border-tf-border bg-black/20 opacity-75'
                            : task.pinnedToTop
                            ? 'border-2 border-[#FF6B00] bg-[#FFF7ED] shadow-md'
                            : task.status === 'overdue'
                            ? 'border-red-500/50 bg-red-950/15'
                            : 'border-tf-border bg-[#141D18] hover:border-[#FF6B00]/50'
                        }`}
                      >
                        {task.pinnedToTop && !isDone && (
                          <div className="mb-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white text-[11px] font-extrabold shadow-sm badge-orange-white">
                            <span>📌</span>
                            <span>
                              PRIORIDADE Nº 1 NO TOPO DO CHECK-LIST
                              {task.rolledOverFrom ? ` • Não concluída em ${formatDateBR(task.rolledOverFrom)}` : ''}
                            </span>
                          </div>
                        )}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div className="flex items-start gap-3">
                            <button
                              onClick={() => onToggleComplete(task.id)}
                              className={`mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition ${
                                isDone
                                  ? 'bg-[#FF8533] border-[#FF8533] text-[#101713] font-bold'
                                  : 'border-[#FF8533]/60 hover:border-[#FF6B00]'
                              }`}
                              title="Marcar item do Check-list como concluído"
                            >
                              {isDone ? '✓' : ''}
                            </button>

                            <div className="space-y-1 flex-1 min-w-0">
                              <div className="flex flex-wrap items-center gap-2">
                                <label className="inline-flex items-center gap-1 font-mono text-xs font-extrabold px-2 py-0.5 rounded-md bg-[#FFF7ED] border border-orange-200 text-[#EA580C]">
                                  <span>⏰</span>
                                  <input
                                    type="time"
                                    value={task.startTime || '09:00'}
                                    onChange={e =>
                                      onQuickUpdateTask &&
                                      onQuickUpdateTask(task.id, {
                                        startTime: e.target.value,
                                        endTime: addMinutesToTime(e.target.value, 60),
                                      })
                                    }
                                    className="bg-transparent font-mono text-xs font-extrabold text-[#EA580C] focus:outline-none cursor-pointer"
                                    title="Clique para editar o horário diretamente"
                                  />
                                </label>
                                <span
                                  className="text-[11px] font-bold px-2.5 py-0.5 rounded-full"
                                  style={{ backgroundColor: cat.bg, color: cat.color, border: `1px solid ${cat.border}40` }}
                                >
                                  {cat.emoji} {cat.name}
                                </span>
                                <select
                                  value={task.priority}
                                  onChange={e => onQuickUpdateTask && onQuickUpdateTask(task.id, { priority: e.target.value })}
                                  className={`text-[11px] font-bold px-2 py-0.5 rounded-full border cursor-pointer ${prio.badgeBg}`}
                                  title="Alterar prioridade rapidamente"
                                >
                                  {Object.values(PRIORITIES).map(p => (
                                    <option key={p.id} value={p.id}>
                                      {p.emoji} {p.label}
                                    </option>
                                  ))}
                                </select>
                                <select
                                  value={task.status}
                                  onChange={e => onQuickUpdateTask && onQuickUpdateTask(task.id, { status: e.target.value })}
                                  className={`text-[11px] font-bold px-2 py-0.5 rounded-full border cursor-pointer ${stat.badge}`}
                                  title="Alterar status rapidamente"
                                >
                                  {Object.values(STATUS_MAP).map(s => (
                                    <option key={s.id} value={s.id}>
                                      {s.label}
                                    </option>
                                  ))}
                                </select>
                                {task.recurrence && task.recurrence !== 'none' && (
                                  <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-orange-50 text-[#EA580C] border border-orange-200">
                                    🔁 Recorrente
                                  </span>
                                )}
                                {task.isFavorite && <span title="Favorita">📌</span>}
                              </div>

                              <h3
                                onClick={() => onEditTask(task)}
                                className={`text-sm sm:text-base font-bold cursor-pointer hover:text-[#FF6B00] transition ${
                                  isDone ? 'line-through text-tf-muted' : 'text-tf-text'
                                }`}
                                title="Clique para editar todos os detalhes"
                              >
                                {task.title}
                              </h3>

                              {task.description && (
                                <p className="text-xs text-tf-muted line-clamp-1">{task.description}</p>
                              )}

                              {(task.lastWhatsAppReply || (Array.isArray(task.observations) && task.observations.length > 0)) && (
                                <div className="mt-1.5 rounded-xl bg-[#FFF7ED] border border-[#FDBA74] px-3 py-1.5 space-y-1 text-xs">
                                  {task.lastWhatsAppReply && (
                                    <div className="font-extrabold text-[#EA580C] flex items-center justify-between gap-2">
                                      <span>💬 Resposta WhatsApp: "{task.lastWhatsAppReply}"</span>
                                      <button
                                        type="button"
                                        onClick={() => onEditTask(task)}
                                        className="text-[10px] underline font-bold text-[#EA580C]"
                                      >
                                        ✏️ editar
                                      </button>
                                    </div>
                                  )}
                                  {Array.isArray(task.observations) &&
                                    task.observations.map((obs, idx) => (
                                      <div key={idx} className="text-[11px] font-semibold text-tf-text flex items-center justify-between gap-2">
                                        <span>📝 {obs}</span>
                                        <button
                                          type="button"
                                          onClick={() => onEditTask(task)}
                                          className="text-[10px] text-[#EA580C] hover:underline font-bold"
                                        >
                                          ✏️
                                        </button>
                                      </div>
                                    ))}
                                </div>
                              )}

                              <div className="flex flex-wrap items-center gap-3 pt-1 text-[11px] text-tf-muted">
                                {task.location && <span>📍 {task.location}</span>}
                                {task.notifyTelegram && <span className="text-sky-300">✈️ Telegram Ativo</span>}
                                {task.notifyVoiceCall && <span className="text-[#FFD09B]">📞 Ligação se ignorar</span>}
                                {task.confirmedVia === 'voice_dtmf' && (
                                  <span className="text-[#FF6B00] font-semibold">
                                    ✅ Confirmada por Tecla 1 (DTMF)
                                  </span>
                                )}
                                {task.status === 'completed' && (
                                  <span className="text-[#EA580C] font-extrabold bg-[#FFF7ED] border border-[#FDBA74] px-2 py-0.5 rounded-full">
                                    🏆 Concluída via {task.completedVia === 'whatsapp' ? 'WhatsApp 📲' : 'Sistema ✅'} {task.completedAt ? `às ${task.completedAt}` : ''}
                                  </span>
                                )}
                                {task.status !== 'completed' && (task.confirmedVia === 'whatsapp' || task.confirmedVia === 'telegram') && (
                                  <span className="text-[#FF6B00] font-extrabold">
                                    ✅ Confirmada via {task.confirmedVia === 'whatsapp' ? 'WhatsApp 📲' : 'Telegram ✈️'} {task.confirmedAt ? `às ${task.confirmedAt}` : ''}
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>

                          {/* Ações Rápidas da Tarefa (Check-list & Disparo) */}
                          <div className="flex flex-wrap sm:flex-nowrap items-center gap-1.5 self-end sm:self-center">
                            {task.status !== 'completed' && onRolloverToTomorrow && (
                              <button
                                onClick={() => onRolloverToTomorrow(task.id, '', 'NÃO CONCLUÍDA (Movida pelo Painel)')}
                                className="px-2.5 py-1.5 rounded-xl bg-[#FFF7ED] hover:bg-[#FF6B00] text-[#EA580C] hover:text-white border border-[#FF6B00] text-xs font-extrabold transition"
                                title="Não foi concluída hoje? Clique para enviá-la automaticamente ao TOPO da lista de amanhã!"
                              >
                                ↪️ Topo Amanhã 📌
                              </button>
                            )}
                            <button
                              onClick={() => onTriggerTelegramAlert(task, 'CHECK-LIST WHATSAPP: FOI CONCLUÍDA OU NÃO?', 'whatsapp')}
                              className="px-2.5 py-1.5 rounded-xl bg-[#FF6B00]/20 hover:bg-[#FF6B00]/35 text-[#FF6B00] border border-[#FF6B00]/40 text-xs font-bold transition"
                              title="Perguntar no WhatsApp se foi concluída ou não"
                            >
                              🟠 WhatsApp
                            </button>
                            <button
                              onClick={() => onTriggerTelegramAlert(task, 'FALTAM 5 MINUTOS — Alerta Telegram Bot', 'telegram')}
                              className="px-2.5 py-1.5 rounded-xl bg-[#0088CC]/20 hover:bg-[#0088CC]/35 text-sky-300 border border-[#0088CC]/40 text-xs font-bold transition"
                              title="Disparar Alerta no Telegram com botões"
                            >
                              ✈️ Telegram
                            </button>
                            <button
                              onClick={() => onTriggerVoiceCall(task)}
                              className="px-2.5 py-1.5 rounded-xl bg-[#FF9F43]/20 hover:bg-[#FF9F43]/35 text-[#FFD09B] border border-[#FF9F43]/40 text-xs font-bold transition"
                              title="Realizar Ligação Telefônica Automática com Voz e DTMF"
                            >
                              📞 Ligar
                            </button>
                            <button
                              onClick={() => onSmartReschedule(task.id)}
                              className="px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-tf-muted hover:text-white text-xs font-semibold transition"
                              title="Reagendamento Inteligente (+1 hora)"
                            >
                              🔄 +1h
                            </button>
                            <button
                              onClick={() => onEditTask(task)}
                              className="px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-tf-muted hover:text-white text-xs font-semibold transition"
                              title="Editar tarefa"
                            >
                              ✏️
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Coluna Direita: Próximas Atividades + Ações Rápidas */}
            <div className="space-y-4">
              {/* Linha do Tempo das Próximas Atividades */}
              <div className="clean-card p-5 space-y-3.5">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-[#18181B]">Próximas Atividades</h3>
                  <button
                    onClick={() => onSelectDateInCalendar(todayISO)}
                    className="text-xs font-semibold text-[#C2410C] hover:underline"
                  >
                    Ver Agenda →
                  </button>
                </div>

                <div className="relative pl-4 border-l-2 border-[#E4E4E7] space-y-2.5">
                  {tasks.slice(0, 6).map(t => {
                    const cat = getCategoryObj(t.category);
                    return (
                      <div
                        key={t.id}
                        onClick={() => onEditTask(t)}
                        className="relative group cursor-pointer rounded-xl p-2.5 bg-[#FAFAFA] hover:bg-[#FFF7ED] border border-[#E4E4E7] transition"
                      >
                        <span
                          className="absolute -left-[21px] top-3.5 w-2.5 h-2.5 rounded-full"
                          style={{ backgroundColor: cat.color }}
                        />
                        <div className="flex items-center justify-between text-[11px] text-[#52525B]">
                          <span className="font-mono font-bold text-[#C2410C]">
                            {formatDateBR(t.date)} • {t.startTime}
                          </span>
                          <span>{cat.name}</span>
                        </div>
                        <div className="text-xs font-semibold text-[#18181B] group-hover:text-[#C2410C] truncate mt-0.5">
                          {t.title}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Ações Rápidas de Disparo */}
              <div className="clean-card p-5 space-y-2.5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-[#52525B]">
                  Disparo Rápido
                </h3>
                <button
                  onClick={() => onTriggerTelegramAlert(nextAppointment || todayTasks[0], 'ALERTA WHATSAPP MANUAL', 'whatsapp')}
                  className="w-full btn-primary py-2.5 px-4 text-xs"
                >
                  Enviar Alerta no WhatsApp Agora
                </button>
                <button
                  onClick={() => onTriggerVoiceCall(nextAppointment || todayTasks[0])}
                  className="w-full btn-secondary py-2.5 px-4 text-xs"
                >
                  Testar Ligação de Voz
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 11. SEÇÃO 3: 📅 CALENDÁRIO INTELIGENTE (DIA, SEMANA, MÊS, LISTA + DRAG & DROP)
    // =========================================================================
    function SmartCalendarView({
      tasks,
      categories,
      selectedDate,
      setSelectedDate,
      onCreateAtSlot,
      onEditTask,
      onMoveTaskSlot,
      onTriggerTelegramAlert,
      onTriggerVoiceCall,
    }) {
      const [viewMode, setViewMode] = useState('week'); // 'day' | 'week' | 'month' | 'list'
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const currentHourStr = `${String(new Date().getHours()).padStart(2, '0')}:00`;

      const getCategoryObj = (catId) =>
        categories.find(c => c.id === catId) || DEFAULT_CATEGORIES[0];

      const getHourEmoji = (hourStr) => {
        const h = parseInt(hourStr.slice(0, 2), 10);
        if (h <= 7) return '🌅';
        if (h === 8) return '☕';
        if (h >= 9 && h <= 11) return '☀️';
        if (h >= 12 && h <= 13) return '🍽️';
        if (h >= 14 && h <= 17) return '⚡';
        if (h >= 18 && h <= 19) return '🌇';
        return '🌙';
      };

      const filteredTasks = useMemo(() => {
        if (categoryFilter === 'all') return tasks;
        return tasks.filter(t => t.category === categoryFilter);
      }, [tasks, categoryFilter]);

      // Navegação de datas
      const handleNavigate = (dir) => {
        const delta = viewMode === 'day' ? dir : viewMode === 'week' ? dir * 7 : dir * 30;
        setSelectedDate(addDaysISO(selectedDate, delta));
      };

      // Dias da semana atual a partir de selectedDate
      const weekDays = useMemo(() => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const current = new Date(y, m - 1, d);
        const dayOfWeek = current.getDay(); // 0 = Dom
        const sunday = new Date(y, m - 1, d - dayOfWeek);
        const arr = [];
        const names = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const emojis = ['☀️', '🚀', '⚡', '🔥', '🎯', '✨', '🎉'];
        for (let i = 0; i < 7; i++) {
          const dt = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
          const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
          arr.push({
            iso,
            dayName: names[i],
            dayEmoji: emojis[i],
            dayNumber: dt.getDate(),
          });
        }
        return arr;
      }, [selectedDate]);

      // Grade do Mês (42 células)
      const monthCells = useMemo(() => {
        const [y, m] = selectedDate.split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const startOffset = firstDay.getDay();
        const startDate = new Date(y, m - 1, 1 - startOffset);
        const cells = [];
        for (let i = 0; i < 42; i++) {
          const dt = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
          const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
          cells.push({
            iso,
            dayNumber: dt.getDate(),
            isCurrentMonth: dt.getMonth() === m - 1,
          });
        }
        return cells;
      }, [selectedDate]);

      const hoursList = useMemo(() => {
        const hrs = [];
        for (let h = 6; h <= 22; h++) {
          hrs.push(`${String(h).padStart(2, '0')}:00`);
        }
        return hrs;
      }, []);

      const handleDropOnSlot = (targetDate, targetHour) => {
        if (!draggedTaskId) return;
        onMoveTaskSlot(draggedTaskId, targetDate, targetHour);
        setDraggedTaskId(null);
      };

      const [selY, selM] = selectedDate.split('-').map(Number);
      const monthTitle = new Date(selY, selM - 1, 1).toLocaleDateString('pt-BR', {
        month: 'long',
        year: 'numeric',
      });

      return (
        <div className="space-y-5 animate-pop-in">
          {/* Barra de Controle Superior do Calendário com Emojis e Animações */}
          <div className="rounded-3xl border-2 border-[#FED7AA] bg-white p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4 shadow-sm">
            <div className="flex flex-wrap items-center gap-3.5">
              <div className="flex items-center gap-1 bg-[#FFF7ED] p-1.5 rounded-2xl border border-[#FDBA74]">
                <button
                  onClick={() => handleNavigate(-1)}
                  className="px-3 py-1.5 rounded-xl hover:bg-orange-100 text-xs font-extrabold text-[#EA580C] transition hover:scale-110"
                  title="Período anterior"
                >
                  ⬅️
                </button>
                <button
                  onClick={() => setSelectedDate(getTodayISO())}
                  className="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white text-xs font-extrabold shadow-sm transition hover:scale-105"
                >
                  🌟 Hoje
                </button>
                <button
                  onClick={() => handleNavigate(1)}
                  className="px-3 py-1.5 rounded-xl hover:bg-orange-100 text-xs font-extrabold text-[#EA580C] transition hover:scale-110"
                  title="Próximo período"
                >
                  ➡️
                </button>
              </div>

              <div className="group">
                <div className="flex items-center gap-2">
                  <span className="text-2xl animate-float">🗓️</span>
                  <h2 className="text-lg sm:text-xl font-extrabold capitalize text-tf-text">
                    {monthTitle} <span className="emoji-wiggle">✨</span>
                  </h2>
                </div>
                <p className="text-xs text-tf-muted">
                  👆 Clique em qualquer horário para agendar ou 🖐️ arraste tarefas para reagendar (Alertas 📲 5m, 3m, 2m, 1m e Pós-Início)
                </p>
              </div>
            </div>

            {/* Seletor de Visualização: Dia, Semana, Mês, Lista com Emojis */}
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="inline-flex rounded-2xl bg-[#FFF7ED] p-1 border border-[#FDBA74]">
                {[
                  { id: 'day',   label: '🌞 Dia' },
                  { id: 'week',  label: '🗓️ Semana' },
                  { id: 'month', label: '📅 Mês' },
                  { id: 'list',  label: '📋 Lista' },
                ].map(v => (
                  <button
                    key={v.id}
                    onClick={() => setViewMode(v.id)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition-all duration-200 ${
                      viewMode === v.id
                        ? 'bg-gradient-to-r from-[#FF6B00] to-[#FF8533] text-white shadow scale-105'
                        : 'text-tf-muted hover:text-[#EA580C]'
                    }`}
                  >
                    {v.label}
                  </button>
                ))}
              </div>

              <button
                onClick={() => onCreateAtSlot(selectedDate, '09:00')}
                className="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white font-extrabold text-xs shadow-md hover:scale-105 transition flex items-center gap-1.5"
              >
                <span className="emoji-wiggle">➕</span>
                <span>Novo Compromisso ✨</span>
              </button>
            </div>
          </div>

          {/* Filtro por Categorias Coloridas com Emojis */}
          <div className="flex flex-wrap items-center gap-2">
            <button
              onClick={() => setCategoryFilter('all')}
              className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition-all duration-200 ${
                categoryFilter === 'all'
                  ? 'bg-[#FF6B00] text-white border-[#FF6B00] shadow-sm scale-105'
                  : 'bg-white text-tf-muted border-tf-border hover:border-[#FF6B00]'
              }`}
            >
              🌈 Todas ({tasks.length})
            </button>
            {categories.map(cat => (
              <button
                key={cat.id}
                onClick={() => setCategoryFilter(cat.id)}
                className={`group px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition-all duration-200 ${
                  categoryFilter === cat.id
                    ? 'scale-105 shadow-md'
                    : 'opacity-85 hover:opacity-100 hover:scale-105'
                }`}
                style={{
                  backgroundColor: categoryFilter === cat.id ? cat.color : cat.bg,
                  color: categoryFilter === cat.id ? '#FFFFFF' : cat.color,
                  borderColor: cat.border,
                }}
              >
                <span className="emoji-wiggle mr-1">{cat.emoji}</span>
                <span>{cat.name}</span>
              </button>
            ))}
          </div>

          {/* 1. VISUALIZAÇÃO SEMANA OU DIA (GRADE DE HORÁRIOS ANIMADA COM EMOJIS) */}
          {(viewMode === 'week' || viewMode === 'day') && (
            <div className="rounded-3xl border-2 border-[#FED7AA] bg-white overflow-hidden shadow-xl animate-pop-in">
              <div className="overflow-x-auto">
                <div className={viewMode === 'week' ? 'min-w-[840px]' : 'min-w-full'}>
                  {/* Cabeçalho dos dias com Emojis e Indicador HOJE */}
                  <div
                    className="grid border-b-2 border-[#FED7AA] bg-gradient-to-r from-[#FFF7ED] via-[#FFFFFF] to-[#FFF7ED]"
                    style={{
                      gridTemplateColumns: viewMode === 'week' ? '86px repeat(7, 1fr)' : '86px 1fr',
                    }}
                  >
                    <div className="p-3 flex flex-col items-center justify-center text-[11px] font-mono font-bold text-[#EA580C] border-r border-tf-border">
                      <span className="text-base animate-float">⏰</span>
                      <span>GMT-3</span>
                    </div>
                    {(viewMode === 'week'
                      ? weekDays
                      : [
                          {
                            iso: selectedDate,
                            dayName: new Date(selectedDate + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long' }),
                            dayEmoji: '🌟',
                            dayNumber: selectedDate.split('-')[2],
                          },
                        ]
                    ).map(col => {
                      const isToday = col.iso === getTodayISO();
                      const isSelected = col.iso === selectedDate;
                      const dayCount = filteredTasks.filter(t => t.date === col.iso).length;
                      return (
                        <div
                          key={col.iso}
                          onClick={() => setSelectedDate(col.iso)}
                          className={`group p-3 text-center cursor-pointer border-r border-tf-border transition-all duration-200 ${
                            isToday
                              ? 'bg-gradient-to-b from-[#FFF0E0] to-white'
                              : isSelected
                              ? 'bg-orange-50/60'
                              : 'hover:bg-orange-50/40'
                          }`}
                        >
                          <div className="flex items-center justify-center gap-1 text-[11px] uppercase font-extrabold text-tf-muted">
                            <span className="emoji-wiggle text-sm">{col.dayEmoji || '📅'}</span>
                            <span>{col.dayName}</span>
                          </div>
                          <div
                            className={`mx-auto mt-1.5 w-9 h-9 rounded-2xl flex items-center justify-center text-sm font-extrabold transition-transform duration-200 group-hover:scale-110 ${
                              isToday
                                ? 'bg-gradient-to-br from-[#FF6B00] to-[#FF8C1A] text-white shadow-md badge-orange-white'
                                : 'text-tf-text bg-orange-50/70'
                            }`}
                          >
                            {col.dayNumber}
                          </div>
                          {isToday && (
                            <div className="mt-1 text-[9px] font-extrabold text-[#EA580C] tracking-wider uppercase animate-pulse">
                              ✨ HOJE
                            </div>
                          )}
                          {dayCount > 0 && (
                            <div className="mt-1 inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#FF6B00] text-white text-[10px] font-extrabold badge-orange-white">
                              <span>📌</span>
                              <span>{dayCount}</span>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Linhas de Horário (06:00 às 22:00) com Emojis de Período e Animação de Slot */}
                  <div className="max-h-[620px] overflow-y-auto divide-y divide-tf-border/60">
                    {hoursList.map(hourStr => {
                      const hourPrefix = hourStr.slice(0, 2);
                      const cols = viewMode === 'week' ? weekDays : [{ iso: selectedDate }];
                      const isCurrentHour = hourStr === currentHourStr;
                      const hourEmoji = getHourEmoji(hourStr);

                      return (
                        <div
                          key={hourStr}
                          className={`grid min-h-[68px] transition-colors ${
                            isCurrentHour ? 'bg-[#FFF5EB]' : ''
                          }`}
                          style={{
                            gridTemplateColumns: viewMode === 'week' ? '86px repeat(7, 1fr)' : '86px 1fr',
                          }}
                        >
                          <div className="p-2 flex flex-col items-end justify-start pr-2.5 text-[11px] font-mono border-r border-tf-border bg-[#FFF9F5]">
                            <div className="flex items-center gap-1 font-bold text-tf-text">
                              <span className="text-xs">{hourEmoji}</span>
                              <span>{hourStr}</span>
                            </div>
                            {isCurrentHour && (
                              <span className="mt-1 px-1.5 py-0.5 rounded-full bg-[#FF6B00] text-white text-[9px] font-extrabold animate-pulse badge-orange-white">
                                🔴 AGORA
                              </span>
                            )}
                          </div>

                          {cols.map(col => {
                            const slotTasks = filteredTasks.filter(
                              t => t.date === col.iso && (t.startTime || '09:00').slice(0, 2) === hourPrefix
                            );

                            return (
                              <div
                                key={col.iso + hourStr}
                                onDragOver={e => e.preventDefault()}
                                onDrop={() => handleDropOnSlot(col.iso, hourStr)}
                                onClick={e => {
                                  if (e.target === e.currentTarget) {
                                    onCreateAtSlot(col.iso, hourStr);
                                  }
                                }}
                                className="agenda-slot-cell relative p-1.5 border-r border-tf-border/50 cursor-pointer space-y-1.5"
                              >
                                {slotTasks.length === 0 && (
                                  <div
                                    onClick={() => onCreateAtSlot(col.iso, hourStr)}
                                    className="slot-add-hint h-full min-h-[48px] rounded-xl border border-dashed border-[#FB923C] bg-white/80 flex items-center justify-center gap-1 text-[11px] font-extrabold text-[#EA580C]"
                                  >
                                    <span>➕</span>
                                    <span>Agendar {hourStr} ✨</span>
                                  </div>
                                )}

                                {slotTasks.map(task => {
                                  const cat = getCategoryObj(task.category);
                                  const prio = PRIORITIES[task.priority] || PRIORITIES.high;
                                  const isCompleted = task.status === 'completed';
                                  const isConfirmed = task.status === 'confirmed' || isCompleted;
                                  return (
                                    <div
                                      key={task.id}
                                      draggable
                                      onDragStart={() => setDraggedTaskId(task.id)}
                                      onClick={ev => {
                                        ev.stopPropagation();
                                        onEditTask(task);
                                      }}
                                      className="agenda-task-card group rounded-2xl p-2.5 text-xs cursor-grab active:cursor-grabbing shadow-sm border border-orange-200 bg-white"
                                      style={{
                                        borderLeft: `5px solid ${cat.color}`,
                                      }}
                                      title="Arraste para outro horário ou clique para editar"
                                    >
                                      <div className="flex items-center justify-between gap-1">
                                        <span className="inline-flex items-center gap-1 font-mono font-extrabold text-[10px] text-[#EA580C]">
                                          <span className="emoji-wiggle">{cat.emoji}</span>
                                          <span>⏰ {task.startTime}</span>
                                        </span>
                                        <span className="inline-flex items-center gap-1 text-[10px]">
                                          <span>{prio.emoji}</span>
                                          <span title="Alertas WhatsApp & SMS ativos">📲</span>
                                          {task.notifyVoiceCall && <span title="Escalonamento de Ligação ativo">📞</span>}
                                        </span>
                                      </div>
                                      <div className="font-extrabold text-tf-text truncate mt-1 flex items-center gap-1">
                                        {isCompleted ? (
                                          <span title="Atividade Concluída">🏆</span>
                                        ) : isConfirmed ? (
                                          <span title="Presença Confirmada">✅</span>
                                        ) : (
                                          <span className="w-2 h-2 rounded-full bg-[#FF6B00] animate-ping shrink-0" />
                                        )}
                                        <span className={`truncate ${isCompleted ? 'line-through opacity-80' : ''}`}>{task.title}</span>
                                      </div>
                                      {(task.lastWhatsAppReply || (Array.isArray(task.observations) && task.observations.length > 0)) && (
                                        <div className="mt-1 px-2 py-1 rounded-lg bg-[#FFF7ED] border border-[#FDBA74] text-[10px] font-bold text-[#EA580C] truncate">
                                          💬 {task.observations?.length ? task.observations[task.observations.length - 1] : `WhatsApp: "${task.lastWhatsAppReply}"`}
                                        </div>
                                      )}
                                      <div className="mt-1 flex items-center justify-between text-[10px] text-tf-muted">
                                        <span>{isCompleted ? '🏆 Concluída' : isConfirmed ? '🎉 Confirmado' : '🔔 5m•3m•2m•1m'}</span>
                                        <button
                                          type="button"
                                          onClick={ev => {
                                            ev.stopPropagation();
                                            onTriggerTelegramAlert(task, 'LEMBRETE MANUAL DA AGENDA', 'whatsapp');
                                          }}
                                          className="px-1.5 py-0.5 rounded bg-orange-100 hover:bg-[#FF6B00] text-[#EA580C] hover:text-white font-bold transition"
                                          title="Disparar lembrete agora no WhatsApp"
                                        >
                                          📲 Enviar
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 2. VISUALIZAÇÃO MÊS ANIMADA COM EMOJIS */}
          {viewMode === 'month' && (
            <div className="rounded-3xl border-2 border-[#FED7AA] bg-white overflow-hidden shadow-xl animate-pop-in">
              <div className="grid grid-cols-7 border-b-2 border-[#FED7AA] bg-[#FFF7ED] text-center py-3 text-xs font-extrabold text-[#EA580C]">
                {['☀️ Dom', '🚀 Seg', '⚡ Ter', '🔥 Qua', '🎯 Qui', '✨ Sex', '🎉 Sáb'].map(d => (
                  <div key={d}>{d}</div>
                ))}
              </div>
              <div className="grid grid-cols-7 divide-x divide-y divide-tf-border">
                {monthCells.map(cell => {
                  const dayTasks = filteredTasks.filter(t => t.date === cell.iso);
                  const isToday = cell.iso === getTodayISO();
                  return (
                    <div
                      key={cell.iso}
                      onDragOver={e => e.preventDefault()}
                      onDrop={() => handleDropOnSlot(cell.iso, null)}
                      onClick={() => onCreateAtSlot(cell.iso, '09:00')}
                      className={`agenda-slot-cell min-h-[115px] p-2 cursor-pointer transition ${
                        !cell.isCurrentMonth ? 'opacity-40 bg-stone-50' : 'bg-white'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-1.5">
                        <span
                          className={`w-7 h-7 rounded-xl flex items-center justify-center text-xs font-extrabold ${
                            isToday
                              ? 'bg-gradient-to-br from-[#FF6B00] to-[#FF8C1A] text-white shadow badge-orange-white'
                              : 'text-tf-text'
                          }`}
                        >
                          {cell.dayNumber}
                        </span>
                        {dayTasks.length > 0 && (
                          <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-orange-100 text-[#EA580C] font-extrabold">
                            📌 {dayTasks.length}
                          </span>
                        )}
                      </div>
                      <div className="space-y-1">
                        {dayTasks.slice(0, 3).map(t => {
                          const cat = getCategoryObj(t.category);
                          return (
                            <div
                              key={t.id}
                              draggable
                              onDragStart={() => setDraggedTaskId(t.id)}
                              onClick={ev => {
                                ev.stopPropagation();
                                onEditTask(t);
                              }}
                              className="agenda-task-card truncate rounded-lg px-2 py-1 text-[11px] font-bold bg-[#FFF7ED] border border-orange-200"
                              style={{
                                color: cat.color,
                                borderLeft: `4px solid ${cat.color}`,
                              }}
                            >
                              {cat.emoji} {t.startTime} {t.title}
                            </div>
                          );
                        })}
                        {dayTasks.length > 3 && (
                          <div className="text-[10px] text-[#FF6B00] font-extrabold pl-1">
                            ✨ +{dayTasks.length - 3} mais
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 3. VISUALIZAÇÃO LISTA DE COMPROMISSOS ANIMADA */}
          {viewMode === 'list' && (
            <div className="rounded-3xl border-2 border-[#FED7AA] bg-white p-5 space-y-3 animate-pop-in">
              <h3 className="text-base font-extrabold text-tf-text flex items-center gap-2">
                <span className="text-xl animate-float">📋</span>
                <span>Lista Completa de Compromissos ✨</span>
              </h3>
              {filteredTasks.length === 0 ? (
                <div className="py-12 text-center space-y-3">
                  <div className="text-4xl animate-float">🗓️✨</div>
                  <div className="text-sm font-extrabold text-tf-text">
                    Sua agenda está limpinha!
                  </div>
                  <p className="text-xs text-tf-muted max-w-md mx-auto">
                    Clique em qualquer horário do calendário ou no botão abaixo para cadastrar seu primeiro compromisso com alertas automáticos no WhatsApp!
                  </p>
                  <button
                    onClick={() => onCreateAtSlot(selectedDate, '09:00')}
                    className="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white font-extrabold text-xs shadow-md hover:scale-105 transition"
                  >
                    ➕ Criar Primeiro Compromisso ✨
                  </button>
                </div>
              ) : (
                filteredTasks
                  .slice()
                  .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))
                  .map(task => {
                    const cat = getCategoryObj(task.category);
                    const stat = STATUS_MAP[task.status] || STATUS_MAP.pending;
                    return (
                      <div
                        key={task.id}
                        className="agenda-task-card flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-2xl bg-[#FFF7ED] border border-tf-border"
                      >
                        <div className="flex items-center gap-3">
                          <div
                            className="w-10 h-10 rounded-2xl flex items-center justify-center text-lg bg-white border border-orange-200 shadow-sm"
                          >
                            <span className="emoji-wiggle">{cat.emoji}</span>
                          </div>
                          <div>
                            <div className="flex flex-wrap items-center gap-2 text-xs">
                              <span className="font-mono font-extrabold text-[#EA580C]">
                                📅 {formatDateBR(task.date)} • ⏰ {task.startTime} - {task.endTime}
                              </span>
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${stat.badge}`}>
                                {stat.label}
                              </span>
                              {task.recurrence !== 'none' && (

    // 14. SEÇÕES 8 E 13: 📊 RELATÓRIOS, PRODUTIVIDADE, METAS E CONQUISTAS
    // =========================================================================
    function ReportsProductivityView({ tasks, callLogs, settings }) {
      const todayISO = getTodayISO();
      const [ty, tm, td] = todayISO.split('-').map(Number);
      const todayObj = new Date(ty, tm - 1, td);
      const currentDow = todayObj.getDay(); // 0 = Dom .. 6 = Sáb
      const mondayOffset = currentDow === 0 ? -6 : 1 - currentDow;
      const weekStartISO = addDaysISO(todayISO, mondayOffset);
      const weekEndISO = addDaysISO(weekStartISO, 6);
      const currentMonthPrefix = todayISO.slice(0, 7); // YYYY-MM

      const activeTasks = (tasks || []).filter(t => t.status !== 'cancelled');
      const total = activeTasks.length;

      // Tarefas Concluídas (🏆) vs Confirmadas (✅) vs Pendentes (⏳)
      const strictlyCompletedCount = activeTasks.filter(t => t.status === 'completed').length;
      const confirmedOrCompletedCount = activeTasks.filter(
        t => t.status === 'completed' || t.status === 'confirmed'
      ).length;
      const pendingCount = activeTasks.filter(
        t => !['completed', 'confirmed', 'cancelled'].includes(t.status)
      ).length;
      const overdueCount = activeTasks.filter(t => t.status === 'overdue').length;

      // Tarefas de Hoje, da Semana e do Mês (100% REAIS!)
      const todayTasks = activeTasks.filter(t => t.date === todayISO);
      const doneTodayCount = todayTasks.filter(t => t.status === 'completed').length;
      const confirmedTodayCount = todayTasks.filter(t => t.status === 'confirmed').length;

      const weekTasks = activeTasks.filter(t => t.date >= weekStartISO && t.date <= weekEndISO);
      const doneWeekCount = weekTasks.filter(t => t.status === 'completed').length;

      const monthTasks = activeTasks.filter(t => (t.date || '').startsWith(currentMonthPrefix));
      const doneMonthCount = monthTasks.filter(t => t.status === 'completed').length;

      // Reagendadas ou roladas para o dia seguinte (100% real, sem números fictícios)
      const rescheduledCount = (tasks || []).filter(
        t => (t.rescheduledCount && t.rescheduledCount > 0) || Boolean(t.rolledOverFrom)
      ).length;

      // Confirmadas / Concluídas via WhatsApp
      const whatsappResolvedCount = activeTasks.filter(
        t => t.confirmedVia === 'whatsapp' || t.completedVia === 'whatsapp' || Boolean(t.lastWhatsAppReply)
      ).length;

      const totalEstimatedHours = (
        activeTasks.reduce((acc, t) => acc + (Number(t.estimatedMinutes) || 60), 0) / 60
      ).toFixed(1);

      // Índices 100% reais e coerentes entre si:
      // - Índice de Comprometimento: % de tarefas Confirmadas (OK) ou Concluídas (CONCLUIDO)
      // - Taxa de Conclusão: % de tarefas efetivamente Concluídas (CONCLUIDO / Check marcado)
      const commitmentIndex = total > 0 ? Math.round((confirmedOrCompletedCount / total) * 100) : 0;
      const completionRate = total > 0 ? Math.round((strictlyCompletedCount / total) * 100) : 0;

      // Série real dos 7 dias da semana atual (Seg a Dom)
      const weekDayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
      const weeklySeries = weekDayNames.map((label, idx) => {
        const dayISO = addDaysISO(weekStartISO, idx);
        const dayList = activeTasks.filter(t => t.date === dayISO);
        const dayTotal = dayList.length;
        const dayCompleted = dayList.filter(t => t.status === 'completed').length;
        const dayCommitted = dayList.filter(t => t.status === 'completed' || t.status === 'confirmed').length;
        const completedPct = dayTotal > 0 ? Math.round((dayCompleted / dayTotal) * 100) : 0;
        const committedPct = dayTotal > 0 ? Math.round((dayCommitted / dayTotal) * 100) : 0;
        return {
          day: label,
          dateBR: formatDateBR(dayISO).slice(0, 5),
          isToday: dayISO === todayISO,
          total: dayTotal,
          completed: dayCompleted,
          committed: dayCommitted,
          completedPct,
          committedPct,
        };
      });

      const achievements = [
        {

                    </div>

          </div>
        </div>
      );

    // =========================================================================
    // 16. APLICAÇÃO PRINCIPAL MEU CONTROLE MAX (SHELL, NAVEGAÇÃO, MOTOR E ESTADO)

    function MeuControleMaxApp() {
      const STORAGE_KEY = 'meu_controle_max_clean_v1';

      const [state, setState] = useState(() => {
        try {
          localStorage.removeItem('taskflow_saas_state_v1');
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.tasks)) {
              if (!parsed.settings) parsed.settings = {};
              if (!parsed.settings.phone || parsed.settings.phone === '+5511998765432') {
                parsed.settings.phone = '+5589981026502';
              }
              if (!parsed.settings.whatsappNumber || parsed.settings.whatsappNumber === '+5511998765432') {
                parsed.settings.whatsappNumber = '+5589981026502';
              }
              if (!parsed.settings.greenApiUrl) {
                parsed.settings.greenApiUrl = 'https://7107.api.greenapi.com';
              }
              if (!parsed.settings.greenApiIdInstance) {
                parsed.settings.greenApiIdInstance = '710722790234';
              }
              if (!parsed.settings.greenApiToken) {
                parsed.settings.greenApiToken = 'bc3f8075a090411296a983a516a499d80a6ec55c88f648c2bf';
              }
              parsed.categories = DEFAULT_CATEGORIES;
              return parsed;
            }
          }
        } catch (e) {}
        return createInitialData();
      });

      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'calendar' | 'alerts' | 'assistant' | 'reports' | 'settings'
      const [nowTime, setNowTime] = useState(new Date());
      const [focusModeOnly, setFocusModeOnly] = useState(false);
      const [selectedCalendarDate, setSelectedCalendarDate] = useState(getTodayISO());

      // Modais de Tarefa, Alerta Telegram e Ligação Automática
      const [taskModalOpen, setTaskModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [activeTelegramPopup, setActiveTelegramPopup] = useState(null);
      const [activePhoneCall, setActivePhoneCall] = useState(null);
      const [toast, setToast] = useState(null);
      const escalationTimerRef = useRef(null);
      const lastTelegramUpdateIdRef = useRef(0);

      // Persistência automática no LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }, [state]);

      // Sincroniza tema claro/escuro
      useEffect(() => {
        const rootHtml = document.documentElement;
        if (state.settings?.theme === 'light') {
          rootHtml.classList.remove('dark');
          rootHtml.classList.add('light');
        } else {
          rootHtml.classList.remove('light');
          rootHtml.classList.add('dark');
        }
      }, [state.settings?.theme]);

      // Relógio em tempo real
      useEffect(() => {
        const timer = setInterval(() => setNowTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const showToast = useCallback((message, type = 'info') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => {
          setToast(prev => (prev && Date.now() - prev.id >= 3800 ? null : prev));
        }, 4000);
      }, []);

      const setSettings = (updater) => {
        setState(prev => ({
          ...prev,
          settings: typeof updater === 'function' ? updater(prev.settings) : updater,
        }));
      };

      const setCategories = (updater) => {
        setState(prev => ({
          ...prev,
          categories: typeof updater === 'function' ? updater(prev.categories) : updater,
        }));
      };

      // =======================================================================
      // DISPARO MULTI-CANAL ESCALONADO: 5M ➔ 3M ➔ 2M ➔ 1M ➔ INÍCIO ➔ PÓS-INÍCIO
      // =======================================================================
      const autoTriggeredStagesRef = useRef({});
      const rapidSequenceTimersRef = useRef([]);
      const lastAlertedTaskIdRef = useRef(null);
      const [lastWhatsAppMonitorEvent, setLastWhatsAppMonitorEvent] = useState(null);

      const clearAllRapidSequenceTimers = useCallback(() => {
        if (rapidSequenceTimersRef.current.length > 0) {
          rapidSequenceTimersRef.current.forEach(t => clearTimeout(t));
          rapidSequenceTimersRef.current = [];
        }
      }, []);

      const handleTriggerTelegramAlert = useCallback(
        async (task, stageLabel = 'FALTAM 5 MINUTOS PARA O INÍCIO', preferredTab = 'whatsapp') => {
          if (!task) return;
          lastAlertedTaskIdRef.current = task.id;
          phoneAudio.playNotificationChime();

          let realSent = false;
          let whatsappSent = false;
          let smsSent = false;

          // 1. Disparo Real no Telegram Bot API (se configurado)
          if (state.settings.telegramBotToken && state.settings.telegramChatId) {
            try {
              await sendRealTelegramReminder({
                botToken: state.settings.telegramBotToken,
                chatId: state.settings.telegramChatId,
                task,
                stageLabel,
              });
              realSent = true;
            } catch (err) {}
          }

          // 2. Disparo Real no WhatsApp (Green-API / CallMeBot / Evolution / Twilio)
          try {
            const waRes = await sendRealWhatsAppReminder({
              settings: state.settings,
              task,
              stageLabel,
            });
            if (!waRes.simulated) {
              whatsappSent = true;
              showToast(`🟠📲 [${stageLabel}] enviado no seu WhatsApp (${state.settings.whatsappNumber || '+55 89 98102-6502'})!`, 'success');
            }
          } catch (err) {}

          // 3. Disparo Real de SMS (Twilio SMS, se configurado)
          try {
            const smsRes = await sendRealSmsReminder({
              settings: state.settings,
              task,
            });
            if (!smsRes.simulated) smsSent = true;
          } catch (err) {}

          const nowStr = new Date().toLocaleTimeString('pt-BR');
          const newLog = {
            id: 'log-' + Date.now(),
            taskId: task.id,
            taskTitle: task.title,
            channel: preferredTab,
            stageLabel: `🟠 ${stageLabel} (WhatsApp + SMS)`,
            status: realSent || whatsappSent || smsSent ? 'sent_real_api' : 'delivered_multichannel',
            userResponse: 'Ciclo ativo: 5m ➔ 3m ➔ 2m ➔ 1m ➔ Início ➔ Pós-Início',
            timestamp: `Hoje, ${nowStr}`,
          };

          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t =>
              t.id === task.id && t.status === 'pending' ? { ...t, status: 'notified' } : t
            ),
            notificationLogs: [newLog, ...prev.notificationLogs],
          }));

          setActiveTelegramPopup({
            task,
            stageLabel,
            realSent,
            whatsappSent,
            smsSent,
            preferredTab,
          });
        },
        [state.settings, showToast]
      );

      // =======================================================================
      // MONITORAMENTO AUTOMÁTICO SEGUNDO A SEGUNDO:
      // DISPARA EM: 5 MIN, 3 MIN, 2 MIN, 1 MIN ANTES, NO INÍCIO E APÓS O INÍCIO!
      // =======================================================================
      useEffect(() => {
        const todayISO = getTodayISO();
        const nowSecsTotal =
          nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();

        state.tasks.forEach(task => {
          if (task.date !== todayISO) return;
          // Continua disparando enquanto NÃO estiver confirmada, concluída ou cancelada!
          if (['confirmed', 'completed', 'cancelled'].includes(task.status)) return;

          const [th, tm] = (task.startTime || '09:00').split(':').map(Number);
          const taskStartSecs = th * 3600 + tm * 60;
          const diffSeconds = taskStartSecs - nowSecsTotal;

          // Ignora tarefas antigas de demonstração que já passaram há mais de 10 minutos
          if (diffSeconds < -600) return;

          // Determina qual estágio da cadência (5m, 3m, 2m, 1m, 0m, +1m, +2m, +3m, +5m) deve disparar agora:
          let stageKey = null;
          let stageLabel = null;
          let shouldAlsoCall = false;

          if (diffSeconds <= 300 && diffSeconds > 180) {
            stageKey = 'minus_5';
            stageLabel = 'FALTAM 5 MINUTOS PARA O INÍCIO (1º Aviso)';
          } else if (diffSeconds <= 180 && diffSeconds > 120) {
            stageKey = 'minus_3';
            stageLabel = 'FALTAM 3 MINUTOS PARA O INÍCIO (2º Aviso)';
          } else if (diffSeconds <= 120 && diffSeconds > 60) {
            stageKey = 'minus_2';
            stageLabel = 'FALTAM 2 MINUTOS PARA O INÍCIO (3º Aviso)';
          } else if (diffSeconds <= 60 && diffSeconds > 0) {
            stageKey = 'minus_1';
            stageLabel = 'FALTA 1 MINUTO PARA O INÍCIO (4º Aviso)';
          } else if (diffSeconds <= 0 && diffSeconds > -60) {
            stageKey = 'start_0';
            stageLabel = 'INICIANDO AGORA (Horário Exato da Atividade)';
          } else if (diffSeconds <= -60 && diffSeconds > -120) {
            stageKey = 'after_1';
            stageLabel = 'APÓS O INÍCIO (+1 MINUTO SEM CONFIRMAÇÃO)';
          } else if (diffSeconds <= -120 && diffSeconds > -180) {
            stageKey = 'after_2';
            stageLabel = 'APÓS O INÍCIO (+2 MINUTOS SEM CONFIRMAÇÃO)';
          } else if (diffSeconds <= -180 && diffSeconds > -300) {
            stageKey = 'after_3';
            stageLabel = 'APÓS O INÍCIO (+3 MINUTOS - ALERTA CRÍTICO)';
            shouldAlsoCall = true;
          } else if (diffSeconds <= -300 && diffSeconds >= -600) {
            stageKey = 'after_5';
            stageLabel = 'APÓS O INÍCIO (+5 MINUTOS - COBRANÇA MÁXIMA)';
            shouldAlsoCall = true;
          }

          if (stageKey && !autoTriggeredStagesRef.current[`${task.id}_${stageKey}`]) {
            autoTriggeredStagesRef.current[`${task.id}_${stageKey}`] = true;
            handleTriggerTelegramAlert(task, stageLabel, 'whatsapp');
            showToast(`🟠⏰ [${stageLabel}] -> "${task.title}" enviado no WhatsApp e SMS!`, 'info');

            if (shouldAlsoCall) {
              if (escalationTimerRef.current) clearTimeout(escalationTimerRef.current);
              escalationTimerRef.current = setTimeout(() => {
                handleTriggerVoiceCall(task, 1);
              }, 6000);
            }
          }
        });
      }, [nowTime, state.tasks, handleTriggerTelegramAlert, showToast]);

      // Cria uma tarefa agendada para daqui a 5 minutos E permite testar toda a cadência (5m -> 3m -> 2m -> 1m -> Início -> Pós-Início)
      const handleScheduleAutoFiveMinDemo = useCallback(() => {
        clearAllRapidSequenceTimers();
        const now = new Date();
        const target = new Date(now.getTime() + 5 * 60 * 1000);
        const startHM = `${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}`;

          date: getTodayISO(),
          startTime: startHM,
          endTime: endHM,
          allDay: false,

          priority: 'urgent',
          status: 'pending',
          location: 'WhatsApp + SMS -> Voz',
          attachments: [],

          notifyTelegram: true,

        };

        // Marca o estágio de 5 min e dispara a sequência demonstrativa completa no WhatsApp (5m -> 3m -> 2m -> 1m -> Pós-Início)
        autoTriggeredStagesRef.current[`${demoId}_minus_5`] = true;

        setState(prev => ({
          ...prev,
          tasks: [newTask, ...prev.tasks],
        }));

        showToast(
          `🟠⏱️ Tarefa criada para ${startHM}! Iniciando disparos no seu WhatsApp: 5 min ➔ 3 min ➔ 2 min ➔ 1 min ➔ Pós-Início!`,
          'success'
        );

        const cadenceDemoStages = [
          { delayMs: 500,   label: 'FALTAM 5 MINUTOS PARA O INÍCIO (1º Aviso)' },
          { delayMs: 8000,  label: 'FALTAM 3 MINUTOS PARA O INÍCIO (2º Aviso)' },

          { delayMs: 32000, label: 'APÓS O INÍCIO (+1 MINUTO - ATIVIDADE JÁ INICIOU!)' },
        ];

        cadenceDemoStages.forEach((step, idx) => {
          const timerId = setTimeout(() => {
            handleTriggerTelegramAlert(newTask, step.label, 'whatsapp');
            if (idx === cadenceDemoStages.length - 1) {

                handleTriggerVoiceCall(newTask, 1);
              }, 7000);
            }
          }, step.delayMs);
          rapidSequenceTimersRef.current.push(timerId);
