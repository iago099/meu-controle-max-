  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // =========================================================================
    // 1. CONSTANTES DE IDENTIDADE VISUAL (LARANJA & BRANCO), CATEGORIAS E STATUS
    // =========================================================================
    const DEFAULT_CATEGORIES = [
      { id: 'work',     name: 'Trabalho',  emoji: '🟠', color: '#FF6B00', bg: 'rgba(255, 107, 0, 0.12)',  border: '#FF6B00' },

      { id: 'meetings', name: 'Reuniões',  emoji: '🔥', color: '#EA580C', bg: 'rgba(234, 88, 12, 0.12)',  border: '#EA580C' },
      { id: 'studies',  name: 'Estudos',   emoji: '📚', color: '#F97316', bg: 'rgba(249, 115, 22, 0.12)', border: '#F97316' },
      { id: 'urgent',   name: 'Urgente',   emoji: '🚨', color: '#DC2626', bg: 'rgba(220, 38, 38, 0.14)',  border: '#DC2626' },
      { id: 'others',   name: 'Outros',    emoji: '✨', color: '#FB923C', bg: 'rgba(251, 146, 60, 0.12)', border: '#FB923C' },
    ];

    const PRIORITIES = {
      urgent: { id: 'urgent', label: 'Urgente', emoji: '🔴', color: '#DC2626', badgeBg: 'bg-red-100 text-red-700 border-red-300' },
      high:   { id: 'high',   label: 'Alta',    emoji: '🟠', color: '#EA580C', badgeBg: 'bg-orange-100 text-orange-700 border-orange-300' },
      medium: { id: 'medium', label: 'Média',   emoji: '🟡', color: '#D97706', badgeBg: 'bg-amber-100 text-amber-800 border-amber-300' },
      low:    { id: 'low',    label: 'Baixa',   emoji: '⚪', color: '#FF8533', badgeBg: 'bg-orange-50 text-orange-600 border-orange-200' },
    };

    const STATUS_MAP = {
      pending:     { id: 'pending',     label: 'Pendente',     color: '#78716C', badge: 'bg-stone-100 text-stone-700 border-stone-300' },
      notified:    { id: 'notified',    label: 'Notificada',   color: '#FF6B00', badge: 'bg-orange-100 text-orange-700 border-orange-400' },
      confirmed:   { id: 'confirmed',   label: 'Confirmada',   color: '#EA580C', badge: 'bg-orange-500 text-white border-orange-600 badge-orange-white' },
      in_progress: { id: 'in_progress', label: 'Em andamento', color: '#F97316', badge: 'bg-amber-100 text-amber-800 border-amber-400' },
      completed:   { id: 'completed',   label: 'Concluída',    color: '#EA580C', badge: 'bg-orange-600 text-white border-orange-700 badge-orange-white' },
      overdue:     { id: 'overdue',     label: 'Atrasada',     color: '#DC2626', badge: 'bg-red-100 text-red-700 border-red-400' },
      cancelled:   { id: 'cancelled',   label: 'Cancelada',    color: '#A8A29E', badge: 'bg-stone-100 text-stone-500 border-stone-300' },
    };

    const RECURRENCE_OPTIONS = [
      { id: 'none',    label: 'Não se repete' },
      { id: 'daily',   label: 'Diariamente' },
      { id: 'weekly',  label: 'Semanalmente' },
      { id: 'monthly', label: 'Mensalmente' },
      { id: 'custom',  label: 'Personalizada' },
    ];

    // =========================================================================
    // 2. UTILITÁRIOS DE DATA E HORÁRIO
    // =========================================================================
    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysISO(baseISO, days) {
      const [y, m, d] = baseISO.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '';
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function addMinutesToTime(timeStr, minutesToAdd) {
      const [h, m] = (timeStr || '09:00').split(':').map(Number);
      const total = (h * 60 + m + minutesToAdd + 1440) % 1440;
      const nh = String(Math.floor(total / 60)).padStart(2, '0');
      const nm = String(total % 60).padStart(2, '0');
      return `${nh}:${nm}`;
    }

    // =========================================================================
    // 3. SINTETIZADOR DE ÁUDIO TELEFÔNICO, DTMF E VOZ EM PORTUGUÊS
    // =========================================================================
    class PhoneAudioEngine {
      constructor() {
        this.ctx = null;
        this.ringInterval = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playRingBurst() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc1.frequency.value = 440;
          osc2.frequency.value = 480;
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.85);
          osc2.stop(now + 0.85);
        } catch (e) {}
      }
      startRinging() {
        this.stopRinging();
        this.playRingBurst();
        this.ringInterval = setInterval(() => this.playRingBurst(), 1800);
      }
      stopRinging() {
        if (this.ringInterval) {
          clearInterval(this.ringInterval);
          this.ringInterval = null;
        }
      }
      playDTMF(digit) {
        try {
          this.init();
          if (!this.ctx) return;
          const dtmfFreqs = {
            '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            '*': [941, 1209], '0': [941, 1336], '#': [941, 1477],
          };
          const pair = dtmfFreqs[String(digit)] || [697, 1209];
          const now = this.ctx.currentTime;
          const o1 = this.ctx.createOscillator();
          const o2 = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o1.frequency.value = pair[0];
          o2.frequency.value = pair[1];
          g.gain.setValueAtTime(0.12, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          o1.connect(g);
          o2.connect(g);
          g.connect(this.ctx.destination);
          o1.start(now);
          o2.start(now);
          o1.stop(now + 0.22);
          o2.stop(now + 0.22);
        } catch (e) {}
      }
      speakPortuguese(text, onEndCallback) {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'pt-BR';
            utter.rate = 1.02;
            utter.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('pt-br')) ||
                            voices.find(v => v.lang && v.lang.toLowerCase().includes('pt'));
            if (ptVoice) utter.voice = ptVoice;
            if (onEndCallback) utter.onend = onEndCallback;
            window.speechSynthesis.speak(utter);
          } else if (onEndCallback) {
            setTimeout(onEndCallback, 3000);
          }
        } catch (e) {
          if (onEndCallback) onEndCallback();
        }
      }
      stopSpeech() {
        try {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } catch (e) {}
      }
      playNotificationChime() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [587.33, 880]; // D5 -> A5 (som moderno de WhatsApp/Telegram)
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.13);
            gain.gain.setValueAtTime(0.14, now + idx * 0.13);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.13);
            osc.stop(now + idx * 0.13 + 0.28);
          });
        } catch (e) {}
      }
    }

    const phoneAudio = new PhoneAudioEngine();

    // =========================================================================
    // 4. INTEGRAÇÃO REAL COM WHATSAPP, SMS, TELEGRAM BOT API + TWILIO VOICE API
    // =========================================================================
    function buildWhatsAppMessageText(task, stageLabel = 'FALTAM 5 MINUTOS PARA O INÍCIO') {
      const priorityInfo = PRIORITIES[task.priority] || PRIORITIES.high;
      const upper = String(stageLabel || '').toUpperCase();

      let header = '🟠 *MEU CONTROLE MAX – LEMBRETE DE COMPROMISSO!* ⏰';
      let intro = `Olá! 👋 Atenção para o status da sua atividade:\n_(${stageLabel})_`;

      if (upper.includes('APÓS O INÍCIO') || upper.includes('PÓS-INÍCIO') || upper.includes('ATRASAD')) {
        header = '🚨 *MEU CONTROLE MAX – ATIVIDADE JÁ INICIOU (COBRANÇA PÓS-INÍCIO)!* 🔥';
        intro = `⚠️ *ATENÇÃO!* Sua atividade *JÁ COMEÇOU* e ainda não foi confirmada!\n📢 *Estágio:* ${stageLabel}`;
      } else if (upper.includes('INICIANDO AGORA') || upper.includes('HORÁRIO EXATO')) {
        header = '🔔 *MEU CONTROLE MAX – SUA ATIVIDADE ESTÁ INICIANDO AGORA!* 🚀';
        intro = `Chegou a hora! Sua atividade está começando *NESTE EXATO MINUTO (${task.startTime})*!`;
      } else if (upper.includes('1 MIN')) {
        header = '🚨 *MEU CONTROLE MAX – FALTA APENAS 1 MINUTO!* ⏰';
        intro = `Último aviso antes do início! Falta *1 minuto* para começar sua atividade:`;
      } else if (upper.includes('2 MIN')) {
        header = '🟠 *MEU CONTROLE MAX – FALTAM 2 MINUTOS!* ⚠️';
        intro = `Prepare-se! Faltam *2 minutos* para iniciar sua atividade:`;
      } else if (upper.includes('3 MIN')) {
        header = '🟠 *MEU CONTROLE MAX – FALTAM 3 MINUTOS!* ⏰';
        intro = `Atenção! Faltam *3 minutos* para o início da sua atividade:`;
      } else if (upper.includes('5 MIN')) {
        header = '🟠 *MEU CONTROLE MAX – FALTAM 5 MINUTOS!* ⏰';
        intro = `Olá! 👋 Faltam *5 minutos* para iniciar sua atividade:`;
      }

      const existingNotes = Array.isArray(task.observations) && task.observations.length > 0
        ? `📝 *Observações Salvas:* ${task.observations.join(' | ')}\n`
        : '';

      return (
        `${header}\n\n` +
        `${intro}\n\n` +
        `📌 *Atividade:* ${task.title}\n` +
        `📅 *Data:* ${formatDateBR(task.date)}\n` +
        `⏰ *Início:* ${task.startTime}\n` +
        `⚡ *Prioridade:* ${priorityInfo.emoji} ${priorityInfo.label}\n` +
        (task.location ? `📍 *Local:* ${task.location}\n` : '') +
        existingNotes +
        `\n💬 *RESPONDA AQUI NO WHATSAPP:*\n` +
        `• *OK* (ou *1*) → Confirmar recebimento\n` +
        `• *CONCLUIDO* (ou *FEITO*) → Marcar atividade como CONCLUÍDA 🏆\n` +
        `• *OK + observação* ou *CONCLUIDO + observação* → Salvar anotação na agenda!\n` +
        `• *ADIAR 10* → Adiar 10 minutos`
      );
    }

    function buildWhatsAppDirectUrl(phone, task, stageLabel) {
      const cleanPhone = (phone || '+5589981026502').replace(/\D/g, '');
      const text = buildWhatsAppMessageText(task, stageLabel);
      return `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(text)}`;
    }

    // Resolve os possíveis chatIds do WhatsApp no Brasil (com e sem o 9º dígito após o DDD)
    function getBrazilWhatsAppChatIds(rawPhone) {
      let digits = (rawPhone || '+5589981026502').replace(/\D/g, '');
      if (digits.length === 10 || digits.length === 11) {
        digits = '55' + digits;
      }
      const chatIds = new Set();
      chatIds.add(`${digits}@c.us`);

      // No Brasil (DDD 31 a 99, como DDD 89 e 86), o WhatsApp registra contas antigas SEM o 9º dígito (12 dígitos no total: 55 + DDD + 8 dígitos)
      if (digits.startsWith('55') && digits.length === 13 && digits[4] === '9') {
        const withoutNinth = digits.slice(0, 4) + digits.slice(5);
        chatIds.add(`${withoutNinth}@c.us`);
      }
      // E se o usuário digitou sem o 9 (12 dígitos), adiciona também a versão com o 9 (13 dígitos)
      if (digits.startsWith('55') && digits.length === 12) {
        const withNinth = digits.slice(0, 4) + '9' + digits.slice(4);
        chatIds.add(`${withNinth}@c.us`);
      }
      return Array.from(chatIds);
    }

    // Identifica se um texto no histórico do WhatsApp foi gerado pelo próprio sistema (para não confundir com a resposta do usuário)
    function isAutomatedBotMessage(text) {
      if (!text) return true;
      const t = String(text).trim();
      if (!t) return true;
      if (
        t.includes('MEU CONTROLE MAX') ||
        t.includes('TASKFLOW') ||
        t.includes('RESPONDA AQUI NO WHATSAPP') ||
        t.includes('Ciclo ativo:') ||
        t.includes('Presença Confirmada às') ||
        t.includes('RESPOSTA IDENTIFICADA') ||
        t.includes('OBSERVAÇÃO SALVA') ||
        t.includes('ATIVIDADE CONCLUÍDA')
      ) {
        return true;
      }
      return false;
    }

    // Interpreta a resposta enviada pelo usuário no WhatsApp (Conclusão, Confirmação, Observação, Adiamento ou Cancelamento)
    function parseUserWhatsAppReply(rawText) {
      const cleaned = String(rawText || '').trim();
      if (!cleaned) return null;

      // 1. Adiamento (ex: "adiar", "adiar 15", "depois")
      const snoozeMatch = cleaned.match(/^(adiar|adia|depois|atrasar)\b(?:\s*(\d+))?(?:[\s,.:;-]*(.*))?$/i);
      if (snoozeMatch) {
        return {
          action: 'snooze',
          minutes: Number(snoozeMatch[2]) || 10,
          note: (snoozeMatch[3] || '').trim(),
          raw: cleaned,
        };
      }

      // 2. Cancelamento (ex: "cancelar", "desmarcar")
      const cancelMatch = cleaned.match(/^(cancelar|cancela|desmarcar|cancelado)\b(?:[\s,.:;-]*(.*))?$/i);
      if (cancelMatch) {
        return {
          action: 'cancel',
          note: (cancelMatch[2] || '').trim(),
          raw: cleaned,
        };
      }

      // 3. Conclusão da Atividade (ex: "concluido", "concluído", "concluida", "feito", "finalizado", "pronto", "terminei", "resolvido", "🏆")
      const pureCompleteMatch = cleaned.match(
        /^(conclu[ií]d[oa]s?|concluir|finalizad[oa]s?|finalizar|feit[oa]s?|pront[oa]s?|terminei|terminad[oa]s?|resolvid[oa]s?|encerrad[oa]s?|executad[oa]s?|🏆+|✔️+)[\s.!]*$/i
      );
      if (pureCompleteMatch) {
        return {
          action: 'complete',
          note: '',
          raw: cleaned,
        };
      }

      // 4. Conclusão + Observação (ex: "concluido, marmitas entregues", "feito - equipe alimentada", "finalizado tudo certo")
      const completeWithNoteMatch = cleaned.match(
        /^(conclu[ií]d[oa]s?|concluir|finalizad[oa]s?|finalizar|feit[oa]s?|pront[oa]s?|terminei|terminad[oa]s?|resolvid[oa]s?|encerrad[oa]s?|executad[oa]s?)\b[\s,.:;-]+(.+)$/i
      );
      if (completeWithNoteMatch) {
        return {
          action: 'complete',
          note: completeWithNoteMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 5. Frase contendo palavra de conclusão (ex: "já foi concluido", "atividade concluída", "tudo concluido")
      if (/\b(conclu[ií]d[oa]s?|finalizad[oa]s?|já conclu[ií]|ja conclui|atividade conclu[ií]da|tarefa conclu[ií]da)\b/i.test(cleaned)) {
        const extraNote = cleaned
          .replace(/^(já|ja|tudo|atividade|tarefa|servi[cç]o|foi|está|esta|\s)+/i, '')
          .replace(/^(conclu[ií]d[oa]s?|finalizad[oa]s?)[\s,.:;-]*/i, '')
          .trim();
        return {
          action: 'complete',
          note: extraNote,
          raw: cleaned,
        };
      }

      // 6. Confirmação pura de recebimento (ex: "OK", "Sim", "Confirmado", "1", "Ciente", "Certo", "👍", "✅")
      const pureConfirmMatch = cleaned.match(
        /^(ok+|okay|sim|s|confirmo|confirmado|confirmar|ciente|certo|beleza|blz|recebido|positivo|1|👍+|✅+|👌+|🤝+)[\s.!]*$/i
      );
      if (pureConfirmMatch) {
        return {
          action: 'confirm',
          note: '',
          raw: cleaned,
        };
      }

      // 7. Confirmação seguida de observação (ex: "OK, verificar marmitas do turno B", "Confirmado - pedir água", "1 tudo certo")
      const confirmWithNoteMatch = cleaned.match(
        /^(ok+|okay|sim|confirmo|confirmado|confirmar|ciente|certo|beleza|blz|recebido|1)\b[\s,.:;-]+(.+)$/i
      );
      if (confirmWithNoteMatch) {
        return {
          action: 'confirm_and_note',
          note: confirmWithNoteMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 8. Prefixo explícito de observação (ex: "Obs: comprar frutas", "Nota: ligar para fornecedor")
      const obsMatch = cleaned.match(/^(obs|observa[cç][aã]o|nota|lembrete|adicionar|add)\b[\s,.:;-]*(.+)$/i);
      if (obsMatch) {
        return {
          action: 'confirm_and_note',
          note: obsMatch[2].trim(),
          raw: cleaned,
        };
      }

      // 9. Qualquer outra mensagem enviada pelo usuário após o alerta: confirma o recebimento e salva o texto como observação da tarefa!
      return {
        action: 'confirm_and_note',
        note: cleaned,
        raw: cleaned,
      };
    }

    // Busca respostas reais do usuário no WhatsApp via Green-API (getChatHistory + receiveNotification)
    async function pollGreenApiUserReplies({ settings, sinceTimestampSec, processedIdsSet }) {
      const idInst = (settings?.greenApiIdInstance || '710722790234').trim();
      const tokInst = (settings?.greenApiToken || 'bc3f8075a090411296a983a516a499d80a6ec55c88f648c2bf').trim();
      if (!idInst || !tokInst) return [];

      const prefix = idInst.slice(0, 4);
      const baseHost = (settings?.greenApiUrl || `https://${prefix}.api.greenapi.com`).trim().replace(/\/$/, '');
      const targetPhone = settings?.whatsappNumber || settings?.phone || '+5589981026502';
      const chatIds = getBrazilWhatsAppChatIds(targetPhone);
      const detectedReplies = [];

      // 1. Consulta o histórico recente da conversa (getChatHistory) nos JIDs do usuário
      for (const chatId of chatIds) {
        try {
          const res = await fetch(`${baseHost}/waInstance${idInst}/getChatHistory/${tokInst}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chatId, count: 6 }),
          });
          if (res.ok) {
            const history = await res.json();
            if (Array.isArray(history)) {
              for (const msg of history) {
                if (!msg || !msg.idMessage) continue;
                if (processedIdsSet.has(msg.idMessage)) continue;
                if (msg.timestamp && msg.timestamp < sinceTimestampSec) continue;

                const text =
                  msg.textMessage ||
                  msg.extendedTextMessage?.text ||
                  msg.extendedTextMessageData?.text ||
                  '';

                if (!text || isAutomatedBotMessage(text)) {
                  processedIdsSet.add(msg.idMessage);
                  continue;
                }

                // Achou uma resposta real do usuário no WhatsApp!
                processedIdsSet.add(msg.idMessage);
                detectedReplies.push({
                  idMessage: msg.idMessage,
                  text: String(text).trim(),
                  timestamp: msg.timestamp || Math.floor(Date.now() / 1000),
                  chatId,
                });
              }
            }
          }
        } catch (e) {}
      }

      // 2. Também consome a fila de notificações (receiveNotification) caso haja eventos pendentes
      try {
        const notifRes = await fetch(`${baseHost}/waInstance${idInst}/receiveNotification/${tokInst}`);
        if (notifRes.ok) {
          const notif = await notifRes.json();
          if (notif && notif.receiptId) {
            const body = notif.body || {};
            const idMsg = body.idMessage;
            const msgData = body.messageData || {};
            const text =
              msgData.textMessageData?.textMessage ||
              msgData.extendedTextMessageData?.text ||
              '';

            if (idMsg && !processedIdsSet.has(idMsg) && text && !isAutomatedBotMessage(text)) {
              processedIdsSet.add(idMsg);
              detectedReplies.push({
                idMessage: idMsg,
                text: String(text).trim(),
                timestamp: body.timestamp || Math.floor(Date.now() / 1000),
                chatId: body.senderData?.chatId || chatIds[0],
              });
            }

            await fetch(
              `${baseHost}/waInstance${idInst}/deleteNotification/${tokInst}/${notif.receiptId}`,
              { method: 'DELETE' }
            ).catch(() => {});
          }
        }
      } catch (e) {}

      return detectedReplies;
    }

    async function detectTelegramChatId(botToken) {

      const data = await res.json();
      if (!data.ok) throw new Error(data.description || 'Token do Bot inválido');

        const msg = updates[i].message || updates[i].callback_query?.message;

          return {
            chatId: String(msg.chat.id),
            username: msg.chat.username || msg.chat.first_name || 'Usuário Telegram',

    // =========================================================================
    // 5. INTERPRETADOR DE LINGUAGEM NATURAL ("🤖 MEU ASSISTENTE")
    // =========================================================================
    function parseNaturalLanguageTask(rawInput) {
      const text = (rawInput || '').trim();
      if (!text) return null;

      const lower = text.toLowerCase();
      const todayISO = getTodayISO();
      let targetDate = todayISO;
      let recurrence = 'none';
      let dateExplanation = 'Hoje';

      // Detecção de recorrência e dias da semana
      const weekdaysMap = [
        { keys: ['domingo', 'domingos'], day: 0, label: 'Domingo' },
        { keys: ['segunda-feira', 'segundas-feiras', 'segunda', 'segundas'], day: 1, label: 'Segunda-feira' },
        { keys: ['terça-feira', 'terças-feiras', 'terca-feira', 'terça', 'terca', 'terças'], day: 2, label: 'Terça-feira' },
        { keys: ['quarta-feira', 'quartas-feiras', 'quarta', 'quartas'], day: 3, label: 'Quarta-feira' },
        { keys: ['quinta-feira', 'quintas-feiras', 'quinta', 'quintas'], day: 4, label: 'Quinta-feira' },
        { keys: ['sexta-feira', 'sextas-feiras', 'sexta', 'sextas'], day: 5, label: 'Sexta-feira' },
        { keys: ['sábado', 'sabado', 'sábados', 'sabados'], day: 6, label: 'Sábado' },
      ];

      if (lower.includes('todos os dias') || lower.includes('todo dia') || lower.includes('diariamente')) {
        recurrence = 'daily';
        dateExplanation = 'Recorrência Diária';
      } else if (lower.includes('toda semana') || lower.includes('todas as ') || lower.includes('toda ') || lower.includes('semanalmente')) {
        recurrence = 'weekly';
      } else if (lower.includes('todo mês') || lower.includes('mensalmente')) {
        recurrence = 'monthly';
      }

      if (lower.includes('depois de amanhã') || lower.includes('depois de amanha')) {
        targetDate = addDaysISO(todayISO, 2);
        dateExplanation = 'Depois de amanhã';
      } else if (lower.includes('amanhã') || lower.includes('amanha')) {
        targetDate = addDaysISO(todayISO, 1);
        dateExplanation = 'Amanhã';
      } else {
        for (const wd of weekdaysMap) {
          if (wd.keys.some(k => lower.includes(k))) {
            const now = new Date();
            const currentDay = now.getDay();
            let diff = (wd.day - currentDay + 7) % 7;
            if (diff === 0) diff = 7;
            targetDate = addDaysISO(todayISO, diff);
            dateExplanation = recurrence === 'weekly' ? `Toda ${wd.label}` : `Próxima ${wd.label}`;
            break;
          }
        }
      }

      // Detecção de horário (ex: "às 8h", "às 14:30", "16h", "07:00")
      let startTime = '09:00';
      const timeRegex = /(?:às|as|a|para as|de)?\s*(\d{1,2})\s*(?:h|:|horas?)?\s*(\d{2})?(?:\s*h|\s*horas?)?/i;
      const explicitTimeMatch = text.match(/(?:às|as)\s*(\d{1,2})(?:[:h](\d{2}))?\s*(?:h|horas)?/i) ||
                                text.match(/\b(\d{1,2})[:h](\d{2})?\b/i);

      if (explicitTimeMatch) {
        let hour = parseInt(explicitTimeMatch[1], 10);
        let minute = explicitTimeMatch[2] ? parseInt(explicitTimeMatch[2], 10) : 0;
        if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
          if (lower.includes('da tarde') && hour < 12) hour += 12;
          if (lower.includes('da noite') && hour < 12) hour += 12;
          startTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        }
      }

      const endTime = addMinutesToTime(startTime, 60);

      // Detecção de categoria e prioridade
      let category = 'work';
      let priority = 'high';

      if (lower.includes('reunião') || lower.includes('reuniao') || lower.includes('call') || lower.includes('alinhamento') || lower.includes('comitê')) {
        category = 'meetings';
        priority = 'high';
      } else if (lower.includes('estud') || lower.includes('curso') || lower.includes('aula') || lower.includes('prova') || lower.includes('leitura')) {
        category = 'studies';
        priority = 'medium';
      } else if (lower.includes('médico') || lower.includes('medico') || lower.includes('academia') || lower.includes('família') || lower.includes('pessoal') || lower.includes('comprar')) {
        category = 'personal';
        priority = 'medium';
      } else if (lower.includes('urgente') || lower.includes('segurança') || lower.includes('emergência') || lower.includes('crítico') || lower.includes('prazo')) {
        category = 'urgent';
        priority = 'urgent';
      }

      if (lower.includes('urgente') || lower.includes('importantíssimo') || lower.includes('prioridade máxima')) {
        priority = 'urgent';
      } else if (lower.includes('baixa prioridade') || lower.includes('quando puder')) {
        priority = 'low';
      }

      // Limpeza do título da tarefa
      let cleanTitle = text
        .replace(/^(me\s+lembre|lembrar(?:-me)?|agende|crie\s+uma\s+tarefa|adicione\s+na\s+agenda)\s*/i, '')
        .replace(/\b(hoje|amanhã|amanha|depois de amanhã|todas as\s+[\w-]+|toda\s+[\w-]+|na\s+[\w-]+|no\s+domingo|no\s+sábado)\b/gi, '')
        .replace(/(?:às|as)\s*\d{1,2}(?:[:h]\d{2})?\s*(?:h|horas?)?/gi, '')
        .replace(/^\s*(de|para|que|em|,|-)\s+/i, '')
        .replace(/\s{2,}/g, ' ')
        .trim();

      if (!cleanTitle || cleanTitle.length < 3) {
        cleanTitle = text;
      } else {
        cleanTitle = cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1);
        cleanTitle = cleanTitle.replace(/\.$/, '');
      }

      return {
        title: cleanTitle,
        description: `Criado via Assistente Inteligente a partir do comando: "${text}"`,
        date: targetDate,
        dateExplanation,
        startTime,
        endTime,
        category,
        priority,
        recurrence,
        notifyTelegram: true,
        notifyVoiceCall: true,
        requireConfirmation: true,
        leadTimeMinutes: 30,
      };
    }

    // =========================================================================
    // 8. MODAL DE LIGAÇÃO AUTOMÁTICA INTELIGENTE + RECONHECIMENTO DTMF (TECLA 1)
    // =========================================================================
    function AutomaticPhoneCallModal({ callSession, onConfirmDTMF, onSnoozeDTMF, onHangupUnanswered }) {
      const [callState, setCallState] = useState('ringing'); // 'ringing' | 'connected' | 'confirmed'
      const [secondsElapsed, setSecondsElapsed] = useState(0);
      const [pressedDigits, setPressedDigits] = useState('');
      const [voiceSpeaking, setVoiceSpeaking] = useState(false);

      useEffect(() => {
        if (!callSession) return;
        setCallState('ringing');
        setSecondsElapsed(0);
        setPressedDigits('');
        phoneAudio.startRinging();
        return () => {
          phoneAudio.stopRinging();
          phoneAudio.stopSpeech();
        };
      }, [callSession]);

      useEffect(() => {
        if (callState !== 'connected') return;
        const timer = setInterval(() => setSecondsElapsed(s => s + 1), 1000);
        return () => clearInterval(timer);
      }, [callState]);

      if (!callSession) return null;
      const { task, attempt, maxAttempts, spokenScript, toNumber, twilioCallSid } = callSession;

      const handleAnswerCall = () => {
        phoneAudio.stopRinging();
        setCallState('connected');
        setVoiceSpeaking(true);
        phoneAudio.speakPortuguese(spokenScript, () => {
          setVoiceSpeaking(false);
        });
      };

      const handlePressDigit = (digit) => {
        phoneAudio.playDTMF(digit);
        setPressedDigits(prev => prev + digit);

        if (String(digit) === '1') {
          phoneAudio.stopSpeech();
          setCallState('confirmed');
          phoneAudio.speakPortuguese(
            'Recebimento confirmado com sucesso! Todos os alertas adicionais foram encerrados. Bom trabalho!',
            () => {
              setTimeout(() => {
                onConfirmDTMF(task.id, secondsElapsed + 4);
              }, 600);
            }
          );
        } else if (String(digit) === '2') {
          phoneAudio.stopSpeech();
          phoneAudio.speakPortuguese('Compromisso adiado em 10 minutos. Até logo!', () => {
            onSnoozeDTMF(task.id, 10);
          });
        }
      };

      const formatCallTime = (secs) => {
        const m = String(Math.floor(secs / 60)).padStart(2, '0');
        const s = String(secs % 60).padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
          <div className="relative w-full max-w-sm rounded-[36px] border-2 border-[#FF9F43]/60 bg-gradient-to-b from-[#19231D] via-[#101713] to-[#0B100D] p-6 text-white shadow-[0_0_70px_rgba(255,159,67,0.28)]">
            {/* Topo estilo smartphone em chamada */}
            <div className="mx-auto mb-4 h-1.5 w-20 rounded-full bg-white/15" />

            <div className="text-center space-y-2">
              <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FF9F43]/20 border border-[#FF9F43]/40 text-[#FFD09B] text-xs font-bold">
                <span>🔥 ESCALONAMENTO NÍVEL 3 • TENTATIVA {attempt}/{maxAttempts}</span>
              </div>

              <div className="relative mx-auto my-4 flex h-24 w-24 items-center justify-center">
                {callState === 'ringing' && (
                  <>
                    <div className="absolute inset-0 rounded-full bg-[#FF9F43]/30 animate-pulse-ring" />
                    <div className="absolute inset-2 rounded-full bg-[#FF6B00]/25 animate-pulse-ring" style={{ animationDelay: '0.5s' }} />
                  </>
                )}
                <div className="relative z-10 flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-[#FF6B00] to-[#FF9F43] text-3xl shadow-xl">
                  📞
                </div>
              </div>

              <h3 className="text-xl font-extrabold tracking-tight text-[#F4F8F3]">
                Assistente Meu Controle Max
              </h3>
              <p className="text-xs font-mono text-[#AAB8AA]">
                {toNumber || '+55 (11) 99876-5432'} {twilioCallSid ? `• SID: ${twilioCallSid.slice(0, 10)}...` : ''}
              </p>

              <div className="py-1">
                {callState === 'ringing' && (
                  <span className="inline-block text-sm font-bold text-[#FF9F43] animate-pulse">
                    📲 Chamando... (Telegram sem resposta)
                  </span>
                )}
                {callState === 'connected' && (
                  <span className="inline-block text-sm font-mono font-bold text-[#FF6B00]">
                    🟠 Em chamada • {formatCallTime(secondsElapsed)}
                  </span>
                )}
                {callState === 'confirmed' && (
                  <span className="inline-block text-sm font-bold text-[#FF6B00]">
                    ✅ Confirmado via Tecla 1 (DTMF)! Encerrando...
                  </span>
                )}
              </div>
            </div>

            {/* Card da Tarefa e Transcrição de Voz em Tempo Real */}
            <div className="my-4 rounded-2xl bg-black/40 border border-white/10 p-3.5 text-left space-y-2">
              <div className="flex items-center justify-between text-xs">
                <span className="font-bold text-[#FFD09B]">📌 {task.title}</span>
                <span className="font-mono text-[#FF6B00]">{task.startTime}</span>
              </div>
              <p className="text-xs text-[#AAB8AA] italic leading-relaxed">
                "{spokenScript}"
              </p>
              {voiceSpeaking && (
                <div className="flex items-center gap-2 text-[11px] text-[#FF6B00] font-semibold pt-1">
                  <span className="inline-block w-2 h-2 rounded-full bg-[#FF6B00] animate-ping" />
                  Reproduzindo mensagem de voz sintetizada (pt-BR)...
                </div>
              )}
            </div>

            {/* Botões de Atender / Teclado DTMF */}
            {callState === 'ringing' ? (
              <div className="grid grid-cols-2 gap-3 pt-2">
                <button
                  onClick={() => onHangupUnanswered(task)}
                  className="py-3.5 px-4 rounded-2xl bg-red-600/90 hover:bg-red-600 text-white font-bold text-sm transition shadow-lg flex items-center justify-center gap-2"
                >
                  📵 Recusar / Ignorar
                </button>
                <button
                  onClick={handleAnswerCall}
                  className="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-[#FF8533] to-[#FF6B00] text-[#101713] font-extrabold text-sm transition shadow-lg flex items-center justify-center gap-2 hover:brightness-105"
                >
                  📞 Atender Agora
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                <div className="flex items-center justify-between px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs">
                  <span className="text-[#AAB8AA]">Teclado DTMF:</span>
                  <span className="font-mono font-bold text-[#FF6B00] tracking-widest">
                    {pressedDigits || 'Pressione 1 para confirmar'}
                  </span>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  {['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'].map((digit) => {
                    const isPrimary = digit === '1';
                    const isSnooze = digit === '2';
                    return (
                      <button
                        key={digit}
                        onClick={() => handlePressDigit(digit)}
                        className={`py-2.5 rounded-xl font-bold transition flex flex-col items-center justify-center border ${
                          isPrimary
                            ? 'bg-[#FF6B00] text-[#101713] border-[#FF6B00] shadow-[0_0_20px_rgba(184,242,139,0.5)] scale-[1.03]'
                            : isSnooze
                            ? 'bg-[#FF9F43]/25 text-[#FFD09B] border-[#FF9F43]/50 hover:bg-[#FF9F43]/40'
                            : 'bg-white/5 hover:bg-white/15 text-white border-white/10'
                        }`}
                      >
                        <span className="text-base leading-none">{digit}</span>
                        <span className="text-[9px] uppercase tracking-tighter opacity-85 mt-0.5">
                          {digit === '1' ? 'CONFIRMAR ✅' : digit === '2' ? 'ADIAR 10M' : '\u00A0'}
                        </span>
                      </button>
                    );
                  })}
                </div>

                <div className="flex items-center justify-between gap-2 pt-1">
                  <button
                    onClick={() => phoneAudio.speakPortuguese(spokenScript)}
                    className="flex-1 py-2 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold text-[#F4F8F3] transition"
                  >
                    🔊 Ouvir Voz Novamente
                  </button>
                  <button
                    onClick={() => onHangupUnanswered(task)}
                    className="py-2 px-4 rounded-xl bg-red-600/80 hover:bg-red-600 text-xs font-bold text-white transition"
                  >
                    Desligar
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 10. SEÇÃO 2: 🏠 DASHBOARD PRINCIPAL

    function DashboardView({
      tasks,
      categories,
      nowTime,
      settings,
      setSettings,
      focusModeOnly,
      setFocusModeOnly,
      onOpenNewTask,
      onEditTask,
      onToggleComplete,
      onSmartReschedule,
      onTriggerTelegramAlert,
      onTriggerVoiceCall,
      onRunLiveFlowSimulation,
      onScheduleAutoFiveMinDemo,
      onSelectDateInCalendar,
    }) {
      const todayISO = getTodayISO();
      const todayTasks = useMemo(
        () =>
          tasks
            .filter(t => t.date === todayISO)
            .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || '')),
        [tasks, todayISO]
      );

      const totalToday = todayTasks.length;
      const completedToday = todayTasks.filter(t => t.status === 'completed' || t.status === 'confirmed').length;
      const pendingToday = todayTasks.filter(t => ['pending', 'notified', 'in_progress'].includes(t.status)).length;
      const overdueToday = todayTasks.filter(t => t.status === 'overdue').length;
      const productivityPct = totalToday > 0 ? Math.round((completedToday / totalToday) * 100) : 100;

      // Próximo compromisso
      const currentHM = `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}`;
      const nextAppointment = useMemo(() => {
        const upcomingToday = todayTasks.find(
          t => t.status !== 'completed' && t.status !== 'cancelled' && t.startTime >= currentHM
        );
        if (upcomingToday) return upcomingToday;
        return todayTasks.find(t => t.status !== 'completed' && t.status !== 'cancelled') || tasks[0];
      }, [todayTasks, tasks, currentHM]);

      // Tarefas do FOCO DE HOJE
      const focusTasks = useMemo(() => {
        if (focusModeOnly) {
          return todayTasks.filter(t => t.priority === 'urgent' || t.priority === 'high' || t.isFavorite);
        }
        return todayTasks;
      }, [todayTasks, focusModeOnly]);

      const hour = nowTime.getHours();
      const greetingPrefix =
        hour < 12 ? 'Bom dia! ☀️' : hour < 18 ? 'Boa tarde! 🌤️' : 'Boa noite! 🌙';

      const formattedClock = nowTime.toLocaleTimeString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
      const formattedLongDate = nowTime.toLocaleDateString('pt-BR', {
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric',
      });

      const getCategoryObj = (catId) =>
        categories.find(c => c.id === catId) || DEFAULT_CATEGORIES[0];

      return (
        <div className="space-y-6">

                  <span>WHATSAPP CONECTADO (+55 89 98102-6502) • ALERTAS EM 5M, 3M, 2M, 1M E PÓS-INÍCIO</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-tf-text">
                  {greetingPrefix} Vamos organizar seu dia?
                </h1>
                <p className="text-xs sm:text-sm text-tf-muted capitalize">
                  📅 {formattedLongDate} • ⏰ <span className="font-mono font-extrabold text-[#EA580C]">{formattedClock}</span>
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <button
                  onClick={() => onOpenNewTask()}
                  className="px-5 py-3 rounded-2xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white font-extrabold text-xs sm:text-sm shadow-md hover:brightness-105 transition flex items-center gap-2"
                >
                  <span>➕</span>
                  <span>Novo Compromisso</span>
                </button>
              </div>
            </div>
          </div>

          {/* 6 Cards Animados de Indicadores de Desempenho */}
          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3.5">
            <div className="rounded-2xl border border-tf-border bg-tf-card p-4 hover:border-[#FF6B00]/50 transition group">
              <div className="flex items-center justify-between text-xs text-tf-muted">
                <span>Total Hoje</span>
                <span className="text-base group-hover:scale-110 transition">📋</span>
              </div>
              <div className="mt-2 text-2xl font-extrabold text-tf-text">{totalToday}</div>
              <div className="mt-1 text-[11px] text-tf-muted">Compromissos do dia</div>
            </div>

            <div className="rounded-2xl border border-tf-border bg-tf-card p-4 hover:border-[#FF8533]/50 transition group">
              <div className="flex items-center justify-between text-xs text-tf-muted">
                <span>Concluídas / Confirm.</span>
                <span className="text-base group-hover:scale-110 transition">✅</span>
              </div>

    // =========================================================================
    // 11. SEÇÃO 3: 📅 CALENDÁRIO INTELIGENTE (DIA, SEMANA, MÊS, LISTA + DRAG & DROP)

    function SmartCalendarView({
      tasks,
      categories,
      selectedDate,
      setSelectedDate,
      onCreateAtSlot,
      onEditTask,
      onMoveTaskSlot,
      onTriggerTelegramAlert,
      onTriggerVoiceCall,
    }) {
      const [viewMode, setViewMode] = useState('week'); // 'day' | 'week' | 'month' | 'list'
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const currentHourStr = `${String(new Date().getHours()).padStart(2, '0')}:00`;

      const getCategoryObj = (catId) =>
        categories.find(c => c.id === catId) || DEFAULT_CATEGORIES[0];

      const getHourEmoji = (hourStr) => {
        const h = parseInt(hourStr.slice(0, 2), 10);
        if (h <= 7) return '🌅';
        if (h === 8) return '☕';
        if (h >= 9 && h <= 11) return '☀️';
        if (h >= 12 && h <= 13) return '🍽️';
        if (h >= 14 && h <= 17) return '⚡';
        if (h >= 18 && h <= 19) return '🌇';
        return '🌙';
      };

      const filteredTasks = useMemo(() => {
        if (categoryFilter === 'all') return tasks;
        return tasks.filter(t => t.category === categoryFilter);
      }, [tasks, categoryFilter]);

      // Navegação de datas
      const handleNavigate = (dir) => {
        const delta = viewMode === 'day' ? dir : viewMode === 'week' ? dir * 7 : dir * 30;
        setSelectedDate(addDaysISO(selectedDate, delta));
      };

      // Dias da semana atual a partir de selectedDate
      const weekDays = useMemo(() => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const current = new Date(y, m - 1, d);
        const dayOfWeek = current.getDay(); // 0 = Dom
        const sunday = new Date(y, m - 1, d - dayOfWeek);
        const arr = [];
        const names = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const emojis = ['☀️', '🚀', '⚡', '🔥', '🎯', '✨', '🎉'];
        for (let i = 0; i < 7; i++) {
          const dt = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
          const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
          arr.push({
            iso,
            dayName: names[i],
            dayEmoji: emojis[i],
            dayNumber: dt.getDate(),
          });
        }
        return arr;
      }, [selectedDate]);

      // Grade do Mês (42 células)
      const monthCells = useMemo(() => {
        const [y, m] = selectedDate.split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const startOffset = firstDay.getDay();
        const startDate = new Date(y, m - 1, 1 - startOffset);
        const cells = [];
        for (let i = 0; i < 42; i++) {
          const dt = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
          const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
          cells.push({
            iso,
            dayNumber: dt.getDate(),
            isCurrentMonth: dt.getMonth() === m - 1,
          });
        }
        return cells;
      }, [selectedDate]);

      const hoursList = useMemo(() => {
        const hrs = [];
        for (let h = 6; h <= 22; h++) {
          hrs.push(`${String(h).padStart(2, '0')}:00`);
        }
        return hrs;
      }, []);

      const handleDropOnSlot = (targetDate, targetHour) => {
        if (!draggedTaskId) return;
        onMoveTaskSlot(draggedTaskId, targetDate, targetHour);
        setDraggedTaskId(null);
      };

      const [selY, selM] = selectedDate.split('-').map(Number);
      const monthTitle = new Date(selY, selM - 1, 1).toLocaleDateString('pt-BR', {
        month: 'long',
        year: 'numeric',
      });

      return (
        <div className="space-y-5 animate-pop-in">
          {/* Barra de Controle Superior do Calendário com Emojis e Animações */}
          <div className="rounded-3xl border-2 border-[#FED7AA] bg-white p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4 shadow-sm">
            <div className="flex flex-wrap items-center gap-3.5">
              <div className="flex items-center gap-1 bg-[#FFF7ED] p-1.5 rounded-2xl border border-[#FDBA74]">
                <button
                  onClick={() => handleNavigate(-1)}
                  className="px-3 py-1.5 rounded-xl hover:bg-orange-100 text-xs font-extrabold text-[#EA580C] transition hover:scale-110"
                  title="Período anterior"
                >
                  ⬅️
                </button>
                <button
                  onClick={() => setSelectedDate(getTodayISO())}
                  className="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white text-xs font-extrabold shadow-sm transition hover:scale-105"
                >
                  🌟 Hoje
                </button>
                <button
                  onClick={() => handleNavigate(1)}
                  className="px-3 py-1.5 rounded-xl hover:bg-orange-100 text-xs font-extrabold text-[#EA580C] transition hover:scale-110"
                  title="Próximo período"
                >
                  ➡️
                </button>
              </div>

              <div className="group">
                <div className="flex items-center gap-2">
                  <span className="text-2xl animate-float">🗓️</span>
                  <h2 className="text-lg sm:text-xl font-extrabold capitalize text-tf-text">
                    {monthTitle} <span className="emoji-wiggle">✨</span>
                  </h2>
                </div>
                <p className="text-xs text-tf-muted">
                  👆 Clique em qualquer horário para agendar ou 🖐️ arraste tarefas para reagendar (Alertas 📲 5m, 3m, 2m, 1m e Pós-Início)
                </p>
              </div>
            </div>

            {/* Seletor de Visualização: Dia, Semana, Mês, Lista com Emojis */}
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="inline-flex rounded-2xl bg-[#FFF7ED] p-1 border border-[#FDBA74]">
                {[
                  { id: 'day',   label: '🌞 Dia' },
                  { id: 'week',  label: '🗓️ Semana' },
                  { id: 'month', label: '📅 Mês' },
                  { id: 'list',  label: '📋 Lista' },
                ].map(v => (
                  <button
                    key={v.id}
                    onClick={() => setViewMode(v.id)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition-all duration-200 ${
                      viewMode === v.id
                        ? 'bg-gradient-to-r from-[#FF6B00] to-[#FF8533] text-white shadow scale-105'
                        : 'text-tf-muted hover:text-[#EA580C]'
                    }`}
                  >
                    {v.label}
                  </button>
                ))}
              </div>

              <button
                onClick={() => onCreateAtSlot(selectedDate, '09:00')}

              >
                <span className="emoji-wiggle">➕</span>
                <span>Novo Compromisso ✨</span>
              </button>
            </div>
          </div>

          {/* Filtro por Categorias Coloridas com Emojis */}
          <div className="flex flex-wrap items-center gap-2">
            <button
              onClick={() => setCategoryFilter('all')}
              className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition-all duration-200 ${
                categoryFilter === 'all'
                  ? 'bg-[#FF6B00] text-white border-[#FF6B00] shadow-sm scale-105'
                  : 'bg-white text-tf-muted border-tf-border hover:border-[#FF6B00]'
              }`}
            >
              🌈 Todas ({tasks.length})
            </button>
            {categories.map(cat => (
              <button
                key={cat.id}
                onClick={() => setCategoryFilter(cat.id)}
                className={`group px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition-all duration-200 ${
                  categoryFilter === cat.id
                    ? 'scale-105 shadow-md'
                    : 'opacity-85 hover:opacity-100 hover:scale-105'
                }`}
                style={{
                  backgroundColor: categoryFilter === cat.id ? cat.color : cat.bg,

                <span className="emoji-wiggle mr-1">{cat.emoji}</span>
                <span>{cat.name}</span>
              </button>
            ))}
          </div>

          {/* 1. VISUALIZAÇÃO SEMANA OU DIA (GRADE DE HORÁRIOS ANIMADA COM EMOJIS) */}
          {(viewMode === 'week' || viewMode === 'day') && (
            <div className="rounded-3xl border-2 border-[#FED7AA] bg-white overflow-hidden shadow-xl animate-pop-in">
              <div className="overflow-x-auto">
                <div className={viewMode === 'week' ? 'min-w-[840px]' : 'min-w-full'}>
                  {/* Cabeçalho dos dias com Emojis e Indicador HOJE */}
                  <div
                    className="grid border-b-2 border-[#FED7AA] bg-gradient-to-r from-[#FFF7ED] via-[#FFFFFF] to-[#FFF7ED]"
                    style={{
                      gridTemplateColumns: viewMode === 'week' ? '86px repeat(7, 1fr)' : '86px 1fr',
                    }}
                  >
                    <div className="p-3 flex flex-col items-center justify-center text-[11px] font-mono font-bold text-[#EA580C] border-r border-tf-border">
                      <span className="text-base animate-float">⏰</span>
                      <span>GMT-3</span>
                    </div>
                    {(viewMode === 'week'
                      ? weekDays
                      : [
                          {

                            dayName: new Date(selectedDate + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long' }),
                            dayEmoji: '🌟',
                            dayNumber: selectedDate.split('-')[2],
                          },

                    ).map(col => {
                      const isToday = col.iso === getTodayISO();
                      const isSelected = col.iso === selectedDate;
                      const dayCount = filteredTasks.filter(t => t.date === col.iso).length;
                      return (
                        <div
                          key={col.iso}
                          onClick={() => setSelectedDate(col.iso)}
                          className={`group p-3 text-center cursor-pointer border-r border-tf-border transition-all duration-200 ${
                            isToday
                              ? 'bg-gradient-to-b from-[#FFF0E0] to-white'
                              : isSelected
                              ? 'bg-orange-50/60'
                              : 'hover:bg-orange-50/40'
                          }`}
                        >
                          <div className="flex items-center justify-center gap-1 text-[11px] uppercase font-extrabold text-tf-muted">
                            <span className="emoji-wiggle text-sm">{col.dayEmoji || '📅'}</span>
                            <span>{col.dayName}</span>
                          </div>
                          <div
                            className={`mx-auto mt-1.5 w-9 h-9 rounded-2xl flex items-center justify-center text-sm font-extrabold transition-transform duration-200 group-hover:scale-110 ${
                              isToday
                                ? 'bg-gradient-to-br from-[#FF6B00] to-[#FF8C1A] text-white shadow-md badge-orange-white'
                                : 'text-tf-text bg-orange-50/70'

                          >
                            {col.dayNumber}
                          </div>
                          {isToday && (
                            <div className="mt-1 text-[9px] font-extrabold text-[#EA580C] tracking-wider uppercase animate-pulse">

                            </div>
                          )}
                          {dayCount > 0 && (
                            <div className="mt-1 inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#FF6B00] text-white text-[10px] font-extrabold badge-orange-white">
                              <span>📌</span>
                              <span>{dayCount}</span>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Linhas de Horário (06:00 às 22:00) com Emojis de Período e Animação de Slot */}
                  <div className="max-h-[620px] overflow-y-auto divide-y divide-tf-border/60">
                    {hoursList.map(hourStr => {
                      const hourPrefix = hourStr.slice(0, 2);
                      const cols = viewMode === 'week' ? weekDays : [{ iso: selectedDate }];
                      const isCurrentHour = hourStr === currentHourStr;
                      const hourEmoji = getHourEmoji(hourStr);

                      return (
                        <div
                          key={hourStr}
                          className={`grid min-h-[68px] transition-colors ${
                            isCurrentHour ? 'bg-[#FFF5EB]' : ''
                          }`}
                          style={{
                            gridTemplateColumns: viewMode === 'week' ? '86px repeat(7, 1fr)' : '86px 1fr',
                          }}
                        >
                          <div className="p-2 flex flex-col items-end justify-start pr-2.5 text-[11px] font-mono border-r border-tf-border bg-[#FFF9F5]">
                            <div className="flex items-center gap-1 font-bold text-tf-text">
                              <span className="text-xs">{hourEmoji}</span>
                              <span>{hourStr}</span>
                            </div>
                            {isCurrentHour && (
                              <span className="mt-1 px-1.5 py-0.5 rounded-full bg-[#FF6B00] text-white text-[9px] font-extrabold animate-pulse badge-orange-white">
                                🔴 AGORA
                              </span>
                            )}
                          </div>

                          {cols.map(col => {
                            const slotTasks = filteredTasks.filter(
                              t => t.date === col.iso && (t.startTime || '09:00').slice(0, 2) === hourPrefix
                            );

                            return (
                              <div
                                key={col.iso + hourStr}
                                onDragOver={e => e.preventDefault()}
                                onDrop={() => handleDropOnSlot(col.iso, hourStr)}
                                onClick={e => {
                                  if (e.target === e.currentTarget) {
                                    onCreateAtSlot(col.iso, hourStr);
                                  }
                                }}
                                className="agenda-slot-cell relative p-1.5 border-r border-tf-border/50 cursor-pointer space-y-1.5"
                              >
                                {slotTasks.length === 0 && (
                                  <div
                                    onClick={() => onCreateAtSlot(col.iso, hourStr)}
                                    className="slot-add-hint h-full min-h-[48px] rounded-xl border border-dashed border-[#FB923C] bg-white/80 flex items-center justify-center gap-1 text-[11px] font-extrabold text-[#EA580C]"
                                  >
                                    <span>➕</span>
                                    <span>Agendar {hourStr} ✨</span>
                                  </div>
                                )}

                                {slotTasks.map(task => {
                                  const cat = getCategoryObj(task.category);
                                  const prio = PRIORITIES[task.priority] || PRIORITIES.high;
                                  const isCompleted = task.status === 'completed';
                                  const isConfirmed = task.status === 'confirmed' || isCompleted;
                                  return (
                                    <div
                                      key={task.id}
                                      draggable
                                      onDragStart={() => setDraggedTaskId(task.id)}
                                      onClick={ev => {
                                        ev.stopPropagation();
                                        onEditTask(task);
                                      }}
                                      className="agenda-task-card group rounded-2xl p-2.5 text-xs cursor-grab active:cursor-grabbing shadow-sm border border-orange-200 bg-white"
                                      style={{
                                        borderLeft: `5px solid ${cat.color}`,
                                      }}
                                      title="Arraste para outro horário ou clique para editar"
                                    >
                                      <div className="flex items-center justify-between gap-1">
                                        <span className="inline-flex items-center gap-1 font-mono font-extrabold text-[10px] text-[#EA580C]">
                                          <span className="emoji-wiggle">{cat.emoji}</span>
                                          <span>⏰ {task.startTime}</span>
                                        </span>
                                        <span className="inline-flex items-center gap-1 text-[10px]">
                                          <span>{prio.emoji}</span>
                                          <span title="Alertas WhatsApp & SMS ativos">📲</span>
                                          {task.notifyVoiceCall && <span title="Escalonamento de Ligação ativo">📞</span>}
                                        </span>
                                      </div>
                                      <div className="font-extrabold text-tf-text truncate mt-1 flex items-center gap-1">
                                        {isCompleted ? (
                                          <span title="Atividade Concluída">🏆</span>
                                        ) : isConfirmed ? (
                                          <span title="Presença Confirmada">✅</span>
                                        ) : (
                                          <span className="w-2 h-2 rounded-full bg-[#FF6B00] animate-ping shrink-0" />
                                        )}
                                        <span className={`truncate ${isCompleted ? 'line-through opacity-80' : ''}`}>{task.title}</span>
                                      </div>
                                      {(task.lastWhatsAppReply || (Array.isArray(task.observations) && task.observations.length > 0)) && (
                                        <div className="mt-1 px-2 py-1 rounded-lg bg-[#FFF7ED] border border-[#FDBA74] text-[10px] font-bold text-[#EA580C] truncate">
                                          💬 {task.observations?.length ? task.observations[task.observations.length - 1] : `WhatsApp: "${task.lastWhatsAppReply}"`}

                                      )}

                                        <span>{isCompleted ? '🏆 Concluída' : isConfirmed ? '🎉 Confirmado' : '🔔 5m•3m•2m•1m'}</span>
                                        <button
                                          type="button"
                                          onClick={ev => {
                                            ev.stopPropagation();
                                            onTriggerTelegramAlert(task, 'LEMBRETE MANUAL DA AGENDA', 'whatsapp');

                                          className="px-1.5 py-0.5 rounded bg-orange-100 hover:bg-[#FF6B00] text-[#EA580C] hover:text-white font-bold transition"

                                          📲 Enviar

                                      </div>
                                    </div>

                                })}
                              </div>
                            );
                          })}

                      );

                  </div>
                </div>
              </div>
            </div>

          {/* 2. VISUALIZAÇÃO MÊS ANIMADA COM EMOJIS */}
          {viewMode === 'month' && (
            <div className="rounded-3xl border-2 border-[#FED7AA] bg-white overflow-hidden shadow-xl animate-pop-in">
              <div className="grid grid-cols-7 border-b-2 border-[#FED7AA] bg-[#FFF7ED] text-center py-3 text-xs font-extrabold text-[#EA580C]">
                {['☀️ Dom', '🚀 Seg', '⚡ Ter', '🔥 Qua', '🎯 Qui', '✨ Sex', '🎉 Sáb'].map(d => (
                  <div key={d}>{d}</div>
                ))}
              </div>
              <div className="grid grid-cols-7 divide-x divide-y divide-tf-border">
                {monthCells.map(cell => {
                  const dayTasks = filteredTasks.filter(t => t.date === cell.iso);
                  const isToday = cell.iso === getTodayISO();
                  return (
                    <div
                      key={cell.iso}
                      onDragOver={e => e.preventDefault()}
                      onDrop={() => handleDropOnSlot(cell.iso, null)}
                      onClick={() => onCreateAtSlot(cell.iso, '09:00')}
                      className={`agenda-slot-cell min-h-[115px] p-2 cursor-pointer transition ${
                        !cell.isCurrentMonth ? 'opacity-40 bg-stone-50' : 'bg-white'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-1.5">

                          className={`w-7 h-7 rounded-xl flex items-center justify-center text-xs font-extrabold ${

                          {cell.dayNumber}
                        </span>
                        {dayTasks.length > 0 && (
                          <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-orange-100 text-[#EA580C] font-extrabold">
                            📌 {dayTasks.length}
                          </span>
                        )}
                      </div>
                      <div className="space-y-1">
                        {dayTasks.slice(0, 3).map(t => {
                          const cat = getCategoryObj(t.category);
                          return (
                            <div
                              key={t.id}
                              draggable
                              onDragStart={() => setDraggedTaskId(t.id)}
                              onClick={ev => {
                                ev.stopPropagation();
                                onEditTask(t);
                              }}
                              className="agenda-task-card truncate rounded-lg px-2 py-1 text-[11px] font-bold bg-[#FFF7ED] border border-orange-200"
                              style={{
                                color: cat.color,
                                borderLeft: `4px solid ${cat.color}`,
                              }}
                            >
                              {cat.emoji} {t.startTime} {t.title}
                            </div>
                          );
                        })}
                        {dayTasks.length > 3 && (
                          <div className="text-[10px] text-[#FF6B00] font-extrabold pl-1">
                            ✨ +{dayTasks.length - 3} mais
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 3. VISUALIZAÇÃO LISTA DE COMPROMISSOS ANIMADA */}
          {viewMode === 'list' && (
            <div className="rounded-3xl border-2 border-[#FED7AA] bg-white p-5 space-y-3 animate-pop-in">
              <h3 className="text-base font-extrabold text-tf-text flex items-center gap-2">
                <span className="text-xl animate-float">📋</span>
                <span>Lista Completa de Compromissos ✨</span>
              </h3>
              {filteredTasks.length === 0 ? (
                <div className="py-12 text-center space-y-3">
                  <div className="text-4xl animate-float">🗓️✨</div>
                  <div className="text-sm font-extrabold text-tf-text">

                    Clique em qualquer horário do calendário ou no botão abaixo para cadastrar seu primeiro compromisso com alertas automáticos no WhatsApp!
                  </p>
                  <button
                    onClick={() => onCreateAtSlot(selectedDate, '09:00')}
                    className="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white font-extrabold text-xs shadow-md hover:scale-105 transition"
                  >
                    ➕ Criar Primeiro Compromisso ✨
                  </button>
                </div>
              ) : (
                filteredTasks
                  .slice()
                  .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))
                  .map(task => {
                    const cat = getCategoryObj(task.category);
                    const stat = STATUS_MAP[task.status] || STATUS_MAP.pending;
                    return (
                      <div
                        key={task.id}
                        className="agenda-task-card flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-2xl bg-[#FFF7ED] border border-tf-border"
                      >
                        <div className="flex items-center gap-3">
                          <div
                            className="w-10 h-10 rounded-2xl flex items-center justify-center text-lg bg-white border border-orange-200 shadow-sm"
                          >
                            <span className="emoji-wiggle">{cat.emoji}</span>
                          </div>

                            <div className="flex flex-wrap items-center gap-2 text-xs">

                                {stat.label}

                                <span className="px-2 py-0.5 rounded-full bg-orange-100 text-[#EA580C] text-[10px] font-bold">
                                  🔄 Recorrente ({task.recurrence})

                              )}
                            </div>
                            <div
                              onClick={() => onEditTask(task)}
                              className="text-sm font-extrabold text-tf-text hover:text-[#EA580C] cursor-pointer mt-0.5"
                            >
                              {task.title}
                            </div>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => onTriggerTelegramAlert(task, 'Disparo Manual da Agenda', 'whatsapp')}
                            className="px-3.5 py-2 rounded-xl bg-[#FF6B00] text-white text-xs font-extrabold shadow-sm hover:scale-105 transition"
                          >
                            📲 WhatsApp
                          </button>
                          <button
                            onClick={() => onTriggerVoiceCall(task)}
                            className="px-3.5 py-2 rounded-xl bg-orange-100 text-[#EA580C] border border-[#FB923C] text-xs font-extrabold hover:scale-105 transition"
                          >
                            📞 Ligar
                          </button>
                        </div>
                      </div>
                    );
                  })
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 12. SEÇÕES 5, 6 E 7: 🔔 CENTRAL DE ALERTAS, TELEGRAM & LIGAÇÕES AUTOMÁTICAS
    // =========================================================================
    function AlertsEscalationView({
      tasks,
      notificationLogs,
      callLogs,
      settings,
      onTriggerTelegramAlert,
      onTriggerVoiceCall,
      onRunLiveFlowSimulation,
      onClearLogs,
      onNavigateToSettings,
    }) {
      const [selectedTaskId, setSelectedTaskId] = useState(tasks[0]?.id || '');
      const selectedTask = tasks.find(t => t.id === selectedTaskId) || tasks[0];

      const escalationSteps = [
        { offset: '-30 min', icon: '✈️', channel: 'Telegram Bot', title: '1º Alerta Preventivo', desc: 'Notificação antecipada para preparar o compromisso.' },
        { offset: '-15 min', icon: '✈️', channel: 'Telegram Bot', title: '2º Alerta de Proximidade', desc: 'Lembrete com link da reunião e resumo da atividade.' },
        { offset: '00 min',  icon: '🔔', channel: 'Telegram Interativo', title: 'Disparo no Horário Agendado', desc: 'Exibe botões ✅ CONFIRMAR, ⏰ ADIAR 10/30M e ❌ CANCELAR.' },
        { offset: '+05 min', icon: '⚠️', channel: 'Telegram Urgente', title: 'Cobrança por Falta de Resposta', desc: 'Enviado caso o usuário não confirme o primeiro alerta.' },
        { offset: `+${settings.waitMinutesBeforeCall || 10} min`, icon: '📞', channel: 'Ligação Automática (Voz + DTMF)', title: 'Escalonamento para Chamada Telefônica', desc: `Liga até ${settings.maxCallAttempts}x (a cada ${settings.callRetryIntervalMinutes} min) narrando a tarefa até pressionar a tecla 1.` },
      ];

      return (
        <div className="space-y-6">
          {/* Cabeçalho da Central de Alertas */}
          <div className="rounded-3xl border border-tf-border bg-gradient-to-r from-[#19231D] via-[#1B2620] to-[#292218] p-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div className="space-y-1">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#FF9F43]/20 text-[#FFD09B] text-xs font-bold">
                <span>🔁 MOTOR DE ESCALONAMENTO PERSISTENTE</span>
              </div>
              <h2 className="text-2xl font-extrabold text-tf-text">
                🔔 Central de Alertas & Ligações Automáticas
              </h2>
              <p className="text-xs sm:text-sm text-tf-muted">
                Acompanhe cada etapa de cobrança no Telegram, chamadas de voz realizadas e confirmações por teclado numérico (DTMF).
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button
                onClick={onNavigateToSettings}
                className="px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/15 text-xs font-bold text-tf-text transition"
              >
                ⚙️ Configurar Credenciais Telegram / Twilio
              </button>
              {selectedTask && (
                <button
                  onClick={() => onRunLiveFlowSimulation(selectedTask)}
                  className="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-[#FF9F43] to-[#FF6B00] text-[#101713] font-extrabold text-xs sm:text-sm shadow-lg hover:brightness-105 transition"
                >
                  🔥 Simular Escalonamento Completo
                </button>
              )}
            </div>
          </div>

          {/* Régua Visual do Motor de Escalonamento Configurável + Painel de Disparo Manual */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 rounded-3xl border border-tf-border bg-tf-card p-6 space-y-4">
              <div className="flex items-center justify-between">
                <h3 className="text-base font-extrabold text-tf-text">
                  📐 Regra de Escalonamento Ativa
                </h3>
                <span className="text-xs text-[#FF6B00] font-mono">
                  Horário de Silêncio: {settings.quietHoursEnabled ? `${settings.quietHoursStart} às ${settings.quietHoursEnd}` : 'Desativado'}
                </span>
              </div>

              <div className="space-y-3">
                {escalationSteps.map((step, index) => (
                  <div
                    key={index}
                    className="flex items-start gap-3.5 p-3.5 rounded-2xl bg-black/25 border border-tf-border hover:border-[#FF6B00]/40 transition"
                  >
                    <div className="w-16 shrink-0 text-center py-1.5 rounded-xl bg-[#FF6B00]/15 border border-[#FF6B00]/30 font-mono text-xs font-extrabold text-[#FF6B00]">
                      {step.offset}
                    </div>
                    <div className="text-2xl">{step.icon}</div>
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-bold text-tf-text">{step.title}</span>
                        <span className="text-[11px] px-2 py-0.5 rounded-full bg-white/5 text-tf-muted font-semibold">
                          {step.channel}
                        </span>
                      </div>
                      <p className="text-xs text-tf-muted mt-0.5">{step.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Painel de Teste Direto por Tarefa */}
            <div className="rounded-3xl border border-[#FF9F43]/40 bg-tf-card p-6 space-y-4 flex flex-col justify-between">
              <div className="space-y-3">
                <h3 className="text-base font-extrabold text-[#FFD09B]">
                  🧪 Console de Disparo Imediato
                </h3>
                <p className="text-xs text-tf-muted">
                  Selecione qualquer tarefa cadastrada para disparar o alerta no Telegram ou iniciar a ligação telefônica com voz em português e DTMF.
                </p>

                <div>
                  <label className="block text-xs font-bold uppercase text-tf-muted mb-1">
                    Selecionar Tarefa:
                  </label>
                  <select
                    value={selectedTask?.id || ''}
                    onChange={e => setSelectedTaskId(e.target.value)}
                    className="w-full rounded-xl bg-[#101713] border border-tf-border px-3 py-2.5 text-xs font-bold text-tf-text"
                  >
                    {tasks.map(t => (
                      <option key={t.id} value={t.id}>
                        {t.startTime} — {t.title}
                      </option>
                    ))}
                  </select>
                </div>

                {selectedTask && (
                  <div className="rounded-2xl bg-black/35 border border-white/10 p-3.5 text-xs space-y-1.5">
                    <div className="font-bold text-[#FF6B00]">{selectedTask.title}</div>
                    <div className="text-tf-muted">
                      📅 {formatDateBR(selectedTask.date)} às {selectedTask.startTime}

                    <div className="text-[11px] italic text-slate-300 pt-1">
                      🔊 Voz: "{selectedTask.customVoiceMessage ||
                        settings.defaultVoiceTemplate
                          .replace('{titulo}', selectedTask.title)
                          .replace('{horario}', selectedTask.startTime)}"

                  </div>
                )}
              </div>

              {selectedTask && (
                <div className="space-y-2 pt-3">
                  <button
                    onClick={() => onTriggerTelegramAlert(selectedTask, 'Disparo Manual pela Central')}
                    className="w-full py-2.5 px-4 rounded-xl bg-[#0088CC] hover:bg-[#0099E6] text-white font-bold text-xs transition flex items-center justify-center gap-2 shadow"
                  >
                    ✈️ 1. Enviar Lembrete no Telegram
                  </button>
                  <button
                    onClick={() => onTriggerVoiceCall(selectedTask)}
                    className="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-[#FF9F43] to-[#FF7700] text-[#101713] font-extrabold text-xs transition flex items-center justify-center gap-2 shadow"
