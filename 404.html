    // 15. SEÇÃO 9: ⚙️ CONFIGURAÇÕES COMPLETAS (PERFIL, TELEGRAM, TWILIO, REGRAS)
    // =========================================================================
    function SettingsView({
      settings,
      setSettings,
      categories,
      setCategories,
      onShowToast,
      onTriggerTelegramAlert,
      onTriggerVoiceCall,
      sampleTask,
    }) {
      const [detectingChat, setDetectingChat] = useState(false);
      const [testingTelegram, setTestingTelegram] = useState(false);

      const handleAutoDetectChatId = async () => {
        if (!settings.telegramBotToken?.trim()) {
          onShowToast('⚠️ Informe primeiro o Token do Bot do Telegram (obtido no @BotFather).', 'warning');
          return;
        }
        try {
          setDetectingChat(true);
          const info = await detectTelegramChatId(settings.telegramBotToken);
          setSettings(prev => ({
            ...prev,
            telegramChatId: info.chatId,
            telegramBotUsername: info.username,
          }));
          onShowToast(`✅ Chat ID detectado com sucesso: ${info.chatId} (${info.username})!`, 'success');
        } catch (err) {
          onShowToast(`❌ ${err.message}`, 'error');
        } finally {
          setDetectingChat(false);
        }

              await sendRealTelegramReminder({
                botToken: state.settings.telegramBotToken,
                chatId: state.settings.telegramChatId,
                task,
                stageLabel,
              });
              realSent = true;
            } catch (err) {}
          }

          // 2. Disparo Real no WhatsApp (Green-API / CallMeBot / Evolution / Twilio)
          try {
            const waRes = await sendRealWhatsAppReminder({
              settings: state.settings,
              task,
              stageLabel,
            });
            if (!waRes.simulated) {
              whatsappSent = true;
              showToast(`🟠📲 [${stageLabel}] enviado no seu WhatsApp (${state.settings.whatsappNumber || '+55 89 98102-6502'})!`, 'success');
            }
          } catch (err) {}

          // 3. Disparo Real de SMS (Twilio SMS, se configurado)
          try {
            const smsRes = await sendRealSmsReminder({
              settings: state.settings,
              task,
            });
            if (!smsRes.simulated) smsSent = true;
          } catch (err) {}

          const nowStr = new Date().toLocaleTimeString('pt-BR');
          const newLog = {
            id: 'log-' + Date.now(),
            taskId: task.id,
            taskTitle: task.title,
            channel: preferredTab,
            stageLabel: `🟠 ${stageLabel} (WhatsApp + SMS)`,
            status: realSent || whatsappSent || smsSent ? 'sent_real_api' : 'delivered_multichannel',
            userResponse: 'Ciclo ativo: 5m ➔ 3m ➔ 2m ➔ 1m ➔ Início ➔ Pós-Início',
            timestamp: `Hoje, ${nowStr}`,
          };

          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t =>
              t.id === task.id && t.status === 'pending' ? { ...t, status: 'notified' } : t
            ),
            notificationLogs: [newLog, ...prev.notificationLogs],
          }));

          setActiveTelegramPopup({
            task,
            stageLabel,
            realSent,
            whatsappSent,
            smsSent,
            preferredTab,
          });
        },
        [state.settings, showToast]
      );

      // =======================================================================
      // MONITORAMENTO AUTOMÁTICO SEGUNDO A SEGUNDO:
      // DISPARA EM: 5 MIN, 3 MIN, 2 MIN, 1 MIN ANTES, NO INÍCIO E APÓS O INÍCIO!
      // =======================================================================
      useEffect(() => {
        const todayISO = getTodayISO();
        const nowSecsTotal =
          nowTime.getHours() * 3600 + nowTime.getMinutes() * 60 + nowTime.getSeconds();

        state.tasks.forEach(task => {
          if (task.date !== todayISO) return;
          // Continua disparando enquanto NÃO estiver confirmada, concluída ou cancelada!
          if (['confirmed', 'completed', 'cancelled'].includes(task.status)) return;

          const [th, tm] = (task.startTime || '09:00').split(':').map(Number);
          const taskStartSecs = th * 3600 + tm * 60;
          const diffSeconds = taskStartSecs - nowSecsTotal;

          // Ignora tarefas antigas de demonstração que já passaram há mais de 10 minutos
          if (diffSeconds < -600) return;

          // Determina qual estágio da cadência (5m, 3m, 2m, 1m, 0m, +1m, +2m, +3m, +5m) deve disparar agora:
          let stageKey = null;
          let stageLabel = null;
          let shouldAlsoCall = false;

          if (diffSeconds <= 300 && diffSeconds > 180) {
            stageKey = 'minus_5';
            stageLabel = 'FALTAM 5 MINUTOS PARA O INÍCIO (1º Aviso)';
          } else if (diffSeconds <= 180 && diffSeconds > 120) {
            stageKey = 'minus_3';
            stageLabel = 'FALTAM 3 MINUTOS PARA O INÍCIO (2º Aviso)';
          } else if (diffSeconds <= 120 && diffSeconds > 60) {
            stageKey = 'minus_2';
            stageLabel = 'FALTAM 2 MINUTOS PARA O INÍCIO (3º Aviso)';
          } else if (diffSeconds <= 60 && diffSeconds > 0) {
            stageKey = 'minus_1';
            stageLabel = 'FALTA 1 MINUTO PARA O INÍCIO (4º Aviso)';
          } else if (diffSeconds <= 0 && diffSeconds > -60) {
            stageKey = 'start_0';
            stageLabel = 'INICIANDO AGORA (Horário Exato da Atividade)';
          } else if (diffSeconds <= -60 && diffSeconds > -120) {
            stageKey = 'after_1';
            stageLabel = 'APÓS O INÍCIO (+1 MINUTO SEM CONFIRMAÇÃO)';
          } else if (diffSeconds <= -120 && diffSeconds > -180) {
            stageKey = 'after_2';
            stageLabel = 'APÓS O INÍCIO (+2 MINUTOS SEM CONFIRMAÇÃO)';
          } else if (diffSeconds <= -180 && diffSeconds > -300) {
            stageKey = 'after_3';
            stageLabel = 'APÓS O INÍCIO (+3 MINUTOS - ALERTA CRÍTICO)';
            shouldAlsoCall = true;
          } else if (diffSeconds <= -300 && diffSeconds >= -600) {
            stageKey = 'after_5';
            stageLabel = 'APÓS O INÍCIO (+5 MINUTOS - COBRANÇA MÁXIMA)';
            shouldAlsoCall = true;
          }

          if (stageKey && !autoTriggeredStagesRef.current[`${task.id}_${stageKey}`]) {
            autoTriggeredStagesRef.current[`${task.id}_${stageKey}`] = true;
            handleTriggerTelegramAlert(task, stageLabel, 'whatsapp');
            showToast(`🟠⏰ [${stageLabel}] -> "${task.title}" enviado no WhatsApp e SMS!`, 'info');

            if (shouldAlsoCall) {
              if (escalationTimerRef.current) clearTimeout(escalationTimerRef.current);
              escalationTimerRef.current = setTimeout(() => {
                handleTriggerVoiceCall(task, 1);
              }, 6000);
            }
          }
        });
      }, [nowTime, state.tasks, handleTriggerTelegramAlert, showToast]);

      // Cria uma tarefa agendada para daqui a 5 minutos E permite testar toda a cadência (5m -> 3m -> 2m -> 1m -> Início -> Pós-Início)
      const handleScheduleAutoFiveMinDemo = useCallback(() => {
        clearAllRapidSequenceTimers();
        const now = new Date();
        const target = new Date(now.getTime() + 5 * 60 * 1000);
        const startHM = `${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}`;
        const endHM = addMinutesToTime(startHM, 45);
        const demoId = 'tf-auto5m-' + Date.now();

        const newTask = {
          id: demoId,
          title: 'Reunião Operacional (Ciclo 5m, 3m, 2m, 1m e Pós-Início)',
          description: 'Tarefa monitorada com avisos automáticos no WhatsApp/SMS faltando 5m, 3m, 2m, 1m, no início e após o início.',
          date: getTodayISO(),
          startTime: startHM,
          endTime: endHM,
          allDay: false,
          category: 'urgent',
          priority: 'urgent',
          status: 'pending',
          location: 'WhatsApp + SMS -> Voz',
          attachments: [],
          recurrence: 'none',
          leadTimeMinutes: 5,
          notifyWhatsApp: true,
          notifyTelegram: true,
          notifySms: true,
          notifyVoiceCall: true,
          requireConfirmation: true,
          isFavorite: true,
          estimatedMinutes: 45,
          customVoiceMessage: `Olá! Este é o seu assistente Meu Controle Max. Sua atividade ${startHM} já iniciou e aguarda confirmação. Pressione a tecla 1 para confirmar.`,
        };

        // Marca o estágio de 5 min e dispara a sequência demonstrativa completa no WhatsApp (5m -> 3m -> 2m -> 1m -> Pós-Início)
        autoTriggeredStagesRef.current[`${demoId}_minus_5`] = true;

        setState(prev => ({
          ...prev,
          tasks: [newTask, ...prev.tasks],
        }));

        showToast(
          `🟠⏱️ Tarefa criada para ${startHM}! Iniciando disparos no seu WhatsApp: 5 min ➔ 3 min ➔ 2 min ➔ 1 min ➔ Pós-Início!`,
          'success'
        );

        const cadenceDemoStages = [
          { delayMs: 500,   label: 'FALTAM 5 MINUTOS PARA O INÍCIO (1º Aviso)' },
          { delayMs: 8000,  label: 'FALTAM 3 MINUTOS PARA O INÍCIO (2º Aviso)' },
          { delayMs: 16000, label: 'FALTAM 2 MINUTOS PARA O INÍCIO (3º Aviso)' },
          { delayMs: 24000, label: 'FALTA 1 MINUTO PARA O INÍCIO (4º Aviso)' },
          { delayMs: 32000, label: 'APÓS O INÍCIO (+1 MINUTO - ATIVIDADE JÁ INICIOU!)' },
        ];

        cadenceDemoStages.forEach((step, idx) => {
          const timerId = setTimeout(() => {
            handleTriggerTelegramAlert(newTask, step.label, 'whatsapp');
            if (idx === cadenceDemoStages.length - 1) {
              if (escalationTimerRef.current) clearTimeout(escalationTimerRef.current);
              escalationTimerRef.current = setTimeout(() => {
                showToast('🚨 Pós-início sem confirmação! Iniciando Ligação Automática...', 'warning');
                handleTriggerVoiceCall(newTask, 1);
              }, 7000);
            }
          }, step.delayMs);
          rapidSequenceTimersRef.current.push(timerId);
        });
      }, [clearAllRapidSequenceTimers, handleTriggerTelegramAlert, showToast]);

      // =======================================================================
      // DISPARO DE LIGAÇÃO TELEFÔNICA AUTOMÁTICA (TWILIO API + VOZ PT-BR + DTMF)
      // =======================================================================
      const handleTriggerVoiceCall = useCallback(
        async (task, attemptNumber = 1) => {
          if (!task) return;
          if (escalationTimerRef.current) {
            clearTimeout(escalationTimerRef.current);
            escalationTimerRef.current = null;
          }

          setActiveTelegramPopup(null);

          const spokenScript =
            task.customVoiceMessage?.trim() ||
            state.settings.defaultVoiceTemplate
              .replace('{titulo}', task.title)
              .replace('{horario}', task.startTime || 'agora');

          let twilioCallSid = null;
          if (
            state.settings.twilioAccountSid &&
            state.settings.twilioAuthToken &&
            state.settings.twilioFromNumber &&
            state.settings.phone
          ) {
            try {
              const res = await triggerRealTwilioVoiceCall({
                accountSid: state.settings.twilioAccountSid,
                authToken: state.settings.twilioAuthToken,
                fromNumber: state.settings.twilioFromNumber,
                toNumber: state.settings.phone,
                spokenScript,
              });
              if (!res.simulated) {
                twilioCallSid = res.callSid;
                showToast(`📞 Chamada real iniciada na Twilio (SID: ${res.callSid})!`, 'success');
              }
            } catch (err) {
              showToast(`⚠️ Twilio API: ${err.message}. Iniciando chamada de voz local.`, 'warning');
            }
          }

          setActivePhoneCall({
            task,
            attempt: attemptNumber,
            maxAttempts: state.settings.maxCallAttempts || 3,
            spokenScript,
            toNumber: state.settings.phone,
            twilioCallSid,
          });
        },
        [state.settings, showToast]
      );

      // =======================================================================
      // CONFIRMAÇÃO, OBSERVAÇÕES DO WHATSAPP, ADIAMENTO E CANCELAMENTO
      // =======================================================================
      const processedWhatsAppMsgIdsRef = useRef(new Set());
      const whatsappPollSinceRef = useRef(Math.floor(Date.now() / 1000) - 900);

      const handleConfirmTaskReceipt = useCallback(
        (taskId, viaChannel = 'whatsapp', callDurationSecs = 18, customObservation = '', rawReplyText = '') => {
          clearAllRapidSequenceTimers();
          if (escalationTimerRef.current) {
            clearTimeout(escalationTimerRef.current);
            escalationTimerRef.current = null;
          }
          const target = state.tasks.find(t => t.id === taskId);
          const nowStr = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const cleanObs = String(customObservation || '').trim();
          const cleanRawReply = String(rawReplyText || (cleanObs ? `OK • ${cleanObs}` : 'OK')).trim();

          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t => {
              if (t.id !== taskId) return t;
              const prevObs = Array.isArray(t.observations) ? t.observations : [];
              const nextObs = cleanObs ? [...prevObs, `[${nowStr}] ${cleanObs}`] : prevObs;
              return {
                ...t,
                status: 'confirmed',
                confirmedVia: viaChannel,
                confirmedAt: nowStr,
                lastWhatsAppReply: cleanRawReply,
                observations: nextObs,
              };
            }),
            notificationLogs: [
              {
                id: 'log-conf-' + Date.now(),
                taskId,
                taskTitle: target?.title || 'Compromisso',
                channel: viaChannel === 'voice_dtmf' ? 'voice_call' : 'whatsapp',
                stageLabel:
                  viaChannel === 'voice_dtmf'
                    ? 'Ligação atendida • Tecla 1 pressionada (DTMF)'
                    : `Resposta identificada no WhatsApp: "${cleanRawReply}"`,
                status: 'confirmed',
                userResponse: cleanObs
                  ? `✅ Confirmado + 📝 Obs salva: "${cleanObs}"`
                  : `✅ Confirmado ("${cleanRawReply}") • Próximos alertas interrompidos`,
                timestamp: `Hoje, ${nowStr}`,
              },
              ...prev.notificationLogs,
            ],
            callLogs:
              viaChannel === 'voice_dtmf'
                ? [
                    {
                      id: 'call-' + Date.now(),
                      taskId,
                      taskTitle: target?.title || 'Compromisso',
                      toNumber: prev.settings.phone,
                      attempt: 1,
                      status: 'confirmed_dtmf',
                      dtmfDigit: '1',
                      durationSeconds: callDurationSecs,
                      timestamp: `Hoje, ${nowStr}`,
                      script: target?.customVoiceMessage || prev.settings.defaultVoiceTemplate,
                    },
                    ...prev.callLogs,
                  ]
                : prev.callLogs,
          }));

          setActiveTelegramPopup(null);
          setActivePhoneCall(null);

          // Envia confirmação real direto no seu WhatsApp (+55 89 98102-6502) via Green-API!
          const confirmText =
            `✅ *MEU CONTROLE MAX – RESPOSTA IDENTIFICADA!*\n\n` +
            `📌 *Atividade:* ${target?.title || 'Compromisso'}\n` +
            `📅 *Data:* ${formatDateBR(target?.date || getTodayISO())}\n` +
            `⏰ *Início:* ${target?.startTime || 'Agora'}\n` +
            `💬 *Sua Resposta:* "${cleanRawReply}"\n` +
            (cleanObs ? `📝 *Observação Salva na Agenda:* "${cleanObs}"\n` : '') +
            `✔️ *Status:* Presença Confirmada às ${nowStr}\n` +
            `🔕 *Ação:* Próximos alertas e ligação automática desativados!\n\n` +
            `💡 _Se precisar acrescentar mais alguma observação a esta atividade, basta enviar uma mensagem aqui no WhatsApp que eu adiciono automaticamente na sua agenda!_`;

          sendGreenApiWhatsAppMessage({
            settings: state.settings,
            text: confirmText,
          })
            .then(() => {
              showToast(
                cleanObs
                  ? `🟠✅ Confirmado e observação "${cleanObs}" salva na agenda!`
                  : `🟠✅ Resposta "${cleanRawReply}" identificada! Compromisso confirmado no WhatsApp!`,
                'success'
              );
            })
            .catch(() => {
              showToast(
                cleanObs
                  ? `✅ Confirmado e observação "${cleanObs}" salva!`
                  : '✅ Compromisso confirmado! Ligações automáticas desativadas.',
                'success'
              );
            });
        },
        [state.tasks, state.settings, clearAllRapidSequenceTimers, showToast]
      );

      // Marca a atividade como CONCLUÍDA (via resposta "CONCLUIDO" / "FEITO" no WhatsApp ou clique no popup)
      const handleCompleteTaskFromWhatsApp = useCallback(
        (taskId, viaChannel = 'whatsapp', customObservation = '', rawReplyText = 'CONCLUÍDO') => {
          clearAllRapidSequenceTimers();
          if (escalationTimerRef.current) {
            clearTimeout(escalationTimerRef.current);
            escalationTimerRef.current = null;
          }
          const target = state.tasks.find(t => t.id === taskId);
          const nowStr = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const cleanObs = String(customObservation || '').trim();
          const cleanRawReply = String(rawReplyText || (cleanObs ? `CONCLUÍDO • ${cleanObs}` : 'CONCLUÍDO')).trim();

          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t => {
              if (t.id !== taskId) return t;
              const prevObs = Array.isArray(t.observations) ? t.observations : [];
              const nextObs = cleanObs
                ? [...prevObs, `[${nowStr}] 🏆 Concluído: ${cleanObs}`]
                : [...prevObs, `[${nowStr}] 🏆 Atividade concluída via WhatsApp`];
              return {
                ...t,
                status: 'completed',
                completedVia: viaChannel,
                completedAt: nowStr,
                confirmedVia: t.confirmedVia || viaChannel,
                confirmedAt: t.confirmedAt || nowStr,
                lastWhatsAppReply: cleanRawReply,
                observations: nextObs,
              };
            }),
            notificationLogs: [
              {
                id: 'log-comp-' + Date.now(),
                taskId,
                taskTitle: target?.title || 'Compromisso',
                channel: 'whatsapp',
                stageLabel: `🏆 Atividade concluída pelo WhatsApp: "${cleanRawReply}"`,
                status: 'completed',
                userResponse: cleanObs
                  ? `🏆 CONCLUÍDA + 📝 Obs: "${cleanObs}"`
                  : `🏆 CONCLUÍDA ("${cleanRawReply}") • Todos os alertas encerrados`,
                timestamp: `Hoje, ${nowStr}`,
              },
              ...prev.notificationLogs,
            ],
          }));

          setActiveTelegramPopup(null);
          setActivePhoneCall(null);
          phoneAudio.playNotificationChime();

          const completeReceiptText =
            `🏆 *MEU CONTROLE MAX – ATIVIDADE CONCLUÍDA COM SUCESSO!* ✅\n\n` +
            `📌 *Atividade:* ${target?.title || 'Compromisso'}\n` +
            `📅 *Data:* ${formatDateBR(target?.date || getTodayISO())}\n` +
            `⏰ *Horário:* ${target?.startTime || 'Agora'}\n` +
            `💬 *Sua Resposta:* "${cleanRawReply}"\n` +
            (cleanObs ? `📝 *Observação Salva:* "${cleanObs}"\n` : '') +
            `🏅 *Status na Agenda:* CONCLUÍDA às ${nowStr}\n` +
            `🔕 *Ação:* Todos os lembretes desta atividade foram encerrados!`;

          sendGreenApiWhatsAppMessage({
            settings: state.settings,
            text: completeReceiptText,
          })
            .then(() => {
              showToast(
                cleanObs
                  ? `🏆 Atividade "${target?.title || 'Compromisso'}" CONCLUÍDA + observação "${cleanObs}" salva!`
                  : `🏆 Resposta "${cleanRawReply}" identificada! Atividade marcada como CONCLUÍDA!`,
                'success'
              );
            })
            .catch(() => {
              showToast(`🏆 Atividade marcada como CONCLUÍDA!`, 'success');
            });
        },
        [state.tasks, state.settings, clearAllRapidSequenceTimers, showToast]
      );

      // Adiciona uma observação vinda do WhatsApp mesmo quando a tarefa já estava confirmada ou concluída
      const handleAddObservationFromWhatsApp = useCallback(
        (taskId, noteText, rawReplyText) => {
          const target = state.tasks.find(t => t.id === taskId);
          if (!target || !noteText) return;
          const nowStr = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t => {
              if (t.id !== taskId) return t;
              const prevObs = Array.isArray(t.observations) ? t.observations : [];
              return {
                ...t,
                lastWhatsAppReply: rawReplyText || noteText,
                observations: [...prevObs, `[${nowStr}] ${noteText}`],
              };
            }),
            notificationLogs: [
              {
                id: 'log-obs-' + Date.now(),
                taskId,
                taskTitle: target.title,
                channel: 'whatsapp',
                stageLabel: `📝 Nova observação recebida via WhatsApp`,
                status: 'confirmed',
                userResponse: `📝 Observação adicionada: "${noteText}"`,
                timestamp: `Hoje, ${nowStr}`,
              },
              ...prev.notificationLogs,
            ],
          }));

          phoneAudio.playNotificationChime();
          showToast(`📝 Nova observação do WhatsApp salva em "${target.title}": "${noteText}"`, 'success');

          sendGreenApiWhatsAppMessage({
            settings: state.settings,
            text:
              `📝 *MEU CONTROLE MAX – OBSERVAÇÃO SALVA NA AGENDA!*\n\n` +
              `📌 *Atividade:* ${target.title} (${target.startTime})\n` +
              `💬 *Observação adicionada:* "${noteText}"\n` +
              `🕒 *Registrada às:* ${nowStr}\n` +
              `✅ _Já está visível no seu painel e na sua Agenda!_`,
          }).catch(() => {});
        },
        [state.tasks, state.settings, showToast]
      );

      // Polling em tempo real (a cada 3 segundos) das respostas do usuário no WhatsApp via Green-API
      useEffect(() => {
        const interval = setInterval(async () => {
          try {
            if (!state.tasks || state.tasks.length === 0) return;

            const replies = await pollGreenApiUserReplies({
              settings: state.settings,
              sinceTimestampSec: whatsappPollSinceRef.current,
              processedIdsSet: processedWhatsAppMsgIdsRef.current,
            });

            if (!replies || replies.length === 0) return;

            const todayISO = getTodayISO();
            for (const reply of replies) {
              const parsed = parseUserWhatsAppReply(reply.text);
              if (!parsed) continue;

              // Identifica a tarefa alvo:
              // Se o usuário enviou "CONCLUIDO", prioriza a tarefa aberta no popup, ou uma tarefa de hoje ainda não concluída (notificada, confirmada, em andamento ou pendente)
              const targetTask =
                parsed.action === 'complete'
                  ? activeTelegramPopup?.task ||
                    state.tasks.find(t => t.date === todayISO && t.status === 'notified') ||
                    state.tasks.find(t => t.date === todayISO && t.status === 'confirmed') ||
                    state.tasks.find(t => t.date === todayISO && ['in_progress', 'overdue', 'pending'].includes(t.status)) ||
                    state.tasks.find(t => t.status !== 'completed' && t.status !== 'cancelled') ||
                    state.tasks[0]
                  : activeTelegramPopup?.task ||
                    state.tasks.find(t => t.date === todayISO && t.status === 'notified') ||
                    state.tasks.find(t => t.date === todayISO && ['pending', 'overdue', 'in_progress'].includes(t.status)) ||
                    state.tasks.find(t => t.date === todayISO) ||
                    state.tasks[0];

              if (!targetTask) continue;

              if (parsed.action === 'complete') {
                handleCompleteTaskFromWhatsApp(targetTask.id, 'whatsapp', parsed.note || '', parsed.raw);
              } else if (parsed.action === 'snooze') {
                handleSnoozeTask(targetTask.id, parsed.minutes || 10);
              } else if (parsed.action === 'cancel') {
                handleCancelAlert(targetTask.id);
              } else if (parsed.action === 'confirm') {
                handleConfirmTaskReceipt(targetTask.id, 'whatsapp', 0, '', parsed.raw);
              } else if (parsed.action === 'confirm_and_note') {
                // Se a tarefa já estava confirmada ou concluída e o usuário enviou mais uma observação no WhatsApp, anexa a observação!
                if ((targetTask.status === 'confirmed' || targetTask.status === 'completed') && parsed.note) {
                  handleAddObservationFromWhatsApp(targetTask.id, parsed.note, parsed.raw);
                } else {
                  handleConfirmTaskReceipt(targetTask.id, 'whatsapp', 0, parsed.note, parsed.raw);
                }
              }
            }
          } catch (e) {}
        }, 3000);

        return () => clearInterval(interval);
      }, [
        state.tasks,
        state.settings,
        activeTelegramPopup,
        handleConfirmTaskReceipt,
        handleCompleteTaskFromWhatsApp,
        handleAddObservationFromWhatsApp,
      ]);

      const handleSnoozeTask = useCallback(
        (taskId, minutes) => {
          clearAllRapidSequenceTimers();
          if (escalationTimerRef.current) {
            clearTimeout(escalationTimerRef.current);
            escalationTimerRef.current = null;
          }
          const target = state.tasks.find(t => t.id === taskId);
          const nowStr = new Date().toLocaleTimeString('pt-BR');
          const newStart = addMinutesToTime(target?.startTime || '09:00', minutes);

          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t =>
              t.id === taskId
                ? {
                    ...t,
                    startTime: addMinutesToTime(t.startTime, minutes),
                    endTime: addMinutesToTime(t.endTime, minutes),
                    rescheduledCount: (t.rescheduledCount || 0) + 1,
                    status: 'pending',
                  }
                : t
            ),
            notificationLogs: [
              {
                id: 'log-snooze-' + Date.now(),
                taskId,
                taskTitle: target?.title || 'Compromisso',
                channel: 'whatsapp',
                stageLabel: `Adiado pelo usuário (+${minutes} min)`,
                status: 'snoozed',
                userResponse: `⏰ Adiado em ${minutes} minutos`,
                timestamp: `Hoje, ${nowStr}`,
              },
              ...prev.notificationLogs,
            ],
          }));

          setActiveTelegramPopup(null);
          setActivePhoneCall(null);

          sendGreenApiWhatsAppMessage({
            settings: state.settings,
            text:
              `⏰ *MEU CONTROLE MAX – COMPROMISSO ADIADO (+${minutes} MIN)*\n\n` +
              `📌 *Atividade:* ${target?.title || 'Compromisso'}\n` +
              `🕒 *Novo Horário:* ${newStart}\n` +
              `🔔 Você receberá um novo alerta faltando 5 minutos!`,
          }).catch(() => {});

          showToast(`⏰ Alerta adiado em ${minutes} minutos e aviso enviado ao WhatsApp!`, 'info');
        },
        [state.tasks, state.settings, showToast]
      );

      const handleCancelAlert = useCallback(
        (taskId) => {
          if (escalationTimerRef.current) {
            clearTimeout(escalationTimerRef.current);
            escalationTimerRef.current = null;
          }
          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t => (t.id === taskId ? { ...t, status: 'cancelled' } : t)),
          }));
          setActiveTelegramPopup(null);
          setActivePhoneCall(null);
          showToast('❌ Alerta cancelado e próximas tentativas interrompidas.', 'warning');
        },
        [showToast]
      );

      const handleHangupUnanswered = useCallback(
        (task) => {
          const nowStr = new Date().toLocaleTimeString('pt-BR');
          setState(prev => ({
            ...prev,
            callLogs: [
              {
                id: 'call-miss-' + Date.now(),
                taskId: task.id,
                taskTitle: task.title,
                toNumber: prev.settings.phone,
                attempt: 1,
                status: 'no_answer',
                dtmfDigit: '-',
                durationSeconds: 0,
                timestamp: `Hoje, ${nowStr}`,
                script: task.customVoiceMessage || prev.settings.defaultVoiceTemplate,
              },
              ...prev.callLogs,
            ],
          }));
          setActivePhoneCall(null);
          showToast(
            `📵 Ligação não atendida. Nova tentativa agendada em ${state.settings.callRetryIntervalMinutes} min (respeitando limite de ${state.settings.maxCallAttempts}x).`,
            'warning'
          );
        },
        [state.settings, showToast]
      );

      // =======================================================================
      // SIMULAÇÃO AO VIVO DO FLUXO COMPLETO (TELEGRAM -> SEM RESPOSTA -> LIGAÇÃO)
      // =======================================================================
      const handleRunLiveFlowSimulation = useCallback(
        (taskToUse) => {
          const target = taskToUse || state.tasks[0];
          if (!target) return;
          if (escalationTimerRef.current) clearTimeout(escalationTimerRef.current);

          handleTriggerTelegramAlert(
            target,
            '1º Alerta no Horário — Se não confirmar em 6s, escala para Ligação 📞'
          );
          showToast(
            '🚀 Fluxo iniciado! 1º Alerta enviado no Telegram. Se você não clicar em Confirmar em 6 segundos, o Meu Controle Max vai te ligar!',
            'info'
          );

          escalationTimerRef.current = setTimeout(() => {
            showToast('⚠️ Telegram ignorado! Escalonando cobrança para Ligação Telefônica Automática...', 'warning');
            handleTriggerVoiceCall(target, 1);
          }, 6500);
        },
        [state.tasks, handleTriggerTelegramAlert, handleTriggerVoiceCall, showToast]
      );

      // Polling real de cliques nos botões inline do Telegram + Auto-Detecção de Chat ID sem precisar clicar
      useEffect(() => {
        const token = state.settings.telegramBotToken?.trim();
        if (!token) return;
        const interval = setInterval(async () => {
          try {
            const offset = lastTelegramUpdateIdRef.current
              ? `?offset=${lastTelegramUpdateIdRef.current + 1}`
              : '';
            const res = await fetch(`https://api.telegram.org/bot${token}/getUpdates${offset}`);
            const data = await res.json();
            if (!data.ok || !Array.isArray(data.result)) return;
            for (const upd of data.result) {
              lastTelegramUpdateIdRef.current = upd.update_id;

              // Se ainda não tinha Chat ID salvo e chegou mensagem no Bot, salva sozinho e envia confirmação!
              const msg = upd.message;
              if (msg && msg.chat && msg.chat.id && !state.settings.telegramChatId) {
                const detectedId = String(msg.chat.id);
                setSettings(prev => ({
                  ...prev,
                  telegramChatId: detectedId,
                  telegramBotUsername: msg.chat.username || msg.chat.first_name || 'Conectado',
                }));
                showToast(`✈️ Telegram pareado automaticamente (Chat ID: ${detectedId})! Enviando alerta de confirmação...`, 'success');
                sendRealTelegramReminder({
                  botToken: token,
                  chatId: detectedId,
                  task: state.tasks[0] || {
                    id: 'welcome',
                    title: 'Automação Meu Controle Max Conectada!',
                    date: getTodayISO(),
                    startTime: '14:00',
                    priority: 'urgent',
                  },
                  stageLabel: 'Pareamento Automático Concluído ✅',
                }).catch(() => {});
              }

              const cb = upd.callback_query;
              if (cb && cb.data) {
                const [act, taskId] = String(cb.data).split(':');
                if (act === 'CONFIRM') handleConfirmTaskReceipt(taskId, 'telegram');
                if (act === 'SNOOZE_10') handleSnoozeTask(taskId, 10);
                if (act === 'SNOOZE_30') handleSnoozeTask(taskId, 30);
                if (act === 'CANCEL') handleCancelAlert(taskId);
              }
            }
          } catch (e) {}
        }, 3000);
        return () => clearInterval(interval);
      }, [state.settings.telegramBotToken, state.settings.telegramChatId, state.tasks, handleConfirmTaskReceipt, handleSnoozeTask, handleCancelAlert, showToast]);

      // Operações CRUD de Tarefas
      const handleSaveTask = (taskData) => {
        setState(prev => {
          const exists = prev.tasks.some(t => t.id === taskData.id);
          const nextTasks = exists
            ? prev.tasks.map(t => (t.id === taskData.id ? taskData : t))
            : [taskData, ...prev.tasks];
          return { ...prev, tasks: nextTasks };
        });
        setTaskModalOpen(false);
        setEditingTask(null);

        sendGreenApiWhatsAppMessage({
          settings: state.settings,
          text:
            `📅 *MEU CONTROLE MAX – NOVO COMPROMISSO AGENDADO!*\n\n` +
            `📌 *Atividade:* ${taskData.title}\n` +
            `📆 *Data:* ${formatDateBR(taskData.date)}\n` +
            `⏰ *Horário:* ${taskData.startTime} - ${taskData.endTime}\n` +
            `🔔 *Automação:* Você receberá um alerta aqui no WhatsApp faltando 5 minutos para o início!`,
        })
          .then(() => {
            showToast(
              `💾 Compromisso salvo e confirmação enviada para o seu WhatsApp (${state.settings.whatsappNumber || '+55 89 98102-6502'})!`,
              'success'
            );
          })
          .catch(() => {
            showToast('💾 Compromisso salvo e fila de alertas sincronizada!', 'success');
          });
      };

      const handleDeleteTask = (taskId) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.filter(t => t.id !== taskId),
        }));
        setTaskModalOpen(false);
        setEditingTask(null);
        showToast('🗑️ Tarefa removida da agenda.', 'info');
      };

      const handleToggleComplete = (taskId) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.map(t =>
            t.id === taskId
              ? { ...t, status: t.status === 'completed' ? 'pending' : 'completed' }
              : t
          ),
        }));
      };

      const handleSmartReschedule = (taskId) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.map(t =>
            t.id === taskId
              ? {
                  ...t,
                  startTime: addMinutesToTime(t.startTime, 60),
                  endTime: addMinutesToTime(t.endTime, 60),
                  rescheduledCount: (t.rescheduledCount || 0) + 1,
                }
              : t
          ),
        }));
        showToast('🔄 Reagendamento inteligente aplicado (+1 hora)!', 'info');
      };

      const handleMoveTaskSlot = (taskId, newDate, newHour) => {
        setState(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const nextStart = newHour || t.startTime;
            const nextEnd = newHour ? addMinutesToTime(newHour, 60) : t.endTime;
            return {
              ...t,
              date: newDate || t.date,
              startTime: nextStart,
              endTime: nextEnd,
              rescheduledCount: (t.rescheduledCount || 0) + 1,
            };
          }),
        }));
        showToast('📅 Compromisso reagendado no calendário!', 'success');
      };

      const navItems = [
        { id: 'dashboard', label: 'Dashboard',          icon: '🏠' },
        { id: 'calendar',  label: 'Agenda Inteligente', icon: '📅' },
        { id: 'alerts',    label: 'Central de Alertas', icon: '🔔', badge: state.notificationLogs.length },
        { id: 'assistant', label: 'Meu Assistente IA',  icon: '🤖' },
        { id: 'reports',   label: 'Produtividade',      icon: '📊' },
        { id: 'settings',  label: 'Configurações',      icon: '⚙️' },
      ];

      return (
        <div className="min-h-screen flex flex-col lg:flex-row bg-tf-bg text-tf-text">
          {/* SIDEBAR DESKTOP */}
          <aside className="hidden lg:flex lg:w-68 xl:w-72 shrink-0 flex-col justify-between border-r border-tf-border bg-tf-card p-5">
            <div className="space-y-6">
              {/* Logo Meu Controle Max */}
              <div className="flex items-center justify-between px-2">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#FF6B00] to-[#FF9F43] flex items-center justify-center text-white font-extrabold text-xl shadow-lg badge-orange-white">
                    M
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="font-extrabold text-base tracking-tight text-tf-text">MEU CONTROLE MAX</span>
                    </div>
                    <p className="text-[11px] text-[#EA580C] font-bold">Gestão & Alertas Inteligentes</p>
                  </div>
                </div>
              </div>

              {/* Botão Rápido de Criar Compromisso */}
              <button
                onClick={() => {
                  setEditingTask(null);
                  setTaskModalOpen(true);
                }}
                className="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white font-extrabold text-xs sm:text-sm shadow-lg hover:brightness-105 transition flex items-center justify-center gap-2"
              >
                <span>➕</span>
                <span>Novo Compromisso</span>
              </button>

              {/* Navegação Principal */}
              <nav className="space-y-1.5">
                {navItems.map(item => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-xs sm:text-sm font-bold transition ${
                        isActive
                          ? 'bg-gradient-to-r from-[#FF6B00] to-[#FF8C1A] text-white border border-[#EA580C] shadow badge-orange-white'
                          : 'text-tf-muted hover:text-[#EA580C] hover:bg-orange-50'
                      }`}
                    >
                      <span className="flex items-center gap-3">
                        <span className="text-base">{item.icon}</span>
                        <span>{item.label}</span>
                      </span>
                      {item.badge ? (
                        <span className="px-2 py-0.5 rounded-full text-[10px] bg-white text-[#EA580C] font-extrabold">
                          {item.badge}
                        </span>
                      ) : null}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Card de Status das Integrações na Sidebar */}
            <div className="rounded-2xl border border-tf-border bg-[#FFF7ED] p-4 space-y-2.5 text-xs">
              <div className="font-extrabold text-[#EA580C] flex items-center justify-between">
                <span>⚡ Ciclo Automático Ativo</span>
                <span className="w-2 h-2 rounded-full bg-[#FF6B00] animate-ping" />
              </div>
              <div className="flex items-center justify-between text-[11px]">
                <span className="text-tf-muted">🟠 WhatsApp (5, 3, 2, 1m)</span>
                <span className="text-[#EA580C] font-bold">Ativo</span>
              </div>
              <div className="flex items-center justify-between text-[11px]">
                <span className="text-tf-muted">💬 SMS Pós-Início</span>
                <span className="text-[#EA580C] font-bold">Ativo</span>
              </div>
              <div className="flex items-center justify-between text-[11px]">
                <span className="text-tf-muted">✈️ Telegram Bot</span>
                <span className="text-[#EA580C] font-bold">Online</span>
              </div>
              <div className="flex items-center justify-between text-[11px]">
                <span className="text-tf-muted">📞 Ligação (DTMF)</span>
                <span className="text-[#EA580C] font-bold">Escala Auto</span>
              </div>
              <p className="text-[10px] text-tf-muted pt-1 border-t border-orange-200">
                "MEU CONTROLE MAX — Organize seu tempo. Não perca nenhum compromisso."
              </p>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <div className="flex-1 flex flex-col min-w-0 pb-24 lg:pb-8">
            {/* Topbar */}
            <header className="sticky top-0 z-30 glass-panel border-b border-tf-border px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="lg:hidden w-9 h-9 rounded-xl bg-gradient-to-br from-[#FF6B00] to-[#FF9F43] flex items-center justify-center text-white font-extrabold badge-orange-white">
                  M
                </div>
                <div>
                  <span className="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-[#EA580C]">
                    MEU CONTROLE MAX • GESTÃO INTELIGENTE
                  </span>
                  <div className="text-xs text-tf-muted hidden sm:block">
                    Organize seu tempo. Alertas em 5m, 3m, 2m, 1m e Pós-Início no WhatsApp & SMS.
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => setActiveTab('assistant')}
                  className="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-tf-border text-xs font-bold text-tf-text flex items-center gap-1.5"
                >
                  <span>🤖</span>
                  <span className="hidden sm:inline">Assistente IA</span>
                </button>
                <button
                  onClick={() => handleTriggerVoiceCall(state.tasks[0])}
                  className="px-3 py-1.5 rounded-xl bg-[#FF9F43]/20 hover:bg-[#FF9F43]/30 border border-[#FF9F43]/40 text-xs font-bold text-[#FFD09B] flex items-center gap-1.5"
                >
                  <span>📞</span>
                  <span className="hidden sm:inline">Testar Ligação</span>
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  className="flex items-center gap-2 pl-2 pr-3 py-1 rounded-full bg-white/5 hover:bg-white/10 border border-tf-border text-xs font-bold"
                >
                  <span className="w-6 h-6 rounded-full bg-[#FF6B00] text-[#101713] flex items-center justify-center font-extrabold text-[11px]">
                    {(state.settings.fullName || 'AR').slice(0, 2).toUpperCase()}
                  </span>
                  <span className="hidden md:inline truncate max-w-[120px]">{state.settings.fullName}</span>
                </button>
              </div>
            </header>

            {/* Toast de Feedback em Tempo Real */}
            {toast && (
              <div className="fixed top-16 right-4 z-50 max-w-md rounded-2xl border border-[#FF6B00]/50 bg-[#142019] px-4 py-3 text-xs sm:text-sm font-bold text-tf-text shadow-2xl flex items-center gap-3">
                <span>{toast.message}</span>
                <button onClick={() => setToast(null)} className="text-tf-muted hover:text-white">✕</button>
              </div>
            )}

            {/* Área das Páginas */}
            <main className="p-4 sm:p-6 max-w-7xl w-full mx-auto flex-1">
              {activeTab === 'dashboard' && (
                <DashboardView
                  tasks={state.tasks}
                  categories={state.categories}
                  nowTime={nowTime}
                  settings={state.settings}
                  setSettings={setSettings}
                  focusModeOnly={focusModeOnly}
                  setFocusModeOnly={setFocusModeOnly}
                  onOpenNewTask={() => {
                    setEditingTask(null);
                    setTaskModalOpen(true);
                  }}
                  onEditTask={task => {
                    setEditingTask(task);
                    setTaskModalOpen(true);
                  }}
                  onToggleComplete={handleToggleComplete}
                  onSmartReschedule={handleSmartReschedule}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                  onRunLiveFlowSimulation={handleRunLiveFlowSimulation}
                  onScheduleAutoFiveMinDemo={handleScheduleAutoFiveMinDemo}
                  onSelectDateInCalendar={dt => {
                    setSelectedCalendarDate(dt);
                    setActiveTab('calendar');
                  }}
                />
              )}

              {activeTab === 'calendar' && (
                <SmartCalendarView
                  tasks={state.tasks}
                  categories={state.categories}
                  selectedDate={selectedCalendarDate}
                  setSelectedDate={setSelectedCalendarDate}
                  onCreateAtSlot={(dateISO, hourStr) => {
                    setEditingTask({
                      date: dateISO,
                      startTime: hourStr,
                      endTime: addMinutesToTime(hourStr, 60),
                    });
                    setTaskModalOpen(true);
                  }}
                  onEditTask={task => {
                    setEditingTask(task);
                    setTaskModalOpen(true);
                  }}
                  onMoveTaskSlot={handleMoveTaskSlot}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                />
              )}

              {activeTab === 'alerts' && (
                <AlertsEscalationView
                  tasks={state.tasks}
                  notificationLogs={state.notificationLogs}
                  callLogs={state.callLogs}
                  settings={state.settings}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                  onRunLiveFlowSimulation={handleRunLiveFlowSimulation}
                  onNavigateToSettings={() => setActiveTab('settings')}
                />
              )}

              {activeTab === 'assistant' && (
                <SmartAssistantView
                  categories={state.categories}
                  onConfirmAssistantTask={suggestion => {
                    handleSaveTask({
                      ...suggestion,
                      id: 'tf-task-' + Date.now(),
                      status: 'pending',
                      attachments: [],
                      isFavorite: true,
                      estimatedMinutes: 60,
                    });
                  }}
                />
              )}

              {activeTab === 'reports' && (
                <ReportsProductivityView
                  tasks={state.tasks}
                  callLogs={state.callLogs}
                  settings={state.settings}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsView
                  settings={state.settings}
                  setSettings={setSettings}
                  categories={state.categories}
                  setCategories={setCategories}
                  onShowToast={showToast}
                  onTriggerTelegramAlert={handleTriggerTelegramAlert}
                  onTriggerVoiceCall={handleTriggerVoiceCall}
                  sampleTask={state.tasks[0]}
                />
              )}
            </main>
          </div>

          {/* EXPERIÊNCIA MOBILE (SEÇÃO 12): BOTÃO FLUTUANTE (FAB) + MENU INFERIOR */}
          <button
            onClick={() => {
              setEditingTask(null);
              setTaskModalOpen(true);
            }}
            className="lg:hidden fixed bottom-20 right-4 z-40 w-14 h-14 rounded-2xl bg-gradient-to-br from-[#FF6B00] to-[#FF9F43] text-[#101713] font-extrabold text-2xl shadow-2xl flex items-center justify-center"
            title="Nova Tarefa"
          >
            ➕
          </button>

          <nav className="lg:hidden fixed bottom-0 inset-x-0 z-40 glass-panel border-t border-tf-border px-2 py-1.5 grid grid-cols-6 gap-1">
            {navItems.map(item => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center py-1.5 rounded-xl text-[10px] font-bold transition ${
                    isActive ? 'text-[#FF6B00] bg-white/5' : 'text-tf-muted'
                  }`}
                >
                  <span className="text-base">{item.icon}</span>
                  <span className="truncate max-w-[56px]">{item.label.split(' ')[0]}</span>
                </button>
              );
            })}
          </nav>

          {/* MODAL DE CADASTRO / EDIÇÃO DE TAREFAS */}
          <TaskFormModal
            isOpen={taskModalOpen}
            initialTask={editingTask}
            categories={state.categories}
            onClose={() => {
              setTaskModalOpen(false);
              setEditingTask(null);
            }}
            onSave={handleSaveTask}
            onDelete={handleDeleteTask}
            onTestEscalation={task => {
              setTaskModalOpen(false);
              handleRunLiveFlowSimulation(task);
            }}
          />

          {/* POPUP INTERATIVO MULTI-CANAL (WHATSAPP + TELEGRAM + SMS FALTANDO 5 MIN) */}
          <TelegramAlertPopup
            alertData={activeTelegramPopup}
            userPhone={state.settings.whatsappNumber || state.settings.phone}
            onConfirm={handleConfirmTaskReceipt}
            onComplete={handleCompleteTaskFromWhatsApp}
            onSnooze={handleSnoozeTask}
            onCancelAlert={handleCancelAlert}
            onClose={() => setActiveTelegramPopup(null)}
            onEscalateToCallNow={task => handleTriggerVoiceCall(task, 1)}
          />

          {/* MODAL DE LIGAÇÃO AUTOMÁTICA INTELIGENTE COM VOZ PT-BR E RECONHECIMENTO DTMF (TECLA 1) */}
          <AutomaticPhoneCallModal
            callSession={activePhoneCall}
            onConfirmDTMF={(taskId, duration) =>
              handleConfirmTaskReceipt(taskId, 'voice_dtmf', duration)
            }
            onSnoozeDTMF={handleSnoozeTask}
            onHangupUnanswered={handleHangupUnanswered}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MeuControleMaxApp />);
  </script>
</body>
</html>
